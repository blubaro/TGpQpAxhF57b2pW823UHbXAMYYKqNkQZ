<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Coach Runner</title>
<link rel="manifest" href='data:application/json,{"name":"Coach Runner","short_name":"Runner","start_url":"./","display":"standalone","background_color":"%23FFFFFF","theme_color":"%23F4F6F8","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27%3E%3Crect width=%27192%27 height=%27192%27 rx=%2742%27 fill=%27%232D7DC4%27/%3E%3Crect x=%2780%27 y=%2722%27 width=%2732%27 height=%2715%27 rx=%276%27 fill=%27%23FFFFFF%27/%3E%3Ccircle cx=%2796%27 cy=%27104%27 r=%2752%27 fill=%27none%27 stroke=%27%23FFFFFF%27 stroke-width=%2713%27/%3E%3Cpath d=%27M74 104 l14 16 l28 -34%27 fill=%27none%27 stroke=%27%23FFFFFF%27 stroke-width=%2713%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml","purpose":"any maskable"}]}'>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%232D7DC4'/%3E%3Crect x='80' y='22' width='32' height='15' rx='6' fill='%23FFFFFF'/%3E%3Ccircle cx='96' cy='104' r='52' fill='none' stroke='%23FFFFFF' stroke-width='13'/%3E%3Cpath d='M74 104 l14 16 l28 -34' fill='none' stroke='%23FFFFFF' stroke-width='13' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#F4F6F8; --card:#FFFFFF; --ink:#2E3338; --muted:#7E868C;
  --line:#E8EAED; --line-strong:#D5DADE;
  /* Primärfarbe (Buttons, Fortschritt, Links) — concept2-Blau */
  --accent:#2D7DC4; --accent-ink:#1F5E97; --accent-soft:#E2EEF8;
  /* Phasen-Farben: Arbeit warm, Pause blau, Mobility ruhiges Grün */
  --work:#E5562C; --work-ink:#B53C18; --work-soft:#FBE7DE;
  --rest:#2D7DC4; --rest-ink:#1F5E97; --rest-soft:#E2EEF8;
  --mob:#2E9E7B; --mob-ink:#1F7A5E; --mob-soft:#DCF1EA;
  --good:#2E9E7B; --good-soft:#DCF1EA;
  --shadow:0 1px 2px rgba(35,40,46,.04),0 4px 16px rgba(35,40,46,.06);
  --r:18px; --r-sm:12px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
/* ---- Themes (umschaltbar via [data-theme] an <html>; Default = amoled, s. JS) ----
   Regel: -ink = gut lesbare Textfarbe auf -soft-Fläche DIESES Themes,
   -soft = flächige Tönung. In dunklen Themes sind -ink hell, -soft dunkel. */
:root[data-theme="amoled"]{
  --paper:#000000; --card:#0C0E10; --ink:#F2F4F6; --muted:#9AA2A8;
  --line:#20242A; --line-strong:#2E343B;
  --accent:#3E9BE8; --accent-ink:#8CC7F2; --accent-soft:#0E2233;
  --work:#FF6A3D; --work-ink:#FFB39A; --work-soft:#2A130B;
  --rest:#3E9BE8; --rest-ink:#8CC7F2; --rest-soft:#0E2233;
  --mob:#34C08A; --mob-ink:#8FE3C4; --mob-soft:#08221A;
  --good:#34C08A; --good-soft:#08221A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.6);
}
:root[data-theme="sepia"]{
  --paper:#F3EBDD; --card:#FBF6EC; --ink:#4A3F33; --muted:#8C7E6B;
  --line:#E3D8C6; --line-strong:#D2C4AD;
  --accent:#B5722E; --accent-ink:#8A551D; --accent-soft:#EFE0CB;
  --work:#C6551F; --work-ink:#9A3D12; --work-soft:#F0DDCB;
  --rest:#5E86A8; --rest-ink:#3E5F7D; --rest-soft:#DDE6ED;
  --mob:#6E8B4E; --mob-ink:#51683A; --mob-soft:#E2E7D2;
  --good:#6E8B4E; --good-soft:#E2E7D2;
  --shadow:0 1px 2px rgba(74,63,51,.05),0 4px 16px rgba(74,63,51,.08);
}
:root[data-theme="contrast"]{
  --paper:#FFFFFF; --card:#FFFFFF; --ink:#0A0C0E; --muted:#3A4046;
  --line:#8B9298; --line-strong:#3A4046;
  --accent:#0A5FB4; --accent-ink:#08477F; --accent-soft:#D6E6F5;
  --work:#C62F00; --work-ink:#8E2200; --work-soft:#FBDDD2;
  --rest:#0A5FB4; --rest-ink:#08477F; --rest-soft:#D6E6F5;
  --mob:#0B7A4B; --mob-ink:#075733; --mob-soft:#CFEAD9;
  --good:#0B7A4B; --good-soft:#CFEAD9;
  --shadow:none;
}
:root[data-theme="coral"]{
  --paper:#FBF6F4; --card:#FFFFFF; --ink:#33292A; --muted:#8A7A7B;
  --line:#F0E4E0; --line-strong:#E3D0CB;
  --accent:#EC5F52; --accent-ink:#C23B2E; --accent-soft:#FCE4E0;
  --work:#E5562C; --work-ink:#B53C18; --work-soft:#FBE7DE;
  --rest:#2AA9A0; --rest-ink:#1B7B74; --rest-soft:#D6EFEC;
  --mob:#2E9E7B; --mob-ink:#1F7A5E; --mob-soft:#DCF1EA;
  --good:#2E9E7B; --good-soft:#DCF1EA;
  --shadow:0 1px 2px rgba(51,41,42,.05),0 4px 16px rgba(51,41,42,.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* iOS: 100% lügt bei ein-/ausfahrender Safari-Leiste → dvh, außen nichts scrollen lassen */
html,body{height:100%;overflow:hidden}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;
  font-feature-settings:"tnum" 1; -webkit-font-smoothing:antialiased;
  line-height:1.45; overscroll-behavior-y:none;
}
.tnum{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;padding-top:var(--safe-t)}
#main{display:contents}            /* mobil: topbar/screen/actionbar bleiben Flex-Kinder von #app */
.rail{display:none}                /* mobil + schmaler Desktop: keine Seitenspalten */
#topbar:empty{display:none}
#actionbar:empty{display:none}
.scroll{flex:1;overflow-y:auto;padding:16px 18px calc(112px + var(--safe-b));
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ---- Seitenspalten (Verlauf links / Hinweise rechts) ---- */
.rail-head{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.rail-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.rail-card .note{margin-bottom:0}
.rail-title{font-weight:750;font-size:15px;margin-top:6px}
.rail-empty{font-size:13px;padding:4px 2px}
.vl{display:flex;flex-direction:column;gap:1px}
.vl-item{display:flex;gap:11px;padding:9px 8px;border-radius:11px;align-items:flex-start;cursor:pointer}
.vl-item:hover{background:var(--paper)}
.vl-item:active{transform:scale(.99)}
.vl-cur{background:var(--accent-soft)}
.vl-cur:hover{background:var(--accent-soft)}
.vl-dot{width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;
  font-size:12px;font-weight:800;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.vl-done .vl-dot{background:var(--good);color:#fff;border-color:transparent}
.vl-skip .vl-dot{background:var(--line-strong);color:#fff;border-color:transparent}
.vl-cur  .vl-dot{background:var(--accent);color:#fff;border-color:transparent}
.vl-title{font-size:14px;font-weight:650;line-height:1.25}
.vl-cur .vl-title{font-weight:800}
.vl-todo .vl-title{color:var(--muted)}
.vl-meta{font-size:11.5px;color:var(--muted);margin-top:1px}

/* ---- Desktop: drei Spalten, nur während eines laufenden Workouts ---- */
@media (min-width:980px){
  body.run-mode #app{max-width:1340px;display:grid;
    grid-template-columns:320px minmax(0,1fr) 384px;gap:20px;padding:0 14px;
    height:100dvh;align-items:stretch}
  body.run-mode #main{display:flex;flex-direction:column;min-width:0;height:100%}
  body.run-mode .rail{display:block;height:100%;overflow-y:auto;padding:24px 2px 30px}
  body.run-mode .scroll{padding:24px 6px 28px}
  body.run-mode .topbar{position:static}
  body.run-mode .actionbar{position:static;left:auto;right:auto;max-width:none;margin:0;
    padding:16px 6px calc(20px + var(--safe-b));background:none;border-top:1px solid var(--line)}
  body.run-mode .disc{display:none}        /* Hinweis lebt auf dem Desktop in der rechten Spalte */
  body.run-mode .last-note{display:none}   /* "Letztes Mal" ebenso → rechte Spalte */
  body.run-mode .timer .ring{width:290px}  /* breite Mittelspalte → Ring darf größer */
  body.run-mode .timer .ring .t-val{font-size:74px}
}

/* ---- typography ---- */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(23px,6.5vw,26px);font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{font-size:19px;font-weight:750;letter-spacing:-.01em}
.big-num{font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.center{text-align:center}
/* Übungs-Titel im Run: kompakter als h1, max. 2 Zeilen statt unkontrolliertem Umbruch */
.run-title{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);
  display:flex;align-items:center;gap:12px;padding:14px 52px 10px 18px;
  border-bottom:1px solid var(--line)}
/* Theme-Umschalter — fixer Button oben rechts, auf allen Screens erreichbar.
   SVG-Icon statt Emoji (Emoji rendert auf iOS als bunter Fremdkörper) + Milchglas-Fläche. */
.theme-btn{position:fixed;top:calc(10px + var(--safe-t));right:12px;z-index:40;
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--muted);line-height:0;
  display:grid;place-items:center;cursor:pointer}
@supports (backdrop-filter:blur(4px)) or (-webkit-backdrop-filter:blur(4px)){
  .theme-btn{background:color-mix(in srgb,var(--card) 70%,transparent);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
}
.theme-btn:active{transform:scale(.92)}
.topbar .prog-wrap{flex:1}
.topbar .prog-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line-strong);
  background:var(--card);font-size:17px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:disabled{opacity:.32}
.iconbtn:active:not(:disabled){background:var(--paper)}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card.flush{padding:0;overflow:hidden}

/* ---- buttons ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  min-height:58px;border-radius:var(--r-sm);border:none;font-size:17px;font-weight:700;
  background:var(--accent);color:#fff;cursor:pointer;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.4}
.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line-strong)}
.btn.ghost{background:transparent;color:var(--muted);min-height:48px;font-weight:600;border:none}
.btn.good{background:var(--good)}
.btn.sm{min-height:46px;font-size:15px}
.btn-row{display:flex;gap:10px}

/* ---- bottom action bar ----
   pointer-events:none auf der Bar selbst: der transparente Gradient-Anteil ragt über den
   Inhalt und darf Taps auf darunterliegende Elemente NICHT schlucken (iOS-Bug: "nicht
   immer klickbar"). Die Buttons selbst fangen ihre Events wieder ein. */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none;
  background:linear-gradient(to top,var(--paper) 62%,transparent);
  padding:12px 18px calc(12px + var(--safe-b));max-width:520px;margin:0 auto}
.actionbar > *{pointer-events:auto}

/* ---- steppers ---- */
.field{margin:14px 0}
.field .lab{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.field .lab .hint{text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted)}
.stepper{display:flex;align-items:stretch;gap:10px}
.stepper button{width:60px;flex:none;border:1.5px solid var(--line-strong);background:var(--card);
  border-radius:14px;font-size:26px;font-weight:600;color:var(--ink);cursor:pointer}
.stepper button:active{background:var(--paper)}
.stepper .val{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1.5px solid var(--line);border-radius:14px;background:var(--paper);padding:6px 0}
.stepper .val b{font-size:30px;font-weight:800;line-height:1}
.stepper .val small{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:99px;border:1.5px solid var(--line-strong);
  background:var(--card);font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

input.txt,textarea.txt{width:100%;border:1.5px solid var(--line);border-radius:12px;
  background:var(--paper);padding:13px 14px;font-size:16px;font-family:inherit;color:var(--ink)}
textarea.txt{resize:vertical;min-height:64px}

/* checklist */
.check{display:flex;align-items:center;gap:13px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:none}
.check .box{width:26px;height:26px;flex:none;border:2px solid var(--line-strong);border-radius:8px;display:grid;place-items:center;font-size:15px;color:#fff}
.check.on .box{background:var(--good);border-color:var(--good)}
.check.on span{color:var(--muted);text-decoration:line-through}

/* big timer */
.timer{display:flex;flex-direction:column;align-items:center;padding:4px 0}
/* Ring skaliert mit dem Viewport (kleine iPhones: kein Abschneiden, kein Extra-Scroll) */
.timer .ring{position:relative;width:min(240px,62vw);aspect-ratio:1;display:grid;place-items:center;margin:4px 0}
.timer .ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer .ring .t-val{font-size:clamp(42px,16vw,62px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.timer .ring .t-sub{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.phase-work .ring circle.fg{stroke:var(--work)}
.phase-rest .ring circle.fg{stroke:var(--rest)}
.phase-mob  .ring circle.fg{stroke:var(--mob)}
.phase-work .t-sub{color:var(--work-ink)}
.phase-rest .t-sub{color:var(--rest-ink)}
.phase-mob  .t-sub{color:var(--mob-ink)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;
  font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line)}
.pill.work{background:var(--work-soft);color:var(--work-ink);border-color:transparent}
.pill.rest{background:var(--rest-soft);color:var(--rest-ink);border-color:transparent}
.pill.mob{background:var(--mob-soft);color:var(--mob-ink);border-color:transparent}
.pill.z2{background:var(--good-soft);color:var(--good);border-color:transparent}

.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:750}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:7px;background:var(--accent-soft);color:var(--accent-ink)}
.tag.row{background:var(--mob-soft);color:var(--mob-ink)}
.tag.done{background:var(--good-soft);color:var(--good)}

.stack-sm > * + *{margin-top:8px}
.set-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.set-row:last-child{border-bottom:none}
.set-row .n{width:26px;height:26px;flex:none;border-radius:7px;background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.set-row .n.ok{background:var(--good);color:#fff}

/* einklappbarer Hinweis (i) — hält den Cue aus dem Weg, bis er gebraucht wird */
.disc{margin-bottom:14px}
.disc-toggle{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);
  color:var(--accent-ink);border:none;border-radius:99px;padding:8px 14px;font-size:13px;
  font-weight:700;cursor:pointer}
.disc-toggle:active{filter:brightness(.97)}
.disc-caret{font-size:10px;opacity:.7}
.disc-body{display:none;margin-top:9px}
.disc.open .disc-body{display:block}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

.divider{height:1px;background:var(--line);margin:16px 0}
.note{font-size:13.5px;color:var(--muted);background:var(--paper);border-radius:12px;padding:11px 13px;border:1px solid var(--line)}
.celebrate{background:linear-gradient(135deg,var(--accent),#1F5E97);color:#fff;border:none}
.celebrate .eyebrow,.celebrate .muted{color:rgba(255,255,255,.85)}
.hidden{display:none!important}
a{color:var(--accent-ink)}
::selection{background:var(--accent-soft)}

/* ---- Feinschliff: Desktop-Hover, Tastatur-Fokus, sanfter Screen-Wechsel ---- */
@media (hover:hover){
  .btn:not(:disabled):not(.sec):not(.ghost):hover{filter:brightness(1.07)}
  .btn.sec:hover,.iconbtn:not(:disabled):hover,.chip:not(.on):hover,.stepper button:hover{background:var(--paper)}
  .theme-btn:hover{color:var(--ink)}
  .btn.ghost:hover{color:var(--ink)}
}
:where(button,.chip,.check,.vl-item,input.txt,textarea.txt):focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
#screen > *{animation:rise .26s ease both}
@media (prefers-reduced-motion:reduce){#screen > *{animation:none}}
</style>
</head>
<body>
<div id="app">
  <aside id="railL" class="rail"></aside>
  <main id="main">
    <div id="topbar"></div>
    <div class="scroll" id="screen"></div>
    <div id="actionbar" class="actionbar"></div>
  </main>
  <aside id="railR" class="rail"></aside>
</div>
<div id="toast" class="toast"></div>
<button id="themeBtn" class="theme-btn" type="button" onclick="cycleTheme()" aria-label="Design wechseln" title="Design wechseln"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.75a8.25 8.25 0 0 1 0 16.5z" fill="currentColor"/></svg></button>

<script>
"use strict";
/* ============================================================
   Coach Runner  —  rendert workout-spec, gibt workout-result
   Single file, vanilla JS, offline-tauglich. schemaVersion 6.

   Änderungen v1 → v2:
   - cardio strukturiert via segments[] (statt flachem durationMin+targetHr)
   - circuit.stations[] akzeptiert distanceM (z.B. 30m Carry als Station)
   - v1-Specs werden automatisch beim Import auf v2 normalisiert
   Änderungen v2 → v3 (rein additiv, abwärtskompatibel):
   - optionales cuePinned:true je Übung → Hinweis startet aufgeklappt statt hinter (i)
   Änderungen v3 → v4:
   - perSide:true bei strength / superset.exercises[] → Wdh/RIR links & rechts getrennt
     abfragen; Result-log-Zeilen tragen side:"L"|"R" (Pause erst nach rechts)
   - Ruder-Meter-Tracking entfernt (rowingMetersBefore, summary.rowingMeters*, Meilenstein-UI)
   - Last wird auch bei Timer-Stationen im Zirkel angezeigt
   - erledigte Sätze (strength/plyo) antippbar → Korrektur
   - Stepper-Wert antippbar → Direkteingabe
   Änderungen v4 → v5 (rein additiv, abwärtskompatibel):
   - optionales alternating:true bei strength / superset.exercises[] → Übung wird Arm-um-Arm
     IM WECHSEL ausgeführt: EIN Satz (kein L/R-Split), Reps gelten je Seite, Label "/Seite (im
     Wechsel)". Schließt perSide aus (alternating gewinnt). Result-log: eine Zeile/Satz, kein side.
   - Circuit: 5s-Countdown jetzt auch vor der ersten Station (vorher nur zwischen Stationen)
   Änderungen v5 → v6 (rein additiv, abwärtskompatibel):
   - optionales prepSec je circuit.stations[] / mobility.poses[] sowie je interval-Step →
     verlängert die "Bereitmachen"-Phase vor dieser Station/Pose (z.B. 20s, um vor dem
     Handstand-Hold zur Wand zu laufen und hochzukippen). Ohne Feld gelten die Defaults (5/6/5s).
   - Mobility: letzte Pose endet mit 3-2-1 + "done"-Klingel statt leisem soft-Ton →
     hörbares Abschluss-Signal am Ende des Cool-Downs/Workouts.
   Nachtrag (additiv, ohne Bump):
   - optionales resultMailto (Top-Level, E-Mail-Adresse) → Summary zeigt "An den Coach
     mailen"-Button: mailto mit dem Result-JSON im Body (Adresse reist in der Spec mit,
     die App selbst bleibt personenagnostisch/frei von privaten Daten). Result wird
     zusätzlich in die Zwischenablage kopiert, falls die Mail-App den Body kürzt.
   Nachtrag (UI/Audio, ohne Bump — keine Spec-/Result-Änderung):
   - iOS-Layout: 100dvh statt 100%-Höhen-Falle, Safe-Area oben (Notch, Status-Bar
     black-translucent), Actionbar schluckt keine Taps mehr auf Inhalt darunter
     (pointer-events:none auf dem Gradient), Timer-Ring skaliert mit dem Viewport.
   - Theme-Button: SVG-Kontrast-Icon + Milchglas statt 🎨-Emoji.
   - Audio: End-Alarm reißt beim Phasenwechsel nicht mehr ab — bei natürlichem
     Timer-Ende werden die gerade klingenden Töne aus _sched entlassen, bevor der
     nächste scheduleAlarm clearScheduled aufruft (s. Timer.loop).
   - Feinschliff: Hover-States (Desktop), :focus-visible, sanfte Einblendung je Screen.
   ============================================================ */

// HF-Zonen kommen ausschließlich aus der Spec (optionales Feld spec.hrZones).
// Format je Eintrag: { z:"Z2", lo:134, hi:148, name:"Grundlage / UT2" }
// Fehlt das Feld, kennt die App keine Zonen — es bleiben nur die Ziel-Werte
// des jeweiligen Cardio-Schritts (s.targetHr). Keine festen Werte in der App.
function hrZones(){ return (S.spec && Array.isArray(S.spec.hrZones)) ? S.spec.hrZones : null; }
function zoneForHr(hr){
  const zones=hrZones();
  if(!hr || !zones || !zones.length) return null;
  for(const z of zones){ if(hr>=z.lo && hr<z.hi) return z.z; }
  // außerhalb des Tabellenrands: tiefste bzw. höchste Zone
  return hr < zones[0].lo ? zones[0].z : zones[zones.length-1].z;
}

/* Cue-Block: zeigt einen Technik-/Sicherheitshinweis unter der Übung.
   cue kann ein String ODER ein String-Array sein. Array → Liste mit Punkten.
   Leeres/fehlendes cue → "" (rendert nichts). mb = margin-bottom in px. */
function cueBlock(cue,mb){
  if(cue==null) return "";
  const m = mb==null?14:mb;
  const style = `margin-bottom:${m}px`;
  if(Array.isArray(cue)){
    const items=cue.filter(c=>c!=null&&String(c).trim()!=="");
    if(!items.length) return "";
    if(items.length===1) return `<div class="note" style="${style}">💡 ${esc(items[0])}</div>`;
    return `<div class="note" style="${style}"><div style="display:flex;flex-direction:column;gap:5px">${
      items.map(c=>`<div style="display:flex;gap:7px"><span style="opacity:.8">•</span><span>${esc(c)}</span></div>`).join("")}</div></div>`;
  }
  if(String(cue).trim()==="") return "";
  return `<div class="note" style="${style}">💡 ${esc(cue)}</div>`;
}
function mmss(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60),s=sec%60; return m+":"+String(s).padStart(2,"0"); }
/* Last (String ODER {text,kg}) als Anzeigetext. */
function loadText(l){ if(l==null) return ""; if(typeof l==="string") return l; return l.text||(l.kg!=null?(l.kg+" kg"):""); }
/* Seiten-Label für perSide-Log-Einträge. */
function sideLabel(side){ return side==="L"?" · links":side==="R"?" · rechts":""; }
/* Mehrere Cue-Quellen (String|Array|null) zu einer flachen Liste zusammenführen. */
function mergeCues(...cs){
  const out=[];
  cs.forEach(c=>{ if(c==null)return;
    if(Array.isArray(c)) c.forEach(x=>{ if(x!=null&&String(x).trim()!=="")out.push(x); });
    else if(String(c).trim()!=="") out.push(c); });
  return out.length?out:null;
}

/* ---------- audio ----------
   iOS suspendiert den AudioContext aggressiv (Screen-Lock, Hintergrund,
   Stille). Deshalb: einmal per echtem Tap entsperren (inkl. Silent-Buffer),
   bei JEDER Interaktion + bei Rückkehr in den Vordergrund reaktivieren und
   vor jedem Ton einen resume()-Versuch starten. Töne werden als Sequenz
   relativ zu AC.currentTime geplant (zuverlässiger als setTimeout-Ketten). */
let AC=null, audioReady=false, _bus=null;
// Globaler Lautstärke-Boost für ALLE Töne (damit sie über Musik hörbar sind).
// Alle Töne laufen durch _bus → Limiter → Ausgang; der Limiter fängt Übersteuern
// ab, sodass wir kräftig boosten können, ohne dass es kratzt/verzerrt.
const VOL=2.4;
function buildBus(){
  if(!AC || _bus) return;
  try{
    _bus=AC.createGain(); _bus.gain.value=1;
    const lim=AC.createDynamicsCompressor();  // als Limiter konfiguriert
    lim.threshold.value=-4; lim.knee.value=4; lim.ratio.value=20;
    lim.attack.value=0.002; lim.release.value=0.10;
    _bus.connect(lim); lim.connect(AC.destination);
  }catch(e){ _bus=null; }
}
function unlockAudio(){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    buildBus();
    if(AC.state!=="running") AC.resume();
    if(!audioReady){
      const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource();
      s.buffer=b; s.connect(_bus||AC.destination); s.start(0);
      audioReady=true;
    }
  }catch(e){}
}
// jede Nutzer-Interaktion hält die Audio-Pipeline wach
["touchstart","pointerdown","mousedown","keydown"].forEach(ev=>{
  document.addEventListener(ev,unlockAudio,{passive:true});
});
function ensureAudio(){
  try{
    if(!AC){ unlockAudio(); return; }
    // iOS Safari kann den Context in "closed" stellen (nach langem Idle / Suspend).
    // Dann ist resume() nutzlos — Pipeline komplett neu aufbauen.
    if(AC.state==="closed"){
      try{ AC=null; _bus=null; audioReady=false; }catch(_){}
      unlockAudio(); return;
    }
    if(AC.state!=="running") AC.resume();
  }catch(e){
    try{ AC=null; _bus=null; audioReady=false; unlockAudio(); }catch(_){}
  }
}
// Eine "Stimme" zur absoluten Audio-Zeit t0, im Charakter klassischer Box-/Interval-Timer:
// satter Sinus-Grundton + Rechteck-Kante (Durchsetzung) + leise Sub-Oktave (Wucht), alles
// durch einen Tiefpass, der die schrillen Obertöne kappt → kräftig statt hell/dünn. Hüllkurve
// mit kurzem "Halten" gibt dem Beep Körper. Gibt ALLE Oszillatoren zurück, damit Pause/Skip
// (clearScheduled) sie zuverlässig stoppen können.
function _osc(freq,t0,dur,vol,type){
  const g=AC.createGain();
  const v=Math.min(0.95,(vol||0.2)*VOL);   // Boost + Schutz-Clamp; Limiter im Bus fängt Spitzen
  const mid=Math.min(dur*0.55, Math.max(0.04, dur-0.04));
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(v,t0+0.010);          // schneller, klickfreier Anstieg
  g.gain.exponentialRampToValueAtTime(v*0.55,t0+mid);       // kurzes Halten → Körper/Wucht
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);       // sattes Ausklingen
  const lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2600; lp.Q.value=0.6;
  lp.connect(g); g.connect(_bus||AC.destination);
  const oscs=[];
  const add=(f,wave,gain)=>{
    const o=AC.createOscillator(); o.type=wave; o.frequency.setValueAtTime(f,t0);
    const og=AC.createGain(); og.gain.value=gain;
    o.connect(og); og.connect(lp); o.start(t0); o.stop(t0+dur+0.05); oscs.push(o);
  };
  add(freq,"sine",0.78);      // satter Grundton
  add(freq,"square",0.42);    // Rechteck-Kante → setzt sich durch
  add(freq/2,"sine",0.22);    // Sub-Oktave → Wucht/Tiefe
  return oscs;
}
// sofortiger Ton — für Start-Cues, während die App im Vordergrund ist
function tone(freq,startSec,dur,vol=0.22,type="sine"){
  if(!AC) return; try{ _osc(freq,AC.currentTime+startSec,dur,vol,type); }catch(e){}
}
// motivierende Cues (Beginn einer Phase) — kräftige, tiefere Lage (Box-Timer-Charakter)
// Arbeit: satter "GO" auf A5, kurzer Lift nach B5 — energisch, nicht schrill
function cueWork(){ ensureAudio(); tone(880,0,.30,.46); tone(988,.26,.26,.42); vibrate([50,40,110]); }
// Pause: A5 → D5 abwärts — kräftiger Einsatz, dann ruhig
function cueRest(){ ensureAudio(); tone(880,0,.26,.36); tone(587,.24,.34,.28); vibrate(70); }
// Fertig: aufsteigendes E–A–C (E5–A5–C6) — voll & belohnend
function cueDone(){ ensureAudio(); tone(659,0,.16,.36); tone(880,.16,.18,.40); tone(1047,.34,.44,.46); vibrate([80,55,80,55,180]); }
// Mobility-Ende: tiefe, ruhige Quinte (G4 + D5) — bewusst zart
function cueSoft(){ ensureAudio(); tone(392,0,.32,.12); tone(587,.16,.30,.10); vibrate(40); }
// Anläuten zu Beginn eines Übergangs ("gleich geht's los") — kräftiges Ding-Ding (D5→A5)
function cueAnnounce(){ ensureAudio(); tone(587,0,.18,.34); tone(880,.17,.30,.42); vibrate([50,40,60]); }
function vibrate(p){ if(navigator.vibrate) try{navigator.vibrate(p);}catch(e){} }

/* ---------- vorab geplanter End-Alarm ----------
   Der Ton, der das Ende eines Blocks signalisiert, wird NICHT erst im
   onDone (requestAnimationFrame) erzeugt, sondern beim Timer-Start fest
   auf die Audio-Uhr gelegt. Dadurch klingelt es zuverlässig am Ende —
   auch wenn iOS rAF im Hintergrund/bei langer Laufzeit drosselt oder der
   Tab nicht aktiv ist (Voraussetzung: Bildschirm bleibt per Wake-Lock an,
   damit der AudioContext nicht suspendiert wird). Die geplanten Töne sind
   kündbar: Pause / Skip / +30s planen sie neu. */
let _sched=[];
function clearScheduled(){ _sched.forEach(o=>{ try{o.stop(0);}catch(e){} try{o.disconnect();}catch(e){} }); _sched=[]; }
function schedTone(freq,atSec,dur,vol,type){
  if(!AC) return; try{ _osc(freq,AC.currentTime+Math.max(0,atSec),dur,vol,type).forEach(o=>_sched.push(o)); }catch(e){}
}
// Hintergrund-sichere Gegenstücke zu den cue*-Motiven (identische Notenwahl).
// go/rest beginnen bei Null mit kräftigem A5 — höher als die "1" (G5) → klarer Null-Akzent.
const ALARM={
  go:  [[880,0,.30,.46],[988,.26,.26,.42]],                      // satter GO + Lift
  rest:[[880,0,.26,.36],[587,.24,.34,.28]],                      // kräftig, dann abwärts
  done:[[659,0,.16,.36],[880,.16,.18,.40],[1047,.34,.44,.46]],   // voll & belohnend
  soft:[[392,0,.32,.12],[587,.16,.30,.10]],                      // tiefe, ruhige Quinte
};
// kind: "go" | "rest" | "done" | "soft" — Ton ans Ende eines durSec-Timers legen
function scheduleAlarm(kind,durSec){
  clearScheduled(); ensureAudio();
  if(!AC || !(durSec>0)) return;
  // 3-2-1-Countdown kurz vor Schluss (ansteigend D5–E5–G5) — bei "soft" (Mobility) bewusst ohne, damit Holds ruhig bleiben.
  // Die "0" selbst ist der kräftige erste Motiv-Ton (A5), liegt eine Stufe über der "1" (G5).
  if(kind!=="soft") [3,2,1].forEach(n=>{ if(durSec>n+0.25) schedTone({3:587,2:659,1:784}[n], durSec-n, .12, .36); });
  (ALARM[kind]||ALARM.go).forEach(([f,off,d,v])=>schedTone(f, durSec+off, d, v));
}

/* ---------- wake lock ---------- */
let wakeLock=null;
async function keepAwake(){
  try{
    if(!("wakeLock" in navigator)) return;
    if(wakeLock && !wakeLock.released) return;            // bereits aktiv
    wakeLock=await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release",()=>{ wakeLock=null; });
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ unlockAudio(); if(S.screen==="run") keepAwake(); } });
// PWA-Edge-Cases: nach bfcache-Restore und Focus-Wechsel ebenfalls reaktivieren.
window.addEventListener("pageshow",()=>{ unlockAudio(); if(S.screen==="run") keepAwake(); });
window.addEventListener("focus",()=>{ if(S.screen==="run") keepAwake(); });

/* ---------- timer engine ---------- */
const Timer = {
  raf:null, endsAt:0, dur:0, onTick:null, onDone:null, paused:false, remainAtPause:0, endKind:null,
  start(durSec,onTick,onDone,endKind){
    this.stop(); this.dur=durSec; this.endsAt=performance.now()+durSec*1000;
    this.onTick=onTick; this.onDone=onDone; this.paused=false; this.endKind=endKind||null;
    if(this.endKind) scheduleAlarm(this.endKind,durSec);   // End-Ton vorab auf die Audio-Uhr legen
    keepAwake();                                           // Bildschirm während des Timers wach halten
    this.loop();
  },
  loop(){
    const step=()=>{
      if(this.paused) return;
      const remain=(this.endsAt-performance.now())/1000;
      if(this.onTick) this.onTick(Math.max(0,remain),this.dur);
      if(remain<=0){
        // Natürliches Ende: der vorab geplante End-Alarm klingt JETZT. Ihn aus _sched
        // entlassen (nicht stoppen!), bevor stop()/der nächste Timer.start ihn per
        // clearScheduled abwürgen würde — sonst reißt der Ton beim Rundenwechsel ab.
        // Die Oszillatoren stoppen sich selbst (o.stop() ist beim Planen gesetzt).
        _sched.length=0;
        this.stop(); if(this.onDone) this.onDone(); return;
      }
      this.raf=requestAnimationFrame(step);
    };
    this.raf=requestAnimationFrame(step);
  },
  pause(){ if(this.paused||!this.dur)return; this.paused=true; this.remainAtPause=(this.endsAt-performance.now())/1000; cancelAnimationFrame(this.raf); clearScheduled(); },
  resume(){ if(!this.paused)return; this.paused=false; this.endsAt=performance.now()+this.remainAtPause*1000; if(this.endKind) scheduleAlarm(this.endKind,this.remainAtPause); this.loop(); },
  add(sec){ this.endsAt+=sec*1000; if(this.endKind) scheduleAlarm(this.endKind,(this.endsAt-performance.now())/1000); },
  stop(){ cancelAnimationFrame(this.raf); this.raf=null; this.dur=0; this.paused=false; this.endKind=null; clearScheduled(); },
};
// count-up (cardio)
const UpTimer = {
  raf:null, startAt:0, onTick:null, paused:false, acc:0,
  start(onTick){ this.stop(); this.startAt=performance.now(); this.onTick=onTick; this.acc=0; this.paused=false; this.loop(); },
  loop(){ const step=()=>{ if(this.paused)return;
      const e=this.acc+(performance.now()-this.startAt)/1000; if(this.onTick)this.onTick(e);
      this.raf=requestAnimationFrame(step); }; this.raf=requestAnimationFrame(step); },
  pause(){ if(this.paused)return; this.paused=true; this.acc+=(performance.now()-this.startAt)/1000; cancelAnimationFrame(this.raf); },
  resume(){ if(!this.paused)return; this.paused=false; this.startAt=performance.now(); this.loop(); },
  elapsed(){ return this.paused?this.acc:this.acc+(performance.now()-this.startAt)/1000; },
  stop(){ cancelAnimationFrame(this.raf); this.raf=null; this.paused=false; this.acc=0; clearScheduled(); },
};

function ring(frac,sub,val){

/* ============================================================
   JSON import / validation
   ============================================================ */
function extractJSON(raw){
  if(!raw) return null;
  let t=raw.trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(fence) t=fence[1].trim();
  try{ return JSON.parse(t); }catch(e){}
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} }
  return null;
}
function validateSpec(o){
  const errs=[];
  if(!o||typeof o!=="object") return ["Kein gültiges JSON gefunden."];
  if(o.kind!=="workout-spec") errs.push('Feld "kind" muss "workout-spec" sein.');
  if(!Array.isArray(o.steps)||!o.steps.length) errs.push('"steps" fehlt oder ist leer.');
  (o.steps||[]).forEach((s,i)=>{
    const id = s.id ? `Schritt ${i+1} (${s.id})` : `Schritt ${i+1}`;
    if(!s.id) errs.push(`Schritt ${i+1}: "id" fehlt.`);
    if(!s.type){ errs.push(`Schritt ${i+1}: "type" fehlt.`); return; }
    switch(s.type){
      case "strength":
      case "plyo":
        if(!s.name) errs.push(`${id}: "name" fehlt.`);
        if(!s.sets) errs.push(`${id}: "sets" fehlt.`);
        if(s.repTarget==null) errs.push(`${id}: "repTarget" fehlt.`);
        break;
      case "superset":
        if(!s.rounds) errs.push(`${id}: "rounds" fehlt.`);
        if(!Array.isArray(s.exercises) || !s.exercises.length) errs.push(`${id}: "exercises" leer.`);
        break;
      case "interval":
        if(!s.scheme) errs.push(`${id}: "scheme" fehlt (emom/intervals/tabata).`);
        if(!s.rounds) errs.push(`${id}: "rounds" fehlt.`);
        if(!s.workSec) errs.push(`${id}: "workSec" fehlt.`);
        break;
      case "circuit":
        if(!s.rounds) errs.push(`${id}: "rounds" fehlt.`);
        if(!Array.isArray(s.stations) || !s.stations.length) errs.push(`${id}: "stations" leer.`);
        break;
      case "cardio":
        // Nach normalizeSpec ist segments[] gesetzt; ohne segments + ohne durationMin = unbrauchbar
        if(!Array.isArray(s.segments) && s.durationMin==null) errs.push(`${id}: "segments" oder "durationMin" fehlt.`);
        if(Array.isArray(s.segments)){
          s.segments.forEach((seg,j)=>{ if(!seg.durationSec) errs.push(`${id} · Segment ${j+1}: "durationSec" fehlt.`); });
        }
        if(!s.modality) errs.push(`${id}: "modality" fehlt (row/run/bike).`);
        break;
      case "carry":
        if(!s.name) errs.push(`${id}: "name" fehlt.`);
        if(!s.rounds) errs.push(`${id}: "rounds" fehlt.`);
        break;
      case "mobility":
        if(!Array.isArray(s.poses) || !s.poses.length) errs.push(`${id}: "poses" leer.`);
        break;
      case "warmup":
      case "cooldown":
        // items[] empfohlen aber nicht zwingend
        break;
      default:
        errs.push(`${id}: unbekannter type "${s.type}".`);
    }
  });
  return errs;
}

/* v1 → v2 normalisieren: alte flache cardio-Felder in segments[] heben.
   Wirkt nur, wenn schemaVersion fehlt oder <2. Idempotent. */
function normalizeSpec(o){
  if(!o || typeof o!=="object") return o;
  if(o.schemaVersion && o.schemaVersion>=2) return o;
  (o.steps||[]).forEach(s=>{
    if(s.type!=="cardio") return;
    if(Array.isArray(s.segments) && s.segments.length) return;     // schon v2-Form
    const dur = (s.durationMin||30)*60;
    const seg = { durationSec: dur };
    if(s.targetHr) seg.targetHr = s.targetHr;
    if(s.targetSpm!=null){
      if(Array.isArray(s.targetSpm)) seg.targetSpm = {min:s.targetSpm[0], max:s.targetSpm[1]};
      else if(typeof s.targetSpm==="number") seg.targetSpm = {min:s.targetSpm, max:s.targetSpm};
      else seg.targetSpm = s.targetSpm;
    }
    if(s.cue) seg.cue = s.cue;
    s.segments = [seg];
    if(!s.totalDurationMin) s.totalDurationMin = s.durationMin;
  });
  o.schemaVersion = 2;
  return o;
}
