  if(s.type==="cardio")return ({row:"Rudern",run:"Laufen",bike:"Bike"})[s.modality]||"Ausdauer";
  if(s.type==="carry")return s.name||"Carry";
  if(s.type==="mobility")return s.label||"Mobility";
  if(s.type==="plyo")return s.name||"Sprungkraft";
  return s.name||"Übung";
}
function renderReady(){
  S.screen="ready";
  const m=S.spec.meta||{}, rd=S.spec.readiness||{};
  const rows=S.spec.steps.map(s=>`<div class="kv">
      <span><span class="tag ${s.type==='cardio'||s.type==='mobility'?'row':''}">${esc(focusTag(s))}</span> &nbsp;${esc(stepTitle(s))}</span>
      <b class="muted">${stepMetaShort(s)}</b></div>`).join("");
  setScreen(`
    <div class="eyebrow">${esc(m.phase||"")} ${m.week?("· Woche "+m.week):""}</div>
    <h1 style="margin:6px 0 2px">${esc(m.focus||"Workout")}</h1>
    <p class="muted" style="margin-bottom:14px">${esc(m.mode||"")}${m.plannedDurationMin?(" · ~"+m.plannedDurationMin+" min"):""} · ${S.spec.steps.length} Schritte</p>
    ${(rd.energy||rd.sleep||rd.soreness)?`<div class="card">
      <div class="eyebrow" style="margin-bottom:8px">Tagesform</div>
      <div class="chips">
        ${rd.energy?`<span class="pill">⚡ Energie ${esc(rd.energy)}/10</span>`:""}
        ${rd.sleep?`<span class="pill">😴 ${esc(rd.sleep)}</span>`:""}
        ${rd.soreness?`<span class="pill">💪 ${esc(rd.soreness)}</span>`:""}
      </div></div>`:""}
    <div class="card"><div class="eyebrow" style="margin-bottom:6px">Ablauf</div>${rows}</div>
    ${audioCard()}
    ${taktCard()}`);
  setBar(`<button class="btn" onclick="startWorkout()">Los geht's</button>`);
}
function stepMetaShort(s){
  if(s.type==="strength")return `${s.sets}×${repText(s.repTarget)}`;
  if(s.type==="superset")return `${s.rounds} Runden`;
  if(s.type==="interval")return `${s.rounds}× ${s.workSec}s`;
  if(s.type==="circuit")return `${s.rounds} Runden`;
  if(s.type==="cardio"){
    const total=cardioTotalMin(s);
    const segs=(s.segments||[]).length;
    return segs>1 ? `${total} min · ${segs} Segm.` : `${total} min`;
  }
  if(s.type==="carry")return `${s.rounds}×`;
  if(s.type==="mobility")return `${(s.poses||[]).length} Posen`;
  if(s.type==="plyo")return `${s.sets}×${repText(s.repTarget)}`;
  if((s.type==="warmup"||s.type==="cooldown")&&s.durationSec)return `${Math.round(s.durationSec/60)} min`;
  return "";
}
// Gesamt-Minuten eines Cardio-Steps: bevorzugt totalDurationMin, sonst Summe segments.
function cardioTotalMin(s){
  if(s.totalDurationMin) return s.totalDurationMin;
  const sum=(s.segments||[]).reduce((a,x)=>a+(x.durationSec||0),0);
  return Math.round(sum/60);
}
function repText(rt){ if(Array.isArray(rt))return rt[0]+"–"+rt[1]; return String(rt); }

/* ============================================================
   RUN  — dispatcher
   ============================================================ */
function startWorkout(){ unlockAudio(); keepAwake(); S.screen="run"; S.startedAt=Date.now(); S.stepIdx=0; renderStep(); }
function topbar(){
  const tot=S.spec.steps.length, i=S.stepIdx;
  const frac=Math.min(1,(i)/tot);
  const backDisabled = !canGoBack();
  // Bewusst OHNE Übungsnamen: der steht groß im Inhalt — in der Topbar bricht er nur
  // um und macht die Leiste hoch. Hier lebt nur die Orientierung (Schritt x/y + Balken).
  return `<div class="topbar">
    <button class="iconbtn" onclick="confirmQuit()">✕</button>
    <button class="iconbtn" onclick="goBack()" ${backDisabled?'disabled':''} aria-label="Einen Schritt zurück">‹</button>
    <div class="prog-wrap">
      <div class="prog-label"><span>Schritt ${i+1} / ${tot}</span></div>
      <div class="bar"><i style="width:${frac*100}%"></i></div>
    </div></div>`;
}
/* ---------- Desktop-Seitenspalten (Verlauf + Hinweise) ----------
   Aus dem aktuellen State abgeleitet, unabhängig von den Step-Render-Funktionen.
   Auf Mobil per CSS ausgeblendet; das Grid wird nur im run-mode scharf. */
function renderRails(){
  const run = S.screen==="run";
  document.body.classList.toggle("run-mode", run);
  const L=$("railL"), R=$("railR"); if(!L||!R) return;
  if(!run || !S.spec || !S.spec.steps){ L.innerHTML=""; R.innerHTML=""; return; }
  L.innerHTML=railVerlauf(); R.innerHTML=railHinweise();
}
// Direktsprung über die Verlaufs-Navigation. Geloggte Daten in S.result bleiben erhalten;
// nur der transiente Schritt-Fortschritt (S.sub) wird zurückgesetzt — wie bei prev/skip.
function gotoStep(k){
  if(!S.spec || !S.spec.steps) return;
  if(k<0 || k>=S.spec.steps.length || k===S.stepIdx) return;
  preserveScreenState();
  Timer.stop(); UpTimer.stop();
  S.sub={};
  S.stepIdx=k;
  saveProgress();
  renderStep();
}
// linke Spalte: kompletter Ablauf mit Status (erledigt / aktuell / übersprungen / kommt noch)
function railVerlauf(){
  const steps=S.spec.steps, i=S.stepIdx, m=S.spec.meta||{};
  const items=steps.map((s,k)=>{
    const rs=(S.result&&S.result.steps&&S.result.steps[k])||{};
    let st;
    if(rs.status==="skipped") st="skip";
    else if(rs.status==="done"||k<i) st="done";
    else if(k===i) st="cur";
    else st="todo";
    const icon = st==="done"?"✓" : st==="skip"?"–" : st==="cur"?"▸" : (k+1);
    const meta=stepMetaShort(s);
    return `<div class="vl-item vl-${st}" onclick="gotoStep(${k})" role="button" title="Zu diesem Schritt springen">
      <div class="vl-dot">${icon}</div>
      <div style="min-width:0">
        <div class="vl-title">${esc(stepTitle(s))}</div>
        <div class="vl-meta">${esc(focusTag(s))}${meta?(" · "+meta):""}</div>
      </div></div>`;
  }).join("");
  return `<div class="rail-head">${esc(m.focus||"Ablauf")}</div>
    <div class="muted" style="font-size:12px;margin:-6px 0 12px;font-weight:600">Schritt ${i+1} / ${steps.length}</div>
    <div class="vl">${items}</div>`;
}
// rechte Spalte: Hinweise/Infos zum aktuellen Schritt
function railHinweise(){
  const s=S.spec.steps[S.stepIdx]; if(!s) return "";
  const cueHtml=cueBlock(currentStepCue(),0);
  const lt=(s.type==="strength"||s.type==="superset"||s.type==="plyo")?s.lastTime:null;
  const parts=[];
  if(lt) parts.push(`<div class="rail-card"><div class="eyebrow" style="margin-bottom:6px">Letztes Mal</div>
    <div style="font-size:14px;line-height:1.4">↩ ${esc(lt)}</div></div>`);
  if(cueHtml) parts.push(`<div class="rail-card">${cueHtml}</div>`);
  const body = parts.length ? parts.join("")
    : `<div class="rail-empty muted">Kein spezieller Hinweis für diesen Schritt.</div>`;
  return `<div class="rail-head">Hinweise</div>${body}`;
}
// Cue des gerade aktiven Teils (berücksichtigt aktuelle Übung/Phase/Segment)
function currentStepCue(){
  const s=S.spec.steps[S.stepIdx], rs=(S.result&&S.result.steps&&S.result.steps[S.stepIdx])||{};
  if(!s) return null;
  if(s.type==="superset"){
    const slots=ssSlots(s), done=(rs.log?rs.log.length:0);
    const slot=slots.length?slots[done%slots.length]:null;
    return mergeCues(slot&&slot.ex.cue, s.cue);
  }
  if(s.type==="cardio"){
    const segs=s.segments||[], seg=segs[S.sub.segIdx||0];
    return mergeCues(seg&&seg.cue, s.cue, s.note);
  }
  if(s.type==="interval"||s.type==="circuit"||s.type==="mobility"){
    const ph=S.sub.phases, p=ph&&ph[S.sub.pi||0];
    return mergeCues(p&&p.cue, s.cue, s.note);
  }
  return mergeCues(s.cue, s.note);
}
// Kann ich überhaupt zurück? Entweder gibt es vorherige Schritte ODER innerhalb des
// aktuellen Schritts existiert Mikro-State (Log-Einträge, Phase-Index, Cardio-Segment).
function canGoBack(){
  if(S.stepIdx>0) return true;
  const s=S.spec.steps[0], rs=S.result.steps[0];
  if(!s||!rs) return false;
  if(rs.log && rs.log.length>0) return true;
  if(S.sub && S.sub.phases && (S.sub.pi||0)>0) return true;
  if(s.type==="cardio" && S.sub && (S.sub.segIdx||0)>0) return true;
  return false;
}
// Bevor ein Re-Render passiert, das aktuelle Bildschirm-State sichern:
// derzeit nur der „Notiz"-Textbereich (exNote/sumNote) — keine anderen.
function preserveScreenState(){
  const ex=$("exNote");
  if(ex && S.result && S.result.steps && S.result.steps[S.stepIdx]){
    const v=(ex.value||"").trim();
    if(v) S.result.steps[S.stepIdx].note=v;
    else delete S.result.steps[S.stepIdx].note;
  }
  // Tagesform/Gesamt-Notiz von der Summary-Seite ist Sache der Summary-Logik selbst.
}
// Einen Mikro-Schritt zurück. Unterscheidet sich nach Step-Typ.
function goBack(){
  if(!S.spec||!S.spec.steps) return;
  const s=S.spec.steps[S.stepIdx];
  const rs=S.result.steps[S.stepIdx];
  if(!s||!rs){ return prevStep(); }
  preserveScreenState();

  // PHASE-BASED: interval / circuit / mobility — eine Phase zurück
  if(s.type==="interval" || s.type==="circuit" || s.type==="mobility"){
    const phases=S.sub.phases;
    if(phases && phases.length){
      Timer.stop();
      let pi = S.sub.pi||0;
      if(pi >= phases.length) pi = phases.length - 1;     // vom Done-Screen zur letzten Phase
      else if(pi > 0) pi -= 1;
      else { return prevStep(); }                          // pi===0 → ganzen Schritt zurück
      S.sub.pi = pi;
      S.sub.inPrep = false;
      S.sub.running = false;
      if(rs.status==="done") delete rs.status;
      if(rs.done) delete rs.done;
      renderStep();
      return;
    }
    return prevStep();
  }

  // LOG-BASED: strength / superset / plyo / carry — letzten Log-Eintrag poppen
  if(s.type==="strength" || s.type==="superset" || s.type==="plyo" || s.type==="carry"){
    if(rs.log && rs.log.length>0){
      const last = rs.log.pop();
      // S.sub vom gepoppten Eintrag wiederherstellen (außer Carry: dort kein Wert-Recovery)
      if(s.type!=="carry" && last){
        if(last.reps!=null) S.sub.reps = last.reps;
        if(last.load!=null) S.sub.load = last.load;
        if(last.rir!=null)  S.sub.rir  = last.rir;
      }
      if(rs.status==="done") delete rs.status;
      renderStep();
      return;
    }
    return prevStep();
  }

  // CARDIO: nur bei segmentiert + bereits gestartet sinnvoll
  if(s.type==="cardio"){
    const segs=s.segments||[];
    if(segs.length>1 && S.sub.cardioStarted && (S.sub.segIdx||0)>0){
      Timer.stop();
      const prevIdx = S.sub.segIdx - 1;
      S.sub.segDoneSec = Math.max(0,(S.sub.segDoneSec||0) - (segs[prevIdx].durationSec||0));
      S.sub.segIdx = prevIdx;
      cardioSegmentRun(s);       // re-starte das vorherige Segment
      return;
    }
    return prevStep();
  }

  return prevStep();
}
/* Index bewegen (ohne Render) – Logs in S.result bleiben erhalten,
   nur der transiente Schritt-Fortschritt S.sub wird zurückgesetzt. */
function advance(){
  Timer.stop(); UpTimer.stop(); S.sub={};
  if(S.stepIdx < S.spec.steps.length-1){ S.stepIdx++; saveProgress(); return true; }
  return false;
}
function nextStep(){ if(advance()) renderTransition(); else finishWorkout(); }
// für Skips: direkt zum nächsten Schritt, ohne Übergangs-Pause
function skipToNext(){ if(advance()) renderStep(); else finishWorkout(); }
// Zurück: ein Schritt zurück; bereits geloggte Sätze/Werte bleiben gespeichert
function prevStep(){
  Timer.stop(); UpTimer.stop(); S.sub={};
  if(S.stepIdx>0){ S.stepIdx--; saveProgress(); renderStep(); }
}

/* ---- Übergang zwischen Blöcken: kurze Pause + Vorschau ---- */
function transitionDetail(s){
  if(s.type==="strength")return `${s.sets} Sätze × ${repText(s.repTarget)} Wdh${s.load?(" · "+esc(s.load.text||(s.load.kg+" kg"))):""}${s.rirTarget!=null?(" · RIR "+s.rirTarget):""}`;
  if(s.type==="superset")return `${s.rounds} Runden · ${(s.exercises||[]).map(e=>esc(e.name)).join(" + ")}`;
  if(s.type==="interval")return `${(s.scheme||"").toUpperCase()} · ${s.rounds}× ${s.workSec}s`;
  if(s.type==="circuit")return `${s.rounds} Runden · ${(s.stations||[]).length} Stationen`;
  if(s.type==="cardio"){
    const total=cardioTotalMin(s), segs=(s.segments||[]);
    if(segs.length===1 && segs[0].targetHr) return `${total} min · Ziel ${segs[0].targetHr.zone||""}`;
    if(segs.length>1) return `${total} min · ${segs.length} Segmente`;
    return `${total} min`;
  }
  if(s.type==="carry")return `${s.rounds} Runden${s.load?(" · "+esc(s.load.text||(s.load.kg+" kg"))):""}`;
  if(s.type==="mobility")return `${(s.poses||[]).length} Posen · ruhig & atemgeführt`;
  if(s.type==="plyo")return `${s.sets} Sätze × ${repText(s.repTarget)}${s.boxHeightCm?(" · Box "+s.boxHeightCm+" cm"):""}`;
  if(s.type==="cooldown")return "Ausklang & durchatmen";
  return stepMetaShort(s)||"";
}
function upcomingList(fromIdx){
  return S.spec.steps.slice(fromIdx).map((s,k)=>`<div class="kv">
      <span><span class="tag ${s.type==='cardio'||s.type==='mobility'?'row':''}">${esc(focusTag(s))}</span> &nbsp;${esc(stepTitle(s))}</span>
      <b class="muted">${stepMetaShort(s)}</b></div>`).join("");
}
function renderTransition(){
  const s=S.spec.steps[S.stepIdx];
  const prev=S.stepIdx>0?S.spec.steps[S.stepIdx-1]:null;
  const fromWarmup = prev && prev.type==="warmup";
  const toCooldown = s.type==="cooldown";
  // Normale Block-Übergänge: keine Wartezeit, direkt zum nächsten Schritt.
  if(!fromWarmup && !toCooldown){ renderStep(); return; }
  const label = fromWarmup ? "Warmup erledigt – los geht's 💪"
              : "Fast geschafft – Ausklang";
  setRun(`<div class="phase-rest" style="margin-top:6px">
    <div class="center" style="margin:4px 0 0"><span class="pill rest">${label}</span></div>
    <div class="card" style="margin-top:14px">
      <div class="eyebrow" style="margin-bottom:6px">Als Nächstes</div>
      <div style="font-weight:750;font-size:17px;margin-bottom:2px">${esc(stepTitle(s))}</div>
      <div class="muted" style="font-size:14px">${transitionDetail(s)}</div>
    </div>
    ${fromWarmup?`<div class="card"><div class="eyebrow" style="margin-bottom:6px">Das kommt heute</div>${upcomingList(S.stepIdx)}</div>`:""}
  </div>`);
  setBar(`<button class="btn" onclick="startCurrentStep()">${fromWarmup?"Starten":"Weiter"}</button>`);
}
// manueller Tap auf „Starten/Weiter" — Start-Ton sofort (Vordergrund)
function startCurrentStep(){ Timer.stop(); cueWork(); renderStep(); }

function renderStep(){
  const s=S.spec.steps[S.stepIdx];
  saveProgress();
  const r={warmup:renderChecklist,cooldown:renderChecklist,strength:renderStrength,
    superset:renderSuperset,interval:renderInterval,circuit:renderCircuit,
    cardio:renderCardio,carry:renderCarry,mobility:renderMobility,plyo:renderPlyo}[s.type];
  if(r) r(s); else { skipStep("Unbekannter Schritt-Typ: "+s.type); }
}
function skipStep(reason){
  const rs=S.result.steps[S.stepIdx]; rs.status="skipped"; rs.skipReason=reason||"übersprungen";
  toast("Übersprungen"); skipToNext();
}

/* ---- WARMUP / COOLDOWN (checklist) ---- */
function renderChecklist(s){
  if(!S.sub.checked) S.sub.checked={};
  const items=s.items||[];
  const list=items.map((it,i)=>`<div class="check ${S.sub.checked[i]?'on':''}" onclick="toggleCheck(${i})">
      <div class="box">${S.sub.checked[i]?'✓':''}</div><span>${esc(it)}</span></div>`).join("");
  setRun(`<div class="scroll-inner">
    <div class="eyebrow">${s.type==='warmup'?'Aufwärmen':'Cooldown'}</div>
    <h1 style="margin:4px 0 12px">${s.type==='warmup'?'Warmmachen':'Ausklang'}</h1>
    ${s.durationSec?`<div class="card center"><div id="cdTimer"></div>
      <div class="btn-row" style="margin-top:6px">
        <button class="btn sec sm" id="cdBtn" onclick="toggleChecklistTimer(${s.durationSec})">Timer starten</button>
      </div></div>`:""}
    <div class="card">${list||'<p class="muted">Keine Punkte angegeben.</p>'}</div></div>`);
  setBar(`<button class="btn" onclick="nextStep()">Weiter</button>`);
  if(s.durationSec) renderCdTimer(s.durationSec);
}
function renderCdTimer(total){ const el=$("cdTimer"); if(el) el.innerHTML=`<div class="big-num" style="font-size:40px">${mmss(total)}</div>`; }
let cdRunning=false;
function toggleChecklistTimer(total){
  const btn=$("cdBtn");
  if(!cdRunning){ cdRunning=true; btn.textContent="Pause";
    Timer.start(total,(rem)=>{ const el=$("cdTimer"); if(el)el.innerHTML=`<div class="big-num" style="font-size:40px">${mmss(rem)}</div>`; },
      ()=>{ cdRunning=false; const el=$("cdTimer"); if(el)el.innerHTML=`<div class="big-num" style="font-size:40px;color:var(--good)">fertig</div>`; if(btn)btn.textContent="Timer starten"; }, "done");
  } else { if(Timer.paused){Timer.resume();btn.textContent="Pause";} else {Timer.pause();btn.textContent="Weiter";} }
}
function toggleCheck(i){ S.sub.checked[i]=!S.sub.checked[i]; renderStep(); }

/* ---- STRENGTH ----
   perSide:true (v4): jeder Satz wird links → rechts getrennt geloggt (2 Log-Zeilen/Satz,
   side:"L"/"R"); Pause erst nach der rechten Seite. Korrektur-Modus: Tap auf eine erledigte
   Zeile lädt sie in die Stepper (S.sub.editIdx), Speichern schreibt in-place zurück. */
function doneSetRow(l,i,perN,withRir,alt){
  const n=Math.floor(i/perN)+1;
  return `<div class="set-row" onclick="editSet(${i})" role="button" title="Antippen zum Korrigieren"><div class="n ok">${n}</div>
     <span>${l.reps} Wdh${alt?"/Seite":""}${sideLabel(l.side)}${l.load?(" · "+l.load+" kg"):""}${l.metronome?" · ⏱":""}</span>${withRir&&l.rir!=null?`<b class="muted" style="margin-left:auto">RIR ${l.rir}</b>`:""}</div>`;
}
function renderStrength(s){
  const rs=S.result.steps[S.stepIdx];
  if(!rs.log) rs.log=[];
  const alt=!!s.alternating;                 // im Wechsel (Arm um Arm) → EIN Satz, kein L/R-Split
  const per=!alt && !!s.perSide, perN=per?2:1;
  const editing=S.sub.editIdx!=null;
  const setNo=Math.floor(rs.log.length/perN); // sets already done
  const sideIdx=rs.log.length%perN;           // 0 = links, 1 = rechts (nur perSide)
  if(setNo>=s.sets && !editing){ return strengthDone(s,rs); }
  const isBW = s.load && /bw|körper|body/i.test(s.load.text||"") && (s.load.kg==null);
  const prev=rs.log[rs.log.length-perN];      // gleicher Slot (gleiche Seite) im Satz davor
  const defReps = prev?prev.reps : (Array.isArray(s.repTarget)?s.repTarget[1]:s.repTarget);
  const defLoad = prev?prev.load : (s.load&&s.load.kg!=null?s.load.kg:0);
  const defRir  = prev?prev.rir  : (s.rirTarget!=null?s.rirTarget:2);
  if(S.sub.reps==null){ S.sub.reps=defReps; S.sub.load=defLoad; S.sub.rir=defRir; }
  const done=rs.log.map((l,i)=>doneSetRow(l,i,perN,true,alt)).join("");
  // Takt-Karte nur im normalen Satz-Ablauf, nicht im Korrektur-Modus (dort wird nichts ausgeführt).
  // Wdh.-Vorbelegung nur, wenn eine Wiederholung eindeutig EINE gezählte Bewegung ist:
  // bei alternating wechselt die Seite innerhalb des Satzes, ein Zyklus ist dann eine Seite.
  // Zweite Seite einer perSide-Übung: die Hantel ist in der Hand, nur die Seite wechselt —
  // dort wäre der volle Vorlauf reines Warten.
  const metro = editing ? "" : metroCard(s.tempo, Array.isArray(s.repTarget)?s.repTarget[1]:s.repTarget,
                                         !alt, per && sideIdx===1);
  const eyebrow = editing
    ? `Korrektur · Satz ${Math.floor(S.sub.editIdx/perN)+1}${sideLabel(rs.log[S.sub.editIdx].side)}`
    : `Satz ${setNo+1} von ${s.sets}${per?sideLabel(sideIdx?"R":"L"):(alt?" · im Wechsel":(s.load&&s.load.perHand?" · je Seite":""))}`;
  setRun(`
    <div class="eyebrow">${eyebrow}</div>
    <h2 class="run-title" style="margin:4px 0 4px">${esc(s.name)}</h2>
    <p class="muted" style="margin-bottom:12px">
      Ziel ${esc(repText(s.repTarget))} Wdh${alt?" / Seite (im Wechsel)":""}${s.load?(" · "+esc(s.load.text||(s.load.kg+" kg"))):""} · RIR ${esc(s.rirTarget)}${tempoText(s.tempo)?(" · Takt "+esc(tempoText(s.tempo))):""}</p>
    ${metro}
    <div class="card">
      ${stepperField("Wiederholungen","reps",1,"Wdh")}
      ${isBW?"":loadField(s)}
      ${stepperField("RIR (Reserve)","rir",1,"RIR",0,6)}
    </div>
    ${cueDisclosure(s.cue,s.cuePinned)}
    ${s.lastTime?`<div class="note last-note" style="margin-bottom:14px">↩ Letztes Mal: ${esc(s.lastTime)}</div>`:""}
    ${done?`<div class="card"><div class="eyebrow" style="margin-bottom:4px">Erledigt · antippen zum Korrigieren</div>${done}</div>`:""}`);
  if(editing){
    setBar(`<div class="btn-row">
      <button class="btn sec" style="flex:none;width:40%" onclick="cancelEdit()">Abbrechen</button>
      <button class="btn" onclick="logSet()">Korrektur speichern</button>
    </div>`);
  } else {
    const label = per&&sideIdx===0 ? "Links fertig → rechts"
                : (setNo+1<s.sets?"Satz fertig → Pause":"Satz fertig");
    setBar(`<div class="btn-row">
      <button class="btn sec sm" style="flex:none;width:38%" onclick="skipExercise()">Überspringen</button>
      <button class="btn" onclick="logSet()">${label}</button>
    </div>`);
  }
  if(!editing) metroAutoStart();   // zweite Seite: Takt läuft von selbst weiter
}
/* Erledigten Satz korrigieren (strength/plyo): Eintrag in die Stepper laden, in-place speichern.
   In-place statt Splice, damit Reihenfolge/Seiten-Parität der Log-Zeilen erhalten bleibt. */
function editSet(i){
  const s=S.spec.steps[S.stepIdx], rs=S.result.steps[S.stepIdx];
  if(!rs||!rs.log||!rs.log[i]) return;
  if(s.type!=="strength" && s.type!=="plyo") return;
  preserveScreenState();
  const e=rs.log[i];
  S.sub.editIdx=i;
  S.sub.reps=e.reps;
  if(e.load!=null) S.sub.load=e.load;
  if(e.rir!=null)  S.sub.rir=e.rir;
  renderStep();
}
function cancelEdit(){ S.sub.editIdx=null; S.sub.reps=null; renderStep(); }
function loadField(s){
  const bells=S.spec.availableBells;
  let chips="";
  if(Array.isArray(bells)&&bells.length){
    chips=`<div class="chips" style="margin-top:8px">${bells.map(b=>`<span class="chip ${S.sub.load==b?'on':''}" onclick="setVal('load',${b})">${b}</span>`).join("")}</div>`;
  }
  return `<div class="field"><div class="lab">Last <span class="hint">kg ${s.load&&s.load.perHand?"je Hand":""}</span></div>
    <div class="stepper">
      <button onclick="bump('load',-2)">–</button>
      <div class="val" onclick="typeVal('load')" title="Antippen zum Eintippen"><b class="tnum" id="v-load">${S.sub.load}</b><small>kg</small></div>
      <button onclick="bump('load',2)">+</button>
    </div>${chips}</div>`;
}
function stepperField(label,key,step,unit,min,max){
  const mn=(min!=null)?min:"null", mx=(max!=null)?max:"null";
  return `<div class="field"><div class="lab">${label}</div>
    <div class="stepper">
      <button onclick="bump('${key}',${-step},${mn},${mx})">–</button>
      <div class="val" onclick="typeVal('${key}')" title="Antippen zum Eintippen"><b class="tnum" id="v-${key}">${S.sub[key]}</b><small>${unit}</small></div>
      <button onclick="bump('${key}',${step},${mn},${mx})">+</button>
    </div></div>`;
}
/* Tap auf den Stepper-Wert → Direkteingabe (große Sprünge ohne ±-Getippe).
   Ersetzt das <b> temporär durch ein Zahlenfeld; Enter/Blur übernimmt. */
function typeVal(key){
  const el=$("v-"+key); if(!el) return;
  const cur=S.sub[key];
  const inp=document.createElement("input");
  inp.type="number"; inp.inputMode="decimal"; inp.value=cur;
  inp.style.cssText="font-size:28px;font-weight:800;width:110px;text-align:center;border:none;background:transparent;color:var(--ink);font-family:inherit;font-variant-numeric:tabular-nums";
  el.replaceWith(inp); inp.focus(); inp.select();
  let done=false;
  const commit=()=>{
    if(done) return; done=true;
    let v=parseFloat(inp.value);
    if(!isFinite(v)||v<0) v=cur;
    S.sub[key]=v;
    const b=document.createElement("b"); b.className="tnum"; b.id="v-"+key; b.textContent=v;
    inp.replaceWith(b);
    if(key==="load"){ document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",Number(c.textContent)===v)); }
  };
  inp.addEventListener("blur",commit);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); inp.blur(); } });
}
function bump(key,delta,min,max){
  let v=(S.sub[key]||0)+delta;
  if(min!=null && v<min) v=min;
  if(max!=null && v>max) v=max;
  if(v<0) v=0;
  S.sub[key]=v; const el=$("v-"+key); if(el)el.textContent=v;
  if(key==="load"){ document.querySelectorAll(".chip").forEach(c=>{ c.classList.toggle("on", Number(c.textContent)===v); }); }
}
function setVal(key,v){ S.sub[key]=v; const el=$("v-"+key); if(el)el.textContent=v;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",Number(c.textContent)===v)); }
function logSet(){
  Metro.harvest();   // läuft der Takt noch, zählt sein Stand — nicht die Vorbelegung
  const s=S.spec.steps[S.stepIdx], rs=S.result.steps[S.stepIdx];
  const per=!s.alternating && !!s.perSide;
  const entry={reps:S.sub.reps,rir:S.sub.rir};
  if(S.sub.load) entry.load=S.sub.load;
  // Nachweis, dass dieser Satz wirklich am Takt lief — nur dann ist die Tempo-Vorgabe belegt.
  if(S.sub.metroUsed) entry.metronome=true;
  // Korrektur-Modus: in-place zurückschreiben (side bleibt erhalten), kein neuer Eintrag
  if(S.sub.editIdx!=null){
    rs.log[S.sub.editIdx]=Object.assign({},rs.log[S.sub.editIdx],entry);
    S.sub.editIdx=null; S.sub.reps=null;
    toast("Satz korrigiert");
    renderStep(); return;
  }
  if(per) entry.side=(rs.log.length%2===0)?"L":"R";
  rs.log.push(entry);
  S.sub.metroUsed=false;   // je Satz (bei perSide: je Seite) neu nachzuweisen
  // perSide: nach links direkt rechts (Werte bleiben als Vorbelegung stehen), keine Pause
  if(per && rs.log.length%2===1){ renderStep(); return; }
  S.sub.reps=null;
  if(rs.log.length<s.sets*(per?2:1)){ startRest(s.restSec||75); }
  else { rs.status="done"; cueDone(); renderStep(); }
}
function strengthDone(s,rs){
  const alt=!!s.alternating, perN=(!alt&&s.perSide)?2:1;
  setRun(`
    <div class="eyebrow">Übung erledigt</div>
    <h1 style="margin:4px 0 12px">${esc(s.name)} ✓</h1>
    <div class="card"><div class="eyebrow" style="margin-bottom:4px">Antippen zum Korrigieren</div>
      ${rs.log.map((l,i)=>doneSetRow(l,i,perN,true,alt)).join("")}</div>
    <div class="field"><div class="lab">Notiz zur Übung (optional)</div>
      <textarea class="txt" id="exNote" placeholder="z.B. fühlte sich leicht an, nächstes Mal schwerer">${esc(rs.note||"")}</textarea></div>`);
  setBar(`<button class="btn good" onclick="saveExNote();nextStep()">Weiter</button>`);
}
function saveExNote(){ const t=$("exNote"); if(t) S.result.steps[S.stepIdx].note=t.value.trim()||undefined; }
// Inline-Sheet statt nativem prompt() — sieht auf iOS PWA besser aus und ist konsistent.
function skipExercise(){
  const s=S.spec.steps[S.stepIdx];
  setRun(`<div style="padding-top:12px">
    <div class="eyebrow">Übersprungen markieren</div>

}
function confirmSkip(){

  const why=(el && el.value? el.value.trim() : "")||"übersprungen";
  const rs=S.result.steps[S.stepIdx];
  rs.status="skipped"; rs.skipReason=why;
  if(rs.log && !rs.log.length) delete rs.log;
  toast("Übung übersprungen"); skipToNext();
}

/* ---- PLYO (Sprungkraft / Plyometrie) — Qualität & Explosivität statt Versagen, kein RIR ---- */
function renderPlyo(s){
  const rs=S.result.steps[S.stepIdx];
  if(!rs.log) rs.log=[];
  const editing=S.sub.editIdx!=null;
  const setNo=rs.log.length;
  if(setNo>=s.sets && !editing){ return plyoDone(s,rs); }
  const hasLoad = s.load && s.load.kg!=null;
  const prev=rs.log[setNo-1];
  const defReps = prev?prev.reps:(Array.isArray(s.repTarget)?s.repTarget[0]:s.repTarget);
  const defLoad = prev?prev.load:(hasLoad?s.load.kg:0);
  if(S.sub.reps==null){ S.sub.reps=defReps; S.sub.load=defLoad; }
  const done=rs.log.map((l,i)=>doneSetRow(l,i,1,false)).join("");
  setRun(`
    <div class="eyebrow">${editing?`Korrektur · Satz ${S.sub.editIdx+1}`:`Satz ${setNo+1} von ${s.sets} · Sprungkraft`}</div>
    <h2 class="run-title" style="margin:4px 0 4px">${esc(s.name)}</h2>
    <p class="muted" style="margin-bottom:12px">
      Ziel ${esc(repText(s.repTarget))} Wdh${s.boxHeightCm?(" · Box "+s.boxHeightCm+" cm"):""}${hasLoad?(" · "+esc(s.load.text||(s.load.kg+" kg"))):(s.load&&s.load.text?(" · "+esc(s.load.text)):"")}</p>
    <div class="card">
      ${stepperField("Wiederholungen","reps",1,"Wdh")}
      ${hasLoad?plyoLoadField():""}
    </div>
    <div class="note" style="margin:12px 0">⚡ Explosiv, sauber landen — volle Erholung zwischen den Sätzen, <b>nicht</b> bis zur Erschöpfung.</div>
    ${cueDisclosure(mergeCues(s.cue,s.note),s.cuePinned)}
    ${s.lastTime?`<div class="note last-note" style="margin-bottom:14px">↩ Letztes Mal: ${esc(s.lastTime)}</div>`:""}
    ${done?`<div class="card"><div class="eyebrow" style="margin-bottom:4px">Erledigt · antippen zum Korrigieren</div>${done}</div>`:""}`);
  if(editing){
    setBar(`<div class="btn-row">
      <button class="btn sec" style="flex:none;width:40%" onclick="cancelEdit()">Abbrechen</button>
      <button class="btn" onclick="logPlyo()">Korrektur speichern</button>
    </div>`);
  } else {
    setBar(`<div class="btn-row">
      <button class="btn sec sm" style="flex:none;width:38%" onclick="skipExercise()">Überspringen</button>
      <button class="btn" onclick="logPlyo()">${setNo+1<s.sets?"Satz fertig → Pause":"Satz fertig"}</button>
    </div>`);
  }
}
function plyoLoadField(){
  return `<div class="field"><div class="lab">Last <span class="hint">kg</span></div>
    <div class="stepper">
      <button onclick="bump('load',-2)">–</button>
      <div class="val" onclick="typeVal('load')" title="Antippen zum Eintippen"><b class="tnum" id="v-load">${S.sub.load}</b><small>kg</small></div>
      <button onclick="bump('load',2)">+</button>
    </div></div>`;
}
function logPlyo(){
  const s=S.spec.steps[S.stepIdx], rs=S.result.steps[S.stepIdx];
  const entry={reps:S.sub.reps};
  if(S.sub.load) entry.load=S.sub.load;
  if(S.sub.editIdx!=null){
    rs.log[S.sub.editIdx]=Object.assign({},rs.log[S.sub.editIdx],entry);
    S.sub.editIdx=null; S.sub.reps=null;

    renderStep(); return;
  }

function plyoDone(s,rs){
  setRun(`
    <div class="eyebrow">Übung erledigt</div>
    <h1 style="margin:4px 0 12px">${esc(s.name)} ✓</h1>

      ${rs.log.map((l,i)=>doneSetRow(l,i,1,false)).join("")}</div>
    <div class="field"><div class="lab">Notiz zur Übung (optional)</div>
      <textarea class="txt" id="exNote" placeholder="z.B. Landung sauber, nächstes Mal Box +10 cm">${esc(rs.note||"")}</textarea></div>`);
  setBar(`<button class="btn good" onclick="saveExNote();nextStep()">Weiter</button>`);
}

/* ---- REST timer (between sets) ---- */
// Was kommt nach der Pause? (Übung · Satz/Runde) — für die Pausen-Anzeige
function nextUpLabel(){
  const s=S.spec.steps[S.stepIdx], rs=S.result.steps[S.stepIdx];
  if(!s||!rs||!Array.isArray(rs.log)) return "";
  if(s.type==="strength"||s.type==="plyo"){
    const perN=(s.type==="strength"&&!s.alternating&&s.perSide)?2:1;
    return `${esc(s.name)} · Satz ${Math.floor(rs.log.length/perN)+1} von ${s.sets}`;
  }
  if(s.type==="superset"){
    const slots=ssSlots(s); if(!slots.length) return "";
    const sl=slots[rs.log.length%slots.length];
    return `${esc(sl.ex.name)}${sideLabel(sl.side)} · Runde ${Math.floor(rs.log.length/slots.length)+1} von ${s.rounds}`;
  }
  if(s.type==="carry") return `${esc(s.name)} · Runde ${rs.log.length+1} von ${s.rounds}`;
  return "";
}
function startRest(sec){
  const nxt=nextUpLabel();
  setRun(`<div class="phase-rest" style="margin-top:14px">
    <div class="eyebrow center" style="color:var(--rest)">Pause</div>
    <div class="timer" id="restWrap">${ring(1,"Pause",mmss(sec))}</div>
    <div class="card center">
      ${nxt?`<div class="eyebrow" style="margin-bottom:4px">Gleich</div>
      <div style="font-weight:750;margin-bottom:6px">${nxt}</div>`:""}
      <p class="muted" style="font-size:13.5px">Werte vom letzten Satz übernommen.</p></div>
  </div>`);
  setBar(`<div class="btn-row">
    <button class="btn sec" style="flex:none;width:34%" onclick="Timer.add(30)">+30s</button>
    <button class="btn" onclick="Timer.stop();renderStep()">Pause überspringen</button>
  </div>`);
  Timer.start(sec,(rem,dur)=>{ const w=$("restWrap"); if(w) w.innerHTML=ring(rem/dur,"Pause",mmss(rem)); },
    ()=>{ renderStep(); }, "go");
}

/* ---- SUPERSET ----
   perSide:true je Übung (v4): die Übung belegt zwei aufeinanderfolgende Slots (links, rechts).
   Slot-Liste wird aus exercises[] expandiert; Log-Index ↔ Slot-Mapping bleibt stabil. */
function ssSlots(s){
  const out=[];
  (s.exercises||[]).forEach((ex,xi)=>{
    if(ex.perSide && !ex.alternating){ out.push({ex,xi,side:"L"}); out.push({ex,xi,side:"R"}); }
    else out.push({ex,xi});   // alternating (im Wechsel) belegt EINEN Slot, kein L/R-Split
  });
  return out;
}
function renderSuperset(s){
  const rs=S.result.steps[S.stepIdx]; if(!rs.log)rs.log=[];
  const slots=ssSlots(s), slotN=slots.length, exN=s.exercises.length;
  const total=s.rounds*slotN, done=rs.log.length;
  if(done>=total){ rs.status="done"; return supersetDone(s,rs); }
  const round=Math.floor(done/slotN), sI=done%slotN, slot=slots[sI], ex=slot.ex;
  const prev=rs.log[done-slotN]; // same slot (exercise + side) prev round
  const defReps=prev?prev.reps:(Array.isArray(ex.repTarget)?ex.repTarget[1]:ex.repTarget);
  const defLoad=prev?prev.load:(ex.load&&ex.load.kg!=null?ex.load.kg:0);
  const defRir =prev?prev.rir :(ex.rirTarget!=null?ex.rirTarget:2);
  if(S.sub.reps==null){ S.sub.reps=defReps; S.sub.load=defLoad; S.sub.rir=defRir; }
  const bw = ex.load && /bw|körper|body/i.test(ex.load.text||"");
  const firstSlot = round===0&&sI===0;
  const metro = metroCard(ex.tempo, Array.isArray(ex.repTarget)?ex.repTarget[1]:ex.repTarget,
                          !ex.alternating, slot.side==="R");
  setRun(`
    <div class="eyebrow">Runde ${round+1}/${s.rounds} · Übung ${slot.xi+1}/${exN}${slot.side?sideLabel(slot.side):(ex.alternating?" · im Wechsel":"")}</div>
    <h2 class="run-title" style="margin:4px 0 4px">${esc(ex.name)}</h2>
    <p class="muted" style="margin-bottom:12px">Ziel ${esc(repText(ex.repTarget))} Wdh${ex.alternating?" / Seite (im Wechsel)":""}${ex.load?(" · "+esc(ex.load.text||(ex.load.kg+" kg"))):""}${ex.rirTarget!=null?(" · RIR "+ex.rirTarget):""}${tempoText(ex.tempo)?(" · Takt "+esc(tempoText(ex.tempo))):""}</p>
    ${metro}
    <div class="card">
      ${stepperField("Wiederholungen","reps",1,"Wdh")}
      ${bw?"":loadField2(ex)}
      ${ex.rirTarget!=null?stepperField("RIR","rir",1,"RIR",0,6):""}
    </div>
    ${cueDisclosure(mergeCues(ex.cue, firstSlot?s.cue:null), ex.cuePinned||(firstSlot&&s.cuePinned))}
    ${s.lastTime&&firstSlot?`<div class="note last-note" style="margin-bottom:14px">↩ Letztes Mal: ${esc(s.lastTime)}</div>`:""}`);
  metroAutoStart();                // rechte Seite eines perSide-Slots startet von selbst
  const isLastInRound = sI===slotN-1;
  const label = slot.side==="L" ? "Links fertig → rechts"
              : (isLastInRound&&round+1<s.rounds?"Runde fertig → Pause":"Erledigt");
  setBar(`<button class="btn" onclick="logSuperset(${isLastInRound})">${label}</button>`);
}
function loadField2(ex){
  const bells=S.spec.availableBells; let chips="";
  if(Array.isArray(bells)&&bells.length) chips=`<div class="chips" style="margin-top:8px">${bells.map(b=>`<span class="chip ${S.sub.load==b?'on':''}" onclick="setVal('load',${b})">${b}</span>`).join("")}</div>`;
  return `<div class="field"><div class="lab">Last <span class="hint">kg ${ex.load&&ex.load.perHand?"je Hand":""}</span></div>
    <div class="stepper"><button onclick="bump('load',-2)">–</button>
      <div class="val" onclick="typeVal('load')" title="Antippen zum Eintippen"><b class="tnum" id="v-load">${S.sub.load}</b><small>kg</small></div>
      <button onclick="bump('load',2)">+</button></div>${chips}</div>`;
}
function logSuperset(restAfter){
  Metro.harvest();
  const s=S.spec.steps[S.stepIdx], rs=S.result.steps[S.stepIdx];
  const slots=ssSlots(s);
  const slot=slots[rs.log.length%slots.length];
  const entry={reps:S.sub.reps,rir:S.sub.rir};
  if(S.sub.load) entry.load=S.sub.load;
  if(slot&&slot.side) entry.side=slot.side;
  if(S.sub.metroUsed) entry.metronome=true;
  rs.log.push(entry);
  S.sub.metroUsed=false;
  const total=s.rounds*slots.length;
  if(rs.log.length>=total){ rs.status="done"; cueDone(); renderStep(); return; }
  // nach links direkt rechts (Werte bleiben als Vorbelegung), keine Pause dazwischen
  if(slot&&slot.side==="L"){ renderStep(); return; }
  S.sub.reps=null;
  if(restAfter){ startRest(s.restSec||90); }
  else { renderStep(); }
}
function supersetDone(s,rs){
  const slots=ssSlots(s);
  setRun(`<div class="eyebrow">Superset erledigt</div>
    <h1 style="margin:4px 0 12px">${esc(s.label||"Superset")} ✓</h1>
    <div class="card">${rs.log.map((l,i)=>{const sl=slots[i%slots.length];
      return `<div class="set-row"><div class="n ok">${Math.floor(i/slots.length)+1}</div>
      <span>${esc(sl.ex.name)}${sideLabel(l.side)} · ${l.reps} Wdh${sl.ex.alternating?"/Seite":""}${l.load?(" · "+l.load+" kg"):""}</span></div>`;}).join("")}</div>
    <div class="field"><div class="lab">Notiz (optional)</div><textarea class="txt" id="exNote">${esc(rs.note||"")}</textarea></div>`);
  setBar(`<button class="btn good" onclick="saveExNote();nextStep()">Weiter</button>`);
}

/* ---- INTERVAL (emom / intervals / tabata) ---- */
function buildPhases(s){
  const ph=[], rot=(s.rotation&&s.rotation.length)?s.rotation:[s.label||"Arbeit"];
  let workCount=0;
  for(let r=0;r<s.rounds;r++){
    if(s.scheme==="emom"){
      // EMOM: jede Runde = ein voller Arbeits-Slot (Reps + Rest innerhalb des Slots)
      ph.push({kind:"work",sec:s.workSec||60,move:rot[r%rot.length],round:r});
    } else {
      // intervals / tabata: Arbeit, dann Pause (außer nach der letzten Runde)
      ph.push({kind:"work",sec:s.workSec||20,move:rot[workCount%rot.length],round:r});
      workCount++;
      if((s.restSec||0)>0 && r<s.rounds-1) ph.push({kind:"rest",sec:s.restSec,round:r});
    }
  }
  return ph;
}
function renderInterval(s){
  if(!S.sub.phases){ S.sub.phases=buildPhases(s); S.sub.pi=0; S.sub.running=false; }
  intervalShow(s);
}
function intervalShow(s){
  const ph=S.sub.phases, i=S.sub.pi, p=ph[i];
  if(!p){ return intervalLog(s); }
  const cls=p.kind==="work"?"phase-work":"phase-rest";
  const workRounds=ph.filter(x=>x.kind==="work").length;
  const wIdx=ph.slice(0,i+1).filter(x=>x.kind==="work").length;
  setRun(`<div class="${cls}">
    <div class="center" style="margin:6px 0 2px">
      <span class="pill ${p.kind==='work'?'work':'rest'}">${p.kind==='work'?"ARBEIT":"PAUSE"} · ${s.scheme.toUpperCase()}</span>
    </div>
    <h1 class="center" style="margin:10px 0 0;font-size:24px">${esc(p.move||(p.kind==='rest'?'Pause':''))}</h1>
    <p class="center muted" style="margin-bottom:2px">${p.kind==='work'?("Runde "+wIdx+" / "+workRounds):"locker"}${s.repTargetPerRound&&p.kind==='work'?(" · Ziel "+s.repTargetPerRound+" Wdh"):""}${s.load&&p.kind==='work'?(" · "+esc(s.load.text||s.load)):""}</p>
    <div class="timer" id="ivWrap">${ring(1,p.kind==='work'?"arbeit":"pause",mmss(p.sec))}</div>
    ${p.kind==='work'?cueBlock(s.cue,10):""}
    ${s.note?`<div class="note">${esc(s.note)}</div>`:""}
  </div>`);
  if(!S.sub.running){
    setBar(`<button class="btn" onclick="ivStart()">${i===0?"Intervall starten":"Weiter"}</button>`);
  } else {
    setBar(`<div class="btn-row">
      <button class="btn sec" style="flex:none;width:34%" onclick="ivPause()">${Timer.paused?"Weiter":"Pause"}</button>
      <button class="btn" onclick="ivSkip()">Phase überspringen</button></div>`);
  }
}
const IV_PREP=5; // Sekunden "Bereitmachen" vor dem Intervall-Start (desynct EMOM nicht – nur einmal vorweg)
function ivPrepSec(s){ return (s&&s.prepSec>0)?s.prepSec:IV_PREP; }   // Step kann via prepSec verlängern (v6)
// Start (oder Wiederaufnahme nach Zurück): erst 5s Countdown, dann die erste Phase.
function ivStart(){ S.sub.running=true; const p=S.sub.phases[S.sub.pi]; if(p) ivPrep(p); else runPhase(); }
function ivPrepShow(s,p,sec){
  const cls=p.kind==="work"?"phase-work":"phase-rest";
  setRun(`<div class="${cls}">
    <div class="center" style="margin:6px 0 2px">
      <span class="pill ${p.kind==='work'?'work':'rest'}">Gleich geht's los · ${s.scheme.toUpperCase()}</span>
    </div>
    <h1 class="center" style="margin:10px 0 0;font-size:24px">${esc(p.move||(p.kind==='rest'?'Pause':''))}</h1>
    <div class="timer" id="ivWrap">${ring(1,"bereitmachen",mmss(sec))}</div>
    ${p.kind==='work'?cueBlock(s.cue,10):""}
  </div>`);
  setBar(`<div class="btn-row">
    <button class="btn sec" style="flex:none;width:34%" onclick="ivPause()">${Timer.paused?"Weiter":"Pause"}</button>
    <button class="btn" onclick="ivSkipPrep()">Jetzt starten</button></div>`);
}
function ivPrep(p){
  const s=S.spec.steps[S.stepIdx];
  S.sub.inPrep=true;
  cueAnnounce();                                  // "gleich geht's los"
  const prep=ivPrepSec(s);
  ivPrepShow(s,p,prep);
  Timer.start(prep,(rem,dur)=>{ const w=$("ivWrap"); if(w)w.innerHTML=ring(rem/dur,"bereitmachen",mmss(rem)); },
    ()=>{ S.sub.inPrep=false; runPhase(); }, "go");  // "go"-Alarm (inkl. 3-2-1-0) liegt am Prep-Ende = Arbeitsstart
}
function ivSkipPrep(){ Timer.stop(); S.sub.inPrep=false; const p=S.sub.phases[S.sub.pi]; if(p)(p.kind==="work"?cueWork():cueRest()); runPhase(); }
function runPhase(){
  const s=S.spec.steps[S.stepIdx], ph=S.sub.phases, p=ph[S.sub.pi];
  if(!p) return intervalLog(s);
  intervalShow(s);
  const nxt=ph[S.sub.pi+1];
  const endKind = nxt ? (nxt.kind==="work"?"go":"rest") : "done";
  Timer.start(p.sec,(rem,dur)=>{ const w=$("ivWrap"); if(w)w.innerHTML=ring(rem/dur,p.kind==='work'?"arbeit":"pause",mmss(rem)); },
    ()=>{ S.sub.pi++; if(S.sub.pi<ph.length){ runPhase(); } else { intervalLog(s); } }, endKind);
}
function ivPause(){ if(Timer.paused){Timer.resume();}else{Timer.pause();}
  const s=S.spec.steps[S.stepIdx];
  if(S.sub.inPrep) ivPrepShow(s,S.sub.phases[S.sub.pi],Math.max(0,Timer.remainAtPause||ivPrepSec(s)));
  else intervalShow(s); }
function ivSkip(){ Timer.stop(); S.sub.pi++; const s=S.spec.steps[S.stepIdx];
  if(S.sub.pi<S.sub.phases.length) runPhase(); else intervalLog(s); }
function intervalLog(s){
  Timer.stop();
  const rs=S.result.steps[S.stepIdx]; rs.status="done";
  const workRounds=S.sub.phases.filter(x=>x.kind==="work").length;
  setRun(`<div class="eyebrow">Intervall fertig</div>
    <h1 style="margin:4px 0 10px">${esc(s.label||"Intervall")} ✓</h1>
    <div class="note" style="margin-bottom:14px">${workRounds} Arbeitsrunden absolviert.</div>
    ${s.repTargetPerRound?`<div class="field"><div class="lab">Ø Wdh pro Runde (optional)</div>
      <input class="txt tnum" id="ivReps" inputmode="numeric" placeholder="${esc(s.repTargetPerRound)}"></div>`:""}
    <div class="field"><div class="lab">Notiz (optional)</div><textarea class="txt" id="exNote" placeholder="z.B. letzte 2 Runden hart"></textarea></div>`);
  setBar(`<button class="btn good" onclick="saveInterval(${workRounds})">Weiter</button>`);
}
function saveInterval(rounds){
  const s=S.spec.steps[S.stepIdx], rs=S.result.steps[S.stepIdx];
  const repsEl=$("ivReps"), reps=repsEl&&repsEl.value?Number(repsEl.value):null;
  rs.log=[]; for(let r=0;r<rounds;r++) rs.log.push(reps!=null?{reps:reps}:{done:true});
  const n=$("exNote"); if(n&&n.value.trim()) rs.note=n.value.trim();
  nextStep();
}

/* ---- CIRCUIT (core finisher) ---- */
// Halt vs. dynamisch wird allein über das optionale Spec-Feld st.hold gesteuert:
//   kein hold (oder false) → dynamische Station, kein Halt-Label
//   hold:true              → statischer Halt, Ring zeigt "HALTEN"
function buildCircuit(s){
  const ph=[];
  for(let r=0;r<s.rounds;r++){
    s.stations.forEach((st)=>{
      const base={cue:st.cue,round:r,load:st.load,prep:st.prepSec};   // prepSec (v6): längere Bereitmachen-Phase
      // perSide + timed → split
      if(st.perSide && st.durationSec){
        const hold=!!st.hold;
        ph.push({...base,timed:true,sec:st.durationSec,name:st.name+" (links)",hold});
        ph.push({...base,timed:true,sec:st.durationSec,name:st.name+" (rechts)",hold});
      }
      // perSide + distanceM → split (v2: z.B. Suitcase Carry 30 m je Seite)
      else if(st.perSide && st.distanceM){
        ph.push({...base,timed:false,distanceM:st.distanceM,name:st.name+" (links)"});
        ph.push({...base,timed:false,distanceM:st.distanceM,name:st.name+" (rechts)"});
      }
      // timed (no perSide)
      else if(st.durationSec){
        ph.push({...base,timed:true,sec:st.durationSec,name:st.name,hold:!!st.hold});
      }
      // distance-based (v2)
      else if(st.distanceM){
        ph.push({...base,timed:false,distanceM:st.distanceM,name:st.name});
      }
      // reps-based (fallback)
      else {
        ph.push({...base,timed:false,reps:st.reps,name:st.name+(st.perSide?" (pro Seite)":"")});
      }
    });
    if((s.restBetweenRoundsSec||0)>0 && r<s.rounds-1) ph.push({timed:true,sec:s.restBetweenRoundsSec,name:"Pause",rest:true,round:r});
  }
  return ph;
}
function renderCircuit(s){
  if(!S.sub.phases){ S.sub.phases=buildCircuit(s); S.sub.pi=0; S.sub.running=false; }
  circuitShow(s);
}
function circuitShow(s){
  const ph=S.sub.phases, p=ph[S.sub.pi];
  if(!p){ return circuitDone(s); }
  const cls=p.rest?"phase-rest":"phase-work";
  setRun(`<div class="${cls}">
    <div class="center" style="margin:6px 0"><span class="pill ${p.rest?'rest':'work'}">${esc(s.label||"Core")} · Runde ${p.round+1}/${s.rounds}</span></div>
    <h1 class="center" style="margin:8px 0 0;font-size:23px">${esc(p.name)}</h1>
    ${p.timed&&!p.rest&&p.load?`<p class="center" style="margin:6px 0 0;font-weight:750">${esc(loadText(p.load))}</p>`:""}
    ${p.timed?`<div class="timer" id="ccWrap">${ring(1,p.rest?"pause":(p.hold?"halten":""),mmss(p.sec))}</div>`
      :`<div class="center" style="padding:34px 0"><div class="big-num" style="font-size:64px;color:var(--work)">${p.distanceM?(p.distanceM+" m"):esc(p.reps||"")}</div><div class="t-sub" style="color:var(--muted)">${p.distanceM?"Strecke":"Wiederholungen"}${p.load?(" · "+esc(loadText(p.load))):""}</div></div>`}
    ${!p.rest?cueBlock(p.cue,8):""}
  </div>`);
  if(p.timed){
    if(!S.sub.running) setBar(`<button class="btn" onclick="ccStart()">${S.sub.pi===0?"Core starten":"Weiter"}</button>`);
    else setBar(`<div class="btn-row"><button class="btn sec" style="flex:none;width:34%" onclick="ccPause()">${Timer.paused?"Weiter":"Pause"}</button>
      <button class="btn" onclick="ccSkip()">Überspringen</button></div>`);
  } else {
    setBar(`<button class="btn" onclick="ccNextManual()">Station fertig</button>`);
  }
}
function ccStart(){
  const s=S.spec.steps[S.stepIdx], p=S.sub.phases[S.sub.pi];
  S.sub.running=true;
  // Vor der allerersten Station denselben 5s-Vorlauf wie zwischen den Stationen geben
  // (Countdown auch vor Runde 1 des Circuits gewünscht). Anläuten + 3-2-1-0 liegen in ccPrep.
  // Reps-Stationen haben keinen Timer → direkt starten (manueller "Station fertig"-Button).
  if(p && p.timed && !p.rest){ ccPrep(s,p); return; }
  ccRun();
}
function ccRun(){
  const s=S.spec.steps[S.stepIdx], ph=S.sub.phases, p=ph[S.sub.pi];
  if(!p) return circuitDone(s);
  circuitShow(s);
  if(!p.timed) return;
  const nxt=ph[S.sub.pi+1];
  const endKind = nxt ? (nxt.rest?"rest":"go") : "done";
  Timer.start(p.sec,(rem,dur)=>{ const w=$("ccWrap"); if(w)w.innerHTML=ring(rem/dur,p.rest?"pause":(p.hold?"halten":""),mmss(rem)); },
    ()=>{ ccAdvance(); }, endKind);
}
// kurze Übergangs-Phase zwischen zwei Stationen: nächste Übung ankündigen + 3-2-1-Countdown
// (analog zur Mobility-Einnehmphase moPrep). Rein laufzeit-intern — verändert WEDER die
// Spec/Result-Struktur NOCH die Stationsliste, nur den Ablauf in der App.
const CC_PREP=5; // Sekunden Übergang zwischen den Übungen (Default; Station kann via prepSec verlängern)
function ccPrepSec(p){ return (p&&p.prep>0)?p.prep:CC_PREP; }
function ccPrepShow(s,p,sec){
  setRun(`<div class="phase-rest">
    <div class="center" style="margin:6px 0"><span class="pill rest">${esc(s.label||"Core")} · Nächste Übung</span></div>
    <h1 class="center" style="margin:10px 0 0;font-size:23px">${esc(p.name)}</h1>
    ${p.load?`<p class="center" style="margin:6px 0 0;font-weight:750">${esc(loadText(p.load))}</p>`:""}
    <div class="timer" id="ccWrap">${ring(1,"bereitmachen",mmss(sec))}</div>
    ${cueBlock(p.cue,8)}
  </div>`);
  setBar(`<div class="btn-row">
    <button class="btn sec" style="flex:none;width:34%" onclick="ccPause()">${Timer.paused?"Weiter":"Pause"}</button>
    <button class="btn" onclick="ccSkipPrep()">Jetzt starten</button></div>`);
}
function ccPrep(s,p){
  S.sub.inPrep=true; S.sub.running=true;
  cueAnnounce();                              // anläuten: "gleich geht's los"
  const prep=ccPrepSec(p);
  ccPrepShow(s,p,prep);
  Timer.start(prep,(rem,dur)=>{ const w=$("ccWrap"); if(w)w.innerHTML=ring(rem/dur,"bereitmachen",mmss(rem)); },
    ()=>{ S.sub.inPrep=false; ccRun(); }, "go");
}
function ccSkipPrep(){ Timer.stop(); S.sub.inPrep=false; ccRun(); }
function ccAdvance(){ S.sub.pi++; const s=S.spec.steps[S.stepIdx];
  if(S.sub.pi>=S.sub.phases.length){ return circuitDone(s); }
  const np=S.sub.phases[S.sub.pi];
  if(np.rest){ S.sub.inPrep=false; S.sub.running=true; ccRun(); }   // Rundenpause: kein Übergang davor
  else { ccPrep(s,np); }                                            // vor jede Übung ein 3s-Übergang
}
function ccNextManual(){ S.sub.pi++; const s=S.spec.steps[S.stepIdx];
  if(S.sub.pi>=S.sub.phases.length){ cueDone(); return circuitDone(s); }
  const np=S.sub.phases[S.sub.pi];
  if(np.rest){ S.sub.inPrep=false; S.sub.running=true; cueRest(); ccRun(); }
  else { ccPrep(s,np); }
}
function ccPause(){ if(Timer.paused)Timer.resume();else Timer.pause();
  const s=S.spec.steps[S.stepIdx];
  if(S.sub.inPrep){ ccPrepShow(s,S.sub.phases[S.sub.pi],Math.max(0,Timer.remainAtPause||ccPrepSec(S.sub.phases[S.sub.pi]))); }
  else circuitShow(s); }
function ccSkip(){ Timer.stop(); ccAdvance(); }
function circuitDone(s){
  Timer.stop(); const rs=S.result.steps[S.stepIdx]; rs.status="done"; rs.done=true;
  setRun(`<div class="eyebrow">Core fertig</div>
    <h1 style="margin:4px 0 12px">${esc(s.label||"Core-Finisher")} ✓</h1>
    <div class="field"><div class="lab">Notiz (optional)</div><textarea class="txt" id="exNote"></textarea></div>`);
  setBar(`<button class="btn good" onclick="saveExNote();nextStep()">Weiter</button>`);
}

/* ---- MOBILITY (RomWOD / Yin) — ruhige Holds, Recovery, kein Trainingsreiz ---- */
function buildMobility(s){
  const ph=[], rounds=s.rounds||1, rest=s.restBetweenRoundsSec||0;
  for(let r=0;r<rounds;r++){
    (s.poses||[]).forEach(p=>{
      if(p.perSide){
        ph.push({sec:p.durationSec||60,name:p.name,side:"links",cue:p.cue,round:r,prep:p.prepSec});
        ph.push({sec:p.durationSec||60,name:p.name,side:"rechts",cue:p.cue,round:r,prep:p.prepSec});
      } else {
        ph.push({sec:p.durationSec||60,name:p.name,cue:p.cue,round:r,prep:p.prepSec});
      }
    });
    if(rest>0 && r<rounds-1) ph.push({sec:rest,name:"Pause",rest:true,round:r});
  }
  return ph;
}
function renderMobility(s){
  if(!S.sub.phases){ S.sub.phases=buildMobility(s); S.sub.pi=0; S.sub.running=false; }
  mobilityShow(s);
}
function mobilityShow(s){
  const ph=S.sub.phases, i=S.sub.pi, p=ph[i];
  if(!p){ return mobilityDone(s); }
  const totalPoses=ph.filter(x=>!x.rest).length;
  const poseIdx=ph.slice(0,i+1).filter(x=>!x.rest).length;
  const next=ph[i+1];
  const nextLabel=next?(next.rest?"Pause":esc(next.name)+(next.side?(" · "+next.side):"")):"fertig";
  setRun(`<div class="phase-mob">
    <div class="center" style="margin:6px 0">
      <span class="pill mob">${esc(s.label||"Mobility")} · ${p.rest?"Pause":(poseIdx+" / "+totalPoses)}</span>
    </div>
    <h1 class="center" style="margin:10px 0 0;font-size:23px">${esc(p.name)}${p.side?` <span class="muted" style="font-weight:600">· ${p.side}</span>`:""}</h1>
    <div class="timer" id="moWrap">${ring(1,p.rest?"pause":"halten",mmss(p.sec))}</div>
    <div class="note center">${p.cue?esc(p.cue):"Tief atmen — mit jedem Ausatmen ein Stück tiefer sinken, ohne zu forcieren."}</div>
    ${next?`<p class="center muted" style="margin-top:12px;font-size:13px">Als Nächstes: ${nextLabel}</p>`:""}
  </div>`);
  if(!S.sub.running){
    setBar(`<button class="btn" onclick="moStart()">${i===0?"Mobility starten":"Weiter"}</button>`);
  } else {
    setBar(`<div class="btn-row">
      <button class="btn sec" style="flex:none;width:34%" onclick="moPause()">${Timer.paused?"Weiter":"Pause"}</button>
      <button class="btn" onclick="moSkip()">Pose überspringen</button></div>`);
  }
}
function moStart(){ S.sub.running=true; moRun(); }
const MOB_PREP=6; // Sekunden zum Einnehmen der Pose (Default; Pose kann via prepSec verlängern)
function moPrepSec(p){ return (p&&p.prep>0)?p.prep:MOB_PREP; }
function moRun(){
  const s=S.spec.steps[S.stepIdx], ph=S.sub.phases, p=ph[S.sub.pi];
  if(!p) return mobilityDone(s);
  if(p.rest){ moHold(s,p); }      // reine Pause braucht keine Einnehm-Phase
  else { moPrep(s,p); }
}
// kurze Vorbereitungs-Phase: Pose ankündigen + 3-2-1-Countdown, dann Hold
function moPrepShow(s,p,sec){
  const ph=S.sub.phases, i=S.sub.pi;
  const totalPoses=ph.filter(x=>!x.rest).length;
  const poseIdx=ph.slice(0,i+1).filter(x=>!x.rest).length;
  setRun(`<div class="phase-mob">
    <div class="center" style="margin:6px 0">
      <span class="pill mob">Einnehmen · ${poseIdx} / ${totalPoses}</span>
    </div>
    <h1 class="center" style="margin:10px 0 0;font-size:23px">${esc(p.name)}${p.side?` <span class="muted" style="font-weight:600">· ${p.side}</span>`:""}</h1>
    <div class="timer" id="moWrap">${ring(1,"bereitmachen",mmss(sec))}</div>
    <div class="note center">${p.cue?esc(p.cue):"Position ruhig einnehmen, Atem fließen lassen."}</div>
  </div>`);
  setBar(`<div class="btn-row">
    <button class="btn sec" style="flex:none;width:34%" onclick="moPause()">${Timer.paused?"Weiter":"Pause"}</button>
    <button class="btn" onclick="moSkipPrep()">Jetzt halten</button></div>`);
}
function moPrep(s,p){
  S.sub.inPrep=true;
  cueAnnounce();                              // anläuten: nächste Pose kommt
  const prep=moPrepSec(p);
  moPrepShow(s,p,prep);
  Timer.start(prep,(rem,dur)=>{ const w=$("moWrap"); if(w)w.innerHTML=ring(rem/dur,"bereitmachen",mmss(rem)); },
    ()=>{ moHold(s,p); }, "go");
}
function moSkipPrep(){ Timer.stop(); const s=S.spec.steps[S.stepIdx]; moHold(s,S.sub.phases[S.sub.pi]); }
// eigentlicher Hold (oder Pause-Phase)
function moHold(s,p){
  S.sub.inPrep=false;
  mobilityShow(s);
  // Letzte Phase → "done"-Klingel (inkl. 3-2-1) statt leisem soft-Ton: hörbares
  // Abschluss-Signal am Ende des Cool-Downs (v6). Alle anderen Holds bleiben ruhig.
  const endKind=S.sub.phases[S.sub.pi+1]?"soft":"done";
  Timer.start(p.sec,(rem,dur)=>{ const w=$("moWrap"); if(w)w.innerHTML=ring(rem/dur,p.rest?"pause":"halten",mmss(rem)); },
    ()=>{ moAdvance(); }, endKind);
}
function moAdvance(){ S.sub.pi++; const s=S.spec.steps[S.stepIdx];
  if(S.sub.pi<S.sub.phases.length) moRun(); else mobilityDone(s); }
function moPause(){
  if(Timer.paused)Timer.resume();else Timer.pause();
  const s=S.spec.steps[S.stepIdx];
  if(S.sub.inPrep){ moPrepShow(s,S.sub.phases[S.sub.pi],Math.max(0,Timer.remainAtPause||moPrepSec(S.sub.phases[S.sub.pi]))); }
  else { mobilityShow(s); }
}
function moSkip(){ Timer.stop(); if(!S.sub.phases[S.sub.pi+1]) cueDone(); moAdvance(); }   // Skip der letzten Pose klingelt trotzdem ab
function mobilityDone(s){
  Timer.stop(); const rs=S.result.steps[S.stepIdx]; rs.status="done"; rs.done=true;
  setRun(`<div class="eyebrow">Mobility fertig</div>
    <h1 style="margin:4px 0 12px">${esc(s.label||"Mobility")} ✓</h1>
    <div class="note" style="margin-bottom:14px">Schön gemacht — Recovery zählt, auch wenn sie keine Sätze aufs Konto bucht.</div>
    <div class="field"><div class="lab">Notiz (optional)</div><textarea class="txt" id="exNote" placeholder="z.B. Hüfte rechts deutlich enger als links"></textarea></div>`);
  setBar(`<button class="btn good" onclick="saveExNote();nextStep()">Weiter</button>`);
}

/* ---- CARDIO (v2: segments[]) ----
   Zwei UX-Modi je nach Segmenten:
   - 1 Segment (flach, z.B. 40 min Z2): Count-up-Timer (UpTimer) wie v1 — Person kann
     länger/kürzer machen, „Fertig" entscheidet.
   - n Segmente (z.B. ICG Climb-Profil): Count-down pro Segment, auto-advance, am Ende
     gesamtes Ergebnisformular. Strikte Timing-Vorgabe je Block. */
function renderCardio(s){
  const segs=s.segments||[];
  if(!segs.length){ skipStep("Cardio ohne Segmente — bitte v2-Spec senden"); return; }
  const isBike=s.modality==="bike";
  const totalMin=cardioTotalMin(s), totalSec=totalMin*60;
  const isSingle=segs.length===1;
  if(!S.sub.cardioStarted){
    const seg0=segs[0];
    setRun(`
      <div class="eyebrow">${({row:"Rudern",run:"Laufen",bike:"Bike"})[s.modality]||"Ausdauer"}</div>
      <h1 style="margin:4px 0 12px">${totalMin} min${isSingle&&seg0.targetHr?(" · "+seg0.targetHr.zone):""}${!isSingle?(" · "+segs.length+" Segmente"):""}</h1>
      <div class="card">
        ${segs.map((seg,i)=>`<div class="kv">
          <span><span class="tag ${segIntensityCls(seg)}">${esc(seg.name||("Segment "+(i+1)))}</span> &nbsp;<span class="muted">${mmss(seg.durationSec)}</span></span>
          <b style="font-size:13.5px">${segmentTargetLabel(seg)}</b>
        </div>`).join("")}
      </div>
      ${s.note?`<div class="note">${esc(s.note)}</div>`:""}
      ${cueBlock(s.cue,0)}
      ${hrZones()?`<div class="card"><div class="eyebrow" style="margin-bottom:8px">HF-Zonen</div>
        ${hrZones().map(zz=>`<div class="kv" style="font-size:13.5px"><span>${esc(zz.z)} · ${esc(zz.name||"")}</span><b class="muted">${zz.lo}–${zz.hi}</b></div>`).join("")}</div>`:""}`);
    setBar(`<button class="btn" onclick="cardioStart()">Timer starten</button>`);
    return;
  }
  if(isSingle) cardioRunningFlat(s,totalSec,isBike);
  else cardioSegmentShow(s);
}
function segIntensityCls(seg){
  const it=(seg.intensity||"").toLowerCase();
  if(it==="hard"||it==="vo2"||it==="threshold") return "";              // accent
  if(it==="easy"||it==="recovery"||it==="z2"||(seg.targetHr&&/Z[12]/.test(seg.targetHr.zone||""))) return "row";
  return "";
}
function segmentTargetLabel(seg){
  const p=[];
  if(seg.targetHr) p.push(`HF ${seg.targetHr.min}–${seg.targetHr.max}${seg.targetHr.zone?(" "+seg.targetHr.zone):""}`);
  if(seg.targetWatt) p.push(`${seg.targetWatt.min}–${seg.targetWatt.max} W`);
  if(seg.targetWattColor) p.push(esc(seg.targetWattColor));
  if(seg.targetRpm) p.push(`${seg.targetRpm.min}–${seg.targetRpm.max} RPM`);
  if(seg.targetSpm) p.push(`${seg.targetSpm.min}–${seg.targetSpm.max} spm`);
  if(seg.targetPace) p.push(esc(seg.targetPace));
  return p.join(" · ") || (seg.intensity?esc(seg.intensity):"locker");
}
function cardioStart(){
  S.sub.cardioStarted=true;
  const s=S.spec.steps[S.stepIdx];
  const segs=s.segments||[];
  const totalSec=segs.reduce((a,x)=>a+(x.durationSec||0),0);
  cueWork(); keepAwake();
  if(segs.length===1){
    // FLAT: count-up
    S.sub.targetCued=false;
    scheduleAlarm("done",totalSec);
    UpTimer.start((e)=>{ const w=$("upWrap"); if(!w)return;

function cardioRunningFlat(s,targetSec,isBike){

function cardioPauseFlat(){

function cardioSegmentRun(s){
  const segs=s.segments||[];

  cardioSegmentShow(s);
  const nextSeg=segs[idx+1];
  const endKind = nextSeg ? "go" : "done";
  Timer.start(seg.durationSec,(rem,dur)=>{
    const w=$("caWrap"); if(w) w.innerHTML=ring(rem/dur,seg.intensity==="hard"?"arbeit":"halten",mmss(rem));
  },()=>{

}

function cardioPauseSeg(){ if(Timer.paused) Timer.resume(); else Timer.pause(); cardioSegmentShow(S.spec.steps[S.stepIdx]); }

function cardioFinishManual(){

    UpTimer.stop();
    S.sub.elapsed=elapsed;
    cardioFinishForm(s);
  } else {
    // Mid-Segment-Stop: bisherige Dauer berechnen
    const idx=S.sub.segIdx||0;
    const currentRemain = Timer.dur ? (Timer.endsAt-performance.now())/1000 : 0;
    const currentSec = segs[idx] ? Math.max(0, segs[idx].durationSec - currentRemain) : 0;

function pickColor(el,c){ document.querySelectorAll("#cColor .chip").forEach(x=>x.classList.remove("on")); el.classList.add("on"); S.sub.color=c; }
function showZone(){ const hr=Number($("cHr").value); const out=$("zoneOut"); if(!out)return;

function saveCardio(){

function buildSummary(status){

  const r=S.result, m=r.meta||(r.meta={});
  const now=new Date();
  m.date=now.toISOString().slice(0,10); m.weekday=WD[now.getDay()];
  const actualMin=S.startedAt?Math.round((Date.now()-S.startedAt)/60000):null;
  // tallies — perSide-Logs zählen L+R zusammen als EINEN harten Satz
  let hardSets=0;
  const doneSteps=r.steps.filter(s=>s.status!=="skipped").length;
  r.steps.forEach(s=>{
    if(s.status==="skipped" || !Array.isArray(s.log)) return;
    if(s.type==="strength") hardSets += (s.perSide && !s.alternating) ? Math.ceil(s.log.length/2) : s.log.length;
    if(s.type==="superset"){
      const slots=ssSlots(s);
      s.log.forEach((l,i)=>{ const sl=slots.length?slots[i%slots.length]:null; if(!(sl&&sl.side==="R")) hardSets++; });
    }
  });

    status:status,
    actualDurationMin:actualMin,
    totalHardSets:hardSets,
    overallNotes:""

}

function resultJSON(){

// Bevorzugt das native iOS Share Sheet (Web Share API), fällt zurück auf Clipboard.
// Vorteil iOS: Direkt-Share in Claude/Mail/Notes/Slack möglich.
async function shareResult(){
  const txt=resultJSON();

      await navigator.share({title:"Workout Result", text:txt});
      toast("Geteilt ✓");
      return;
    }catch(e){

}
function copyToClipboard(txt,msg){
  const done=()=>{toast(msg||"Kopiert ✓ — in den Coach-Chat einfügen");};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));
  } else { fallbackCopy(txt,done); }
}
// mailto an den Coach: Adresse kommt aus der Spec (resultMailto) — die App bleibt frei
// von privaten Daten. Öffnet die Standard-Mail-App (iOS: als Default eingestellte App,
// z.B. Proton Mail) mit Betreff + Result-JSON vorausgefüllt. Das JSON liegt zusätzlich
// in der Zwischenablage, falls die Mail-App lange mailto-Bodies kürzt; bei sehr langen
// Results übergibt mailto nur einen kurzen Hinweis und der User fügt aus der Ablage ein.
const MAILTO_MAX=16000;   // konservatives Limit für die gesamte mailto-URI
function mailResult(){
  const to=S.spec&&S.spec.resultMailto; if(!to) return;
  const n=$("sumNote"); if(n) S.result.summary.overallNotes=n.value.trim();
  S.result.schemaVersion=SCHEMA;
  const json="```json\n"+JSON.stringify(S.result)+"\n```";   // kompakt: mailto-Platz sparen
  copyToClipboard(json,"Mail geöffnet — Result liegt auch in der Zwischenablage 📋");
  const subj=("workout-result · "+(S.result.meta.focus||"Workout")+" · "+(S.result.meta.date||"")).trim();
  const mk=b=>"mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(b);
  let uri=mk(json+"\n");
  if(uri.length>MAILTO_MAX)
    uri=mk("Das workout-result-JSON war zu lang für die mailto-Übergabe — es liegt in der Zwischenablage: hier einfügen. 📋\n");
  location.href=uri;
}
function copyResult(){ copyToClipboard(resultJSON()); }
function fallbackCopy(txt,done){ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");done();}catch(e){toast("Bitte manuell kopieren");} document.body.removeChild(ta); }
// Preview aktualisieren, wenn der User die Gesamt-Notiz ändert.
function refreshResultPreview(){
  const out=$("resPreviewBody");
  if(!out) return;
  // Snapshot der summary inkl. aktueller Notiz erzeugen, ohne S.result zu mutieren bevor Save
  const n=$("sumNote");
  const note = n ? n.value.trim() : (S.result.summary.overallNotes||"");
  const snap = JSON.parse(JSON.stringify(S.result));
  snap.schemaVersion = SCHEMA;
  if(snap.summary) snap.summary.overallNotes = note;
  out.textContent = JSON.stringify(snap, null, 2);
}
function downloadResult(){
  const n=$("sumNote"); if(n) S.result.summary.overallNotes=n.value.trim(); S.result.schemaVersion=SCHEMA;
  const blob=new Blob([JSON.stringify(S.result,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  const d=S.result.meta.date||"session"; a.href=url; a.download=`workout-result-${d}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  clearSaved();
}

/* ============================================================
   QUIT / shorten
   ============================================================ */
function confirmQuit(){
  setRun(`<div style="padding-top:20px">
    <h1 style="margin-bottom:8px">Session beenden?</h1>
    <p class="muted" style="margin-bottom:18px">Eine verkürzte Session zählt trotzdem — Konsistenz schlägt Perfektion.</p>
    <div class="card stack-sm">
      <button class="btn" onclick="endShortened()">Jetzt abschließen & Result erzeugen</button>
      <button class="btn sec sm" onclick="renderStep()">Weiter trainieren</button>
      <button class="btn ghost" onclick="hardQuit()">Komplett verwerfen</button>
    </div></div>`);
  setBar(``);
}
function endShortened(){
  // mark remaining steps as skipped
  for(let i=S.stepIdx;i<S.result.steps.length;i++){
    const rs=S.result.steps[i];
    if(rs.status!=="done"){ if(!(rs.log&&rs.log.length)){ rs.status="skipped"; rs.skipReason=rs.skipReason||"Session verkürzt"; } }
  }
  S.screen="summary"; buildSummary("shortened");
}
// Inline-Sheet statt nativem confirm() — irreversibler Schritt, deshalb destruktive Optik.
function hardQuit(){
  setRun(`<div style="padding-top:20px">
    <h1 style="margin-bottom:8px">Wirklich alles verwerfen?</h1>
    <p class="muted" style="margin-bottom:18px">Alles bisher Getrackte geht verloren. Eine verkürzte Session zählt mehr als eine verworfene — Konsistenz schlägt Perfektion.</p>
    <div class="card stack-sm">
      <button class="btn sec" onclick="confirmQuit()">Zurück</button>
      <button class="btn" style="background:#c92a2a" onclick="reallyHardQuit()">Ja, alles verwerfen</button>
    </div>
  </div>`);
  setBar(``);
}
function reallyHardQuit(){ clearSaved(); silenceOff(); renderImport(); }

/* ============================================================
   autosave (crash recovery only)
   ============================================================ */
let _saveDisabled=false;
function saveProgress(){
  if(_saveDisabled) return;
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      spec:S.spec,result:S.result,stepIdx:S.stepIdx,startedAt:S.startedAt,ts:Date.now()}));
  }catch(e){
    // Quota voll oder localStorage gesperrt (Private Mode) — Auto-Speichern still abschalten,
    // Session läuft im Speicher weiter, nur Crash-Recovery geht verloren.
    _saveDisabled=true;
    try{ localStorage.removeItem(SAVE_KEY); }catch(_){}
    if(e && e.name==="QuotaExceededError") toast("Auto-Speichern aus (Speicher voll)");
  }
}
function loadSaved(){ try{ const raw=localStorage.getItem(SAVE_KEY); if(!raw)return null;
  const o=JSON.parse(raw); if(!o.spec||Date.now()-o.ts>1000*60*60*8) return null; return o; }catch(e){return null;} }
function resumeSaved(){ const o=loadSaved(); if(!o)return renderImport();
  S.spec=o.spec; S.result=o.result; S.stepIdx=o.stepIdx; S.startedAt=o.startedAt; S.sub={};
  unlockAudio(); keepAwake(); S.screen="run"; renderStep(); }
function discardSaved(){ clearSaved(); renderImport(); }
function clearSaved(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function restartAll(){ clearSaved(); S={screen:"import",spec:null,result:null,stepIdx:0,sub:{},startedAt:null}; renderImport(); }

   layout helper — wrap scroll content height
   ============================================================ */

/* ============================================================
   URL-Loader — Workout über #w=<percent-encoded JSON> laden
   Payload liegt im Fragment (hinter #) und wird nie an einen Server
   geschickt. Greift der Link, springt die App direkt zur Übersicht.
   ============================================================ */
function loadFromHash(){
  let frag = location.hash || "";
  if(frag.charAt(0)==="#") frag=frag.slice(1);
  if(!/^w=/.test(frag)) return false;
  let payload=frag.slice(2);
  let o=null;
  try{ o=JSON.parse(decodeURIComponent(payload)); }
  catch(e){ try{ o=JSON.parse(payload); }catch(e2){ o=extractJSON(decodeURIComponent(payload)); } }
  const errs=validateSpec(o);
  if(errs.length){
    // Hash defekt — Fragment entfernen und Import-Screen mit Hinweis zeigen
    try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
    setTimeout(()=>toast("Hash-Link unbrauchbar — bitte Spec manuell einfügen"),300);
    return false;
  }
  normalizeSpec(o);
  themeFromSpec(o);
  S.spec=o;
  S.result=JSON.parse(JSON.stringify(o));
  S.result.kind="workout-result";
  S.stepIdx=0; S.sub={}; S.startedAt=null;
  // Fragment entfernen, damit ein Reload das Workout nicht erneut lädt
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  renderReady();
  return true;
}

/* ---------- boot ---------- */
if(!loadFromHash()) renderImport();
