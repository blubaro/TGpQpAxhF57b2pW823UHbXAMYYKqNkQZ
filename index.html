<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%232D7DC4'/%3E%3Crect x='80' y='22' width='32' height='15' rx='6' fill='%23FFFFFF'/%3E%3Ccircle cx='96' cy='104' r='52' fill='none' stroke='%23FFFFFF' stroke-width='13'/%3E%3Cpath d='M74 104 l14 16 l28 -34' fill='none' stroke='%23FFFFFF' stroke-width='13' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#F4F6F8; --card:#FFFFFF; --ink:#2E3338; --muted:#7E868C;
  --line:#E8EAED; --line-strong:#D5DADE;
  /* Primärfarbe (Buttons, Fortschritt, Links) — concept2-Blau */
  --accent:#2D7DC4; --accent-ink:#1F5E97; --accent-soft:#E2EEF8;
  /* Phasen-Farben: Arbeit warm, Pause blau, Mobility ruhiges Grün */
  --work:#E5562C; --work-ink:#B53C18; --work-soft:#FBE7DE;
  --rest:#2D7DC4; --rest-ink:#1F5E97; --rest-soft:#E2EEF8;
  --mob:#2E9E7B; --mob-ink:#1F7A5E; --mob-soft:#DCF1EA;
  --good:#2E9E7B; --good-soft:#DCF1EA;
  --shadow:0 1px 2px rgba(35,40,46,.04),0 4px 16px rgba(35,40,46,.06);
  --r:18px; --r-sm:12px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
/* ---- Themes (umschaltbar via [data-theme] an <html>; Default = amoled, s. JS) ----
   Regel: -ink = gut lesbare Textfarbe auf -soft-Fläche DIESES Themes,
   -soft = flächige Tönung. In dunklen Themes sind -ink hell, -soft dunkel. */
:root[data-theme="amoled"]{
  --paper:#000000; --card:#0C0E10; --ink:#F2F4F6; --muted:#9AA2A8;
  --line:#20242A; --line-strong:#2E343B;
  --accent:#3E9BE8; --accent-ink:#8CC7F2; --accent-soft:#0E2233;
  --work:#FF6A3D; --work-ink:#FFB39A; --work-soft:#2A130B;
  --rest:#3E9BE8; --rest-ink:#8CC7F2; --rest-soft:#0E2233;
  --mob:#34C08A; --mob-ink:#8FE3C4; --mob-soft:#08221A;
  --good:#34C08A; --good-soft:#08221A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.6);
}
:root[data-theme="sepia"]{
  --paper:#F3EBDD; --card:#FBF6EC; --ink:#4A3F33; --muted:#8C7E6B;
  --line:#E3D8C6; --line-strong:#D2C4AD;
  --accent:#B5722E; --accent-ink:#8A551D; --accent-soft:#EFE0CB;
  --work:#C6551F; --work-ink:#9A3D12; --work-soft:#F0DDCB;
  --rest:#5E86A8; --rest-ink:#3E5F7D; --rest-soft:#DDE6ED;
  --mob:#6E8B4E; --mob-ink:#51683A; --mob-soft:#E2E7D2;
  --good:#6E8B4E; --good-soft:#E2E7D2;
  --shadow:0 1px 2px rgba(74,63,51,.05),0 4px 16px rgba(74,63,51,.08);
}
:root[data-theme="contrast"]{
  --paper:#FFFFFF; --card:#FFFFFF; --ink:#0A0C0E; --muted:#3A4046;
  --line:#8B9298; --line-strong:#3A4046;
  --accent:#0A5FB4; --accent-ink:#08477F; --accent-soft:#D6E6F5;
  --work:#C62F00; --work-ink:#8E2200; --work-soft:#FBDDD2;
  --rest:#0A5FB4; --rest-ink:#08477F; --rest-soft:#D6E6F5;
  --mob:#0B7A4B; --mob-ink:#075733; --mob-soft:#CFEAD9;
  --good:#0B7A4B; --good-soft:#CFEAD9;
  --shadow:none;
}
:root[data-theme="coral"]{
  --paper:#FBF6F4; --card:#FFFFFF; --ink:#33292A; --muted:#8A7A7B;
  --line:#F0E4E0; --line-strong:#E3D0CB;
  --accent:#EC5F52; --accent-ink:#C23B2E; --accent-soft:#FCE4E0;
  --work:#E5562C; --work-ink:#B53C18; --work-soft:#FBE7DE;
  --rest:#2AA9A0; --rest-ink:#1B7B74; --rest-soft:#D6EFEC;
  --mob:#2E9E7B; --mob-ink:#1F7A5E; --mob-soft:#DCF1EA;
  --good:#2E9E7B; --good-soft:#DCF1EA;
  --shadow:0 1px 2px rgba(51,41,42,.05),0 4px 16px rgba(51,41,42,.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* iOS: 100% lügt bei ein-/ausfahrender Safari-Leiste → dvh, außen nichts scrollen lassen */
html,body{height:100%;overflow:hidden}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;
  font-feature-settings:"tnum" 1; -webkit-font-smoothing:antialiased;
  line-height:1.45; overscroll-behavior-y:none;
}
.tnum{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;padding-top:var(--safe-t)}
#main{display:contents}            /* mobil: topbar/screen/actionbar bleiben Flex-Kinder von #app */
.rail{display:none}                /* mobil + schmaler Desktop: keine Seitenspalten */
#topbar:empty{display:none}
#actionbar:empty{display:none}
/* min-height:0 — sonst wehrt sich der Flex-Default (min-height:auto) gegen das
   Schrumpfen und lange Inhalte drucken die Actionbar aus dem Viewport */
.scroll{flex:1;min-height:0;overflow-y:auto;padding:16px 18px calc(112px + var(--safe-b));
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ---- Seitenspalten (Verlauf links / Hinweise rechts) ---- */
.rail-head{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.rail-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.rail-card .note{margin-bottom:0}
.rail-title{font-weight:750;font-size:15px;margin-top:6px}
.rail-empty{font-size:13px;padding:4px 2px}
.vl{display:flex;flex-direction:column;gap:1px}
.vl-item{display:flex;gap:11px;padding:9px 8px;border-radius:11px;align-items:flex-start;cursor:pointer}
.vl-item:hover{background:var(--paper)}
.vl-item:active{transform:scale(.99)}
.vl-cur{background:var(--accent-soft)}
.vl-cur:hover{background:var(--accent-soft)}
.vl-dot{width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;
  font-size:12px;font-weight:800;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.vl-done .vl-dot{background:var(--good);color:#fff;border-color:transparent}
.vl-skip .vl-dot{background:var(--line-strong);color:#fff;border-color:transparent}
.vl-cur  .vl-dot{background:var(--accent);color:#fff;border-color:transparent}
.vl-title{font-size:14px;font-weight:650;line-height:1.25}
.vl-cur .vl-title{font-weight:800}
.vl-todo .vl-title{color:var(--muted)}
.vl-meta{font-size:11.5px;color:var(--muted);margin-top:1px}

/* ---- Desktop: drei Spalten, nur während eines laufenden Workouts ---- */
@media (min-width:980px){
  /* grid-template-rows:minmax(0,1fr) ist Pflicht: ohne Angabe entsteht eine implizite
     auto-Zeile, und die wird nach dem INHALT bemessen — sie wächst über die 100dvh des
     Containers hinaus. Folge (Bug 08.09.26): bei langen Schritten (viele Log-Zeilen)
     rutscht die statische Actionbar samt "Weiter" unter den Bildschirmrand, und weil
     html/body overflow:hidden sind, gibt es keine Scroll-Bar, die sie zurückholt.
     minmax(0,1fr) deckelt die Zeile auf die Containerhöhe — dann scrollt wieder .scroll.
     Mobil tritt das nicht auf: dort ist #app Flex mit definierter Höhe, Bar position:fixed. */
  body.run-mode #app{max-width:1340px;display:grid;
    grid-template-columns:320px minmax(0,1fr) 384px;grid-template-rows:minmax(0,1fr);
    gap:20px;padding:0 14px;
    height:100dvh;align-items:stretch}
  body.run-mode #main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
  body.run-mode .rail{display:block;height:100%;min-height:0;overflow-y:auto;padding:24px 2px 30px}
  body.run-mode .scroll{padding:24px 6px 28px}
  body.run-mode .topbar{position:static}
  body.run-mode .actionbar{position:static;left:auto;right:auto;max-width:none;margin:0;
    padding:16px 6px calc(20px + var(--safe-b));background:none;border-top:1px solid var(--line)}
  body.run-mode .disc{display:none}        /* Hinweis lebt auf dem Desktop in der rechten Spalte */
  body.run-mode .last-note{display:none}   /* "Letztes Mal" ebenso → rechte Spalte */
  body.run-mode .timer .ring{width:290px}  /* breite Mittelspalte → Ring darf größer */
  body.run-mode .timer .ring .t-val{font-size:74px}
}

/* ---- typography ---- */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* Wortmarke "the.coach" — Farbverlauf Accent→Grün; -ink-Töne sind je Theme auf
   Lesbarkeit kalibriert (dunkle Themes: hell, helle Themes: satt) */
.brand{display:inline-block;font-size:22px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(92deg,var(--accent-ink) 0%,var(--mob-ink) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent}
h1{font-size:clamp(23px,6.5vw,26px);font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{font-size:19px;font-weight:750;letter-spacing:-.01em}
.big-num{font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.center{text-align:center}
/* Übungs-Titel im Run: kompakter als h1, max. 2 Zeilen statt unkontrolliertem Umbruch */
.run-title{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);
  display:flex;align-items:center;gap:10px;padding:9px 54px 9px 14px;
  border-bottom:1px solid var(--line)}
/* Theme-Umschalter — fixer Button oben rechts, auf allen Screens erreichbar.
   SVG-Icon statt Emoji (Emoji rendert auf iOS als bunter Fremdkörper) + Milchglas-Fläche. */
.theme-btn{position:fixed;top:calc(10px + var(--safe-t));right:12px;z-index:40;
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--muted);line-height:0;
  display:grid;place-items:center;cursor:pointer}
@supports (backdrop-filter:blur(4px)) or (-webkit-backdrop-filter:blur(4px)){
  .theme-btn{background:color-mix(in srgb,var(--card) 70%,transparent);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
}
.theme-btn:active{transform:scale(.92)}
.topbar .prog-wrap{flex:1}
.topbar .prog-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line-strong);
  background:var(--card);font-size:16px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:disabled{opacity:.32}
.iconbtn:active:not(:disabled){background:var(--paper)}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card.flush{padding:0;overflow:hidden}

/* ---- buttons ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  min-height:58px;border-radius:var(--r-sm);border:none;font-size:17px;font-weight:700;
  background:var(--accent);color:#fff;cursor:pointer;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.4}
.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line-strong)}
.btn.ghost{background:transparent;color:var(--muted);min-height:48px;font-weight:600;border:none}
.btn.good{background:var(--good)}
.btn.sm{min-height:46px;font-size:15px}
.btn-row{display:flex;gap:10px}

/* ---- bottom action bar ----
   pointer-events:none auf der Bar selbst: der transparente Gradient-Anteil ragt über den
   Inhalt und darf Taps auf darunterliegende Elemente NICHT schlucken (iOS-Bug: "nicht
   immer klickbar"). Die Buttons selbst fangen ihre Events wieder ein. */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none;
  background:linear-gradient(to top,var(--paper) 62%,transparent);
  padding:12px 18px calc(12px + var(--safe-b));max-width:520px;margin:0 auto}
.actionbar > *{pointer-events:auto}

/* ---- Tempo-Metronom (v7) ----
   Balken = POSITION in der Bewegung (voll = unten/gedehnt): läuft bei der Exzentrik voll,
   friert in den Pausen ein, läuft bei der Konzentrik leer. Farbe + Wort sagen die Phase.
   Der Vignetten-Overlay (#metroTint) tönt NUR die Ränder — dort arbeitet das periphere
   Sehen, und der Text in der Mitte bleibt unangetastet. Genau das ist der Punkt: unter
   Last soll man den Takt sehen, OHNE hinzusehen. */
.metro{border-color:var(--line-strong)}
.metro-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.metro-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
/* Ohne Ton ist das Auge der einzige Kanal — Phasenwort, Restzeit und Balken sind deshalb
   bewusst groß. Der Balken muss aus zwei Metern und aus dem Augenwinkel lesbar sein. */
.metro-phase{font-size:34px;font-weight:800;letter-spacing:.06em;line-height:1;color:var(--muted)}
.metro-sec{font-size:28px;font-weight:800;color:var(--muted)}
.metro-track{height:30px;border-radius:99px;background:var(--paper);border:1px solid var(--line);
  overflow:hidden;position:relative}
.metro-prep .metro-phase,.metro-prep .metro-sec{color:var(--accent)}
.metro-fill{height:100%;width:0;border-radius:99px;background:var(--line-strong)}
/* Kein CSS-Transition auf der Breite: der Balken wird pro Frame gesetzt, eine Transition
   würde ihn dem echten Takt hinterherhinken lassen — das Gegenteil des Zwecks. */
.metro-fill.ecc{background:var(--rest)}
.metro-fill.con{background:var(--work)}
.metro-fill.hold{background:var(--muted)}
.metro-p-ecc .metro-phase,.metro-p-ecc .metro-sec{color:var(--rest)}
.metro-p-con .metro-phase,.metro-p-con .metro-sec{color:var(--work)}
.metro-p-hold .metro-phase,.metro-p-hold .metro-sec{color:var(--ink)}
.metro-track.pulse{animation:metroPulse 1s ease-in-out infinite}
@keyframes metroPulse{0%,100%{opacity:1}50%{opacity:.55}}
.metro-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px}
.metro-reps{font-size:14px;font-weight:700;color:var(--muted)}
.metro-foot .btn{width:auto;flex:none;padding:0 18px}
.metro-sound{padding:7px 12px;font-size:13px;line-height:1}
/* Einstellungen in der Takt-Karte: Klang, Lautstärke, Vorlauf — alles, was sich erst
   am Gerät und unter Last entscheidet. Eingeklappt, damit die Karte im Satz ruhig bleibt. */
.metro-set{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.metro-set.bare{border-top:none;margin-top:0;padding-top:0}
.mset-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}
.mset-row:last-child{margin-bottom:0}
.mset-lab{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.mset-lab b{color:var(--ink);font-variant-numeric:tabular-nums}
.mset-row input[type=range]{flex:1;min-width:110px;accent-color:var(--accent);height:26px}
.metro-set .chip{padding:7px 13px;font-size:13px}
#metroTint{position:fixed;inset:0;pointer-events:none;z-index:20;opacity:0;
  transition:opacity .16s linear;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 38%,var(--metro-c,transparent) 100%)}
#metroTint.on{opacity:.40}
@media (prefers-reduced-motion:reduce){
  #metroTint{transition:none}
  .metro-track.pulse{animation:none}
}

/* ---- steppers ---- */
.field{margin:14px 0}
.field .lab{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.field .lab .hint{text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted)}
.stepper{display:flex;align-items:stretch;gap:10px}
.stepper button{width:60px;flex:none;border:1.5px solid var(--line-strong);background:var(--card);
  border-radius:14px;font-size:26px;font-weight:600;color:var(--ink);cursor:pointer}
.stepper button:active{background:var(--paper)}
.stepper .val{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1.5px solid var(--line);border-radius:14px;background:var(--paper);padding:6px 0}
.stepper .val b{font-size:30px;font-weight:800;line-height:1}
.stepper .val small{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:99px;border:1.5px solid var(--line-strong);
  background:var(--card);font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

input.txt,textarea.txt{width:100%;border:1.5px solid var(--line);border-radius:12px;
  background:var(--paper);padding:13px 14px;font-size:16px;font-family:inherit;color:var(--ink)}
textarea.txt{resize:vertical;min-height:64px}

/* checklist */
.check{display:flex;align-items:center;gap:13px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:none}
.check .box{width:26px;height:26px;flex:none;border:2px solid var(--line-strong);border-radius:8px;display:grid;place-items:center;font-size:15px;color:#fff}
.check.on .box{background:var(--good);border-color:var(--good)}
.check.on span{color:var(--muted);text-decoration:line-through}

/* big timer */
.timer{display:flex;flex-direction:column;align-items:center;padding:4px 0}
/* Ring skaliert mit dem Viewport (kleine iPhones: kein Abschneiden, kein Extra-Scroll) */
.timer .ring{position:relative;width:min(240px,62vw);aspect-ratio:1;display:grid;place-items:center;margin:4px 0}
.timer .ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer .ring .t-val{font-size:clamp(42px,16vw,62px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.timer .ring .t-sub{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.phase-work .ring circle.fg{stroke:var(--work)}
.phase-rest .ring circle.fg{stroke:var(--rest)}
.phase-mob  .ring circle.fg{stroke:var(--mob)}
.phase-work .t-sub{color:var(--work-ink)}
.phase-rest .t-sub{color:var(--rest-ink)}
.phase-mob  .t-sub{color:var(--mob-ink)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;
  font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line)}
.pill.work{background:var(--work-soft);color:var(--work-ink);border-color:transparent}
.pill.rest{background:var(--rest-soft);color:var(--rest-ink);border-color:transparent}
.pill.mob{background:var(--mob-soft);color:var(--mob-ink);border-color:transparent}
.pill.z2{background:var(--good-soft);color:var(--good);border-color:transparent}

.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:750}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:7px;background:var(--accent-soft);color:var(--accent-ink)}
.tag.row{background:var(--mob-soft);color:var(--mob-ink)}
.tag.done{background:var(--good-soft);color:var(--good)}

.stack-sm > * + *{margin-top:8px}
.set-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.set-row:last-child{border-bottom:none}
.set-row .n{width:26px;height:26px;flex:none;border-radius:7px;background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.set-row .n.ok{background:var(--good);color:#fff}

/* einklappbarer Hinweis (i) — hält den Cue aus dem Weg, bis er gebraucht wird */
.disc{margin-bottom:14px}
.disc-toggle{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);
  color:var(--accent-ink);border:none;border-radius:99px;padding:8px 14px;font-size:13px;
  font-weight:700;cursor:pointer}
.disc-toggle:active{filter:brightness(.97)}
.disc-caret{font-size:10px;opacity:.7}
.disc-body{display:none;margin-top:9px}
.disc.open .disc-body{display:block}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

.divider{height:1px;background:var(--line);margin:16px 0}
.note{font-size:13.5px;color:var(--muted);background:var(--paper);border-radius:12px;padding:11px 13px;border:1px solid var(--line)}

.celebrate .eyebrow,.celebrate .muted{color:rgba(255,255,255,.85)}

<body>
<div id="metroTint" aria-hidden="true"></div>
<div id="app">
  <aside id="railL" class="rail"></aside>
  <main id="main">
    <div id="topbar"></div>
    <div class="scroll" id="screen"></div>
    <div id="actionbar" class="actionbar"></div>
  </main>
  <aside id="railR" class="rail"></aside>
</div>
<div id="toast" class="toast"></div>
<button id="themeBtn" class="theme-btn" type="button" onclick="cycleTheme()" aria-label="Design wechseln" title="Design wechseln"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.75a8.25 8.25 0 0 1 0 16.5z" fill="currentColor"/></svg></button>

<script>
"use strict";
/* ============================================================
   the.coach (ehem. Coach Runner)  —  rendert workout-spec, gibt workout-result
   Single file, vanilla JS, offline-tauglich. schemaVersion 7.

   Änderungen v1 → v2:
   - cardio strukturiert via segments[] (statt flachem durationMin+targetHr)
   - circuit.stations[] akzeptiert distanceM (z.B. 30m Carry als Station)
   - v1-Specs werden automatisch beim Import auf v2 normalisiert
   Änderungen v2 → v3 (rein additiv, abwärtskompatibel):
   - optionales cuePinned:true je Übung → Hinweis startet aufgeklappt statt hinter (i)
   Änderungen v3 → v4:
   - perSide:true bei strength / superset.exercises[] → Wdh/RIR links & rechts getrennt
     abfragen; Result-log-Zeilen tragen side:"L"|"R" (Pause erst nach rechts)
   - Ruder-Meter-Tracking entfernt (rowingMetersBefore, summary.rowingMeters*, Meilenstein-UI)
   - Last wird auch bei Timer-Stationen im Zirkel angezeigt
   - erledigte Sätze (strength/plyo) antippbar → Korrektur
   - Stepper-Wert antippbar → Direkteingabe
   Änderungen v4 → v5 (rein additiv, abwärtskompatibel):
   - optionales alternating:true bei strength / superset.exercises[] → Übung wird Arm-um-Arm
     IM WECHSEL ausgeführt: EIN Satz (kein L/R-Split), Reps gelten je Seite, Label "/Seite (im
     Wechsel)". Schließt perSide aus (alternating gewinnt). Result-log: eine Zeile/Satz, kein side.
   - Circuit: 5s-Countdown jetzt auch vor der ersten Station (vorher nur zwischen Stationen)
   Änderungen v5 → v6 (rein additiv, abwärtskompatibel):
   - optionales prepSec je circuit.stations[] / mobility.poses[] sowie je interval-Step →
     verlängert die "Bereitmachen"-Phase vor dieser Station/Pose (z.B. 20s, um vor dem
     Handstand-Hold zur Wand zu laufen und hochzukippen). Ohne Feld gelten die Defaults (5/6/5s).
   - Mobility: letzte Pose endet mit 3-2-1 + "done"-Klingel statt leisem soft-Ton →
     hörbares Abschluss-Signal am Ende des Cool-Downs/Workouts.
   Änderungen v6 → v7 (rein additiv, abwärtskompatibel):
   - optionales tempo je strength / superset.exercises[] → Tempo-Metronom im Satz-Screen:
     Balken (= Position in der Bewegung, voll = unten/gedehnt) + Phasenwort + leiser Klick,
     dazu eine Vignette am Bildschirmrand in der Phasenfarbe fürs periphere Sehen.
     Form: {ecc, pause, con, hold, start:"ecc"|"con"}, Sekunden; fehlende Werte = 0,
     con fällt auf 1 s zurück. Der Takt zählt die Wiederholungen mit und belegt den
     Wdh.-Stepper vor (außer bei alternating: dort ist eine Wdh. nicht seitenrein).
   - Result: log[].metronome:true bei jedem Satz, der wirklich am Takt lief. Damit ist
     Tempo wieder eine MESSGRÖSSE — ohne diesen Nachweis bleibt eine Tempo-Vorgabe
     unbelegt, und genau daran sind die 3-s-Exzentrik-Vorgaben bisher gescheitert.
   Nachtrag (additiv, ohne Bump):
   - optionales resultMailto (Top-Level, E-Mail-Adresse) → Summary zeigt "An den Coach
     mailen"-Button: mailto mit dem Result-JSON im Body (Adresse reist in der Spec mit,
     die App selbst bleibt personenagnostisch/frei von privaten Daten). Result wird
     zusätzlich in die Zwischenablage kopiert, falls die Mail-App den Body kürzt.
   Nachtrag (UI/Audio, ohne Bump — keine Spec-/Result-Änderung):
   - iOS-Layout: 100dvh statt 100%-Höhen-Falle, Safe-Area oben (Notch, Status-Bar
     black-translucent), Actionbar schluckt keine Taps mehr auf Inhalt darunter
     (pointer-events:none auf dem Gradient), Timer-Ring skaliert mit dem Viewport.
   - Theme-Button: SVG-Kontrast-Icon + Milchglas statt 🎨-Emoji.
   - Audio: End-Alarm reißt beim Phasenwechsel nicht mehr ab — bei natürlichem
     Timer-Ende werden die gerade klingenden Töne aus _sched entlassen, bevor der
     nächste scheduleAlarm clearScheduled aufruft (s. Timer.loop).
   - Feinschliff: Hover-States (Desktop), :focus-visible, sanfte Einblendung je Screen.
   Nachtrag (Audio iOS, ohne Bump — keine Spec-/Result-Änderung):
   - Kein Ton in iOS Safari bei umgelegtem Stummschalter: reines Web-Audio läuft
     in der ambient-Session, die der Klingel-/Stummschalter stummschaltet. Optionale
     Umgehung: praktisch stumme <audio>-Loop → playback-Kategorie. DEFAULT AUS, weil
     playback exklusiv ist und Spotify & Co. pausiert; ambient dagegen mischt sich
     mit der Musik. Opt-in "Ohne Musik trainieren" für Training ohne Begleitmusik.
   - AudioContext-Lifecycle gehärtet: audioReady wird erst gesetzt, wenn der
     Context wirklich "running" ist; resume() wird als Promise ausgewertet;
     defekte Contexts werden vor dem Neuaufbau geschlossen (iOS limitiert die
     Zahl gleichzeitiger Contexts); onstatechange primet nach Interrupts neu.
   - Töne kamen zu spät / in der falschen Phase: der End-Alarm liegt auf der
     Audio-Uhr, die iOS bei jeder Session-Unterbrechung einfriert, während die
     Anzeige auf performance.now() weiterläuft. Der Timer vergleicht beide Uhren
     jetzt je Frame (DRIFT_TOL) und legt den Alarm bei Stillstand neu; am
     Phasenende werden nur noch die wirklich klingenden Töne freigegeben,
     verspätete verworfen (releaseSounding).
   - Ton-Selbsttest im Ablauf-Screen vor dem Start.
   ============================================================ */

const SCHEMA = 7;
const SAVE_KEY = "coachRunner.session.v2";   // v1-Bucket bewusst gewechselt, damit alte localStorage-Sessions keine Crash-Recovery auslösen
const WD = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

// HF-Zonen kommen ausschließlich aus der Spec (optionales Feld spec.hrZones).
// Format je Eintrag (fiktives Beispiel): { z:"Z2", lo:120, hi:140, name:"Grundlage / UT2" }
// Fehlt das Feld, kennt die App keine Zonen — es bleiben nur die Ziel-Werte
// des jeweiligen Cardio-Schritts (s.targetHr). Keine festen Werte in der App.
function hrZones(){ return (S.spec && Array.isArray(S.spec.hrZones)) ? S.spec.hrZones : null; }
function zoneForHr(hr){
  const zones=hrZones();
  if(!hr || !zones || !zones.length) return null;
  for(const z of zones){ if(hr>=z.lo && hr<z.hi) return z.z; }
  // außerhalb des Tabellenrands: tiefste bzw. höchste Zone
  return hr < zones[0].lo ? zones[0].z : zones[zones.length-1].z;
}

/* ---------- global state ---------- */
let S = {
  screen:"import",      // import | ready | run | summary
  spec:null,
  result:null,          // working clone, mutated with logs
  stepIdx:0,
  sub:{},               // per-step transient progress
  startedAt:null,
};

/* ---------- DOM helpers ---------- */
const $ = id => document.getElementById(id);
const screenEl = $("screen"), barEl = $("actionbar"), toastEl = $("toast"), topEl = $("topbar");
function h(html){ return html; }
function setTop(html){ topEl.innerHTML = html || ""; }
// Jeder Screen-Aufbau beendet einen laufenden Takt (silent: kein Wert-Übernehmen).
// Catch-all statt Einzelfällen — sonst überlebt das Metronom irgendeinen Pfad und klickt
// weiter, während längst ein anderer Schritt auf dem Schirm steht.
function setScreen(html){ Metro.stop(true); setTop(""); screenEl.innerHTML = html; screenEl.scrollTop = 0; renderRails(); }
function setRun(html){ Metro.stop(true); setTop(topbar()); screenEl.innerHTML = html; screenEl.scrollTop = 0; renderRails(); }
function setBar(html){ barEl.innerHTML = html; }
let toastT;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove("show"),1600); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- Themes ----------
   Umschaltbar per 🎨-Button; Wahl merkt sich in localStorage.
   Start-Reihenfolge: gemerkte Wahl → spec.defaultTheme → "amoled" (Default). */
const THEME_KEY = "coachRunner.theme";
const THEMES = ["amoled","paper","sepia","contrast","coral"];   // Zyklus; amoled = Default/Fallback
const THEME_LABEL = { amoled:"Schwarz", paper:"Papier", sepia:"Sepia", contrast:"Kontrast", coral:"Coral" };
const THEME_BAR   = { amoled:"#000000", paper:"#F4F6F8", sepia:"#F3EBDD", contrast:"#FFFFFF", coral:"#FBF6F4" };
let themeUserSet = false;   // true, sobald der User bewusst gewählt hat (localStorage) — dann kein spec-Override
function applyTheme(t, persist){
  if(THEMES.indexOf(t)<0) t="amoled";
  document.documentElement.setAttribute("data-theme", t);
  const meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute("content", THEME_BAR[t]);
  const b=document.getElementById("themeBtn"); if(b) b.title="Design: "+THEME_LABEL[t]+" (tippen zum Wechseln)";
  if(persist){ try{ localStorage.setItem(THEME_KEY,t); }catch(e){} themeUserSet=true; }
}
function bootTheme(){
  let saved=null; try{ saved=localStorage.getItem(THEME_KEY); }catch(e){}
  themeUserSet = !!(saved && THEMES.indexOf(saved)>=0);
  applyTheme(themeUserSet ? saved : "amoled", false);
}
/* Spec darf ein Default-Theme mitgeben — greift nur, wenn der User nichts gewählt hat. */
function themeFromSpec(spec){
  if(!themeUserSet && spec && THEMES.indexOf(spec.defaultTheme)>=0) applyTheme(spec.defaultTheme, false);
}
function cycleTheme(){
  const cur = document.documentElement.getAttribute("data-theme") || "amoled";
  const next = THEMES[(THEMES.indexOf(cur)+1+THEMES.length)%THEMES.length];
  applyTheme(next, true);
  toast("Design: "+THEME_LABEL[next]);
}
bootTheme();
/* Cue-Block: zeigt einen Technik-/Sicherheitshinweis unter der Übung.
   cue kann ein String ODER ein String-Array sein. Array → Liste mit Punkten.
   Leeres/fehlendes cue → "" (rendert nichts). mb = margin-bottom in px. */
function cueBlock(cue,mb){
  if(cue==null) return "";
  const m = mb==null?14:mb;
  const style = `margin-bottom:${m}px`;
  if(Array.isArray(cue)){
    const items=cue.filter(c=>c!=null&&String(c).trim()!=="");
    if(!items.length) return "";
    if(items.length===1) return `<div class="note" style="${style}">💡 ${esc(items[0])}</div>`;
    return `<div class="note" style="${style}"><div style="display:flex;flex-direction:column;gap:5px">${
      items.map(c=>`<div style="display:flex;gap:7px"><span style="opacity:.8">•</span><span>${esc(c)}</span></div>`).join("")}</div></div>`;
  }
  if(String(cue).trim()==="") return "";
  return `<div class="note" style="${style}">💡 ${esc(cue)}</div>`;
}
function mmss(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60),s=sec%60; return m+":"+String(s).padStart(2,"0"); }
/* Last (String ODER {text,kg}) als Anzeigetext. */
function loadText(l){ if(l==null) return ""; if(typeof l==="string") return l; return l.text||(l.kg!=null?(l.kg+" kg"):""); }
/* Seiten-Label für perSide-Log-Einträge. */
function sideLabel(side){ return side==="L"?" · links":side==="R"?" · rechts":""; }
/* Mehrere Cue-Quellen (String|Array|null) zu einer flachen Liste zusammenführen. */
function mergeCues(...cs){
  const out=[];
  cs.forEach(c=>{ if(c==null)return;
    if(Array.isArray(c)) c.forEach(x=>{ if(x!=null&&String(x).trim()!=="")out.push(x); });
    else if(String(c).trim()!=="") out.push(c); });
  return out.length?out:null;
}
/* Einklappbarer Hinweis (i). Offen-Default = cuePinned (Schema v3); sonst hinter Toggle.
   Zustand lebt in S.sub.cueOpen für die Dauer des Schritts (übersteht das Re-Render je Satz). */
function cueDisclosure(cue,pinned){
  const body=cueBlock(cue,0);
  if(!body) return "";
  if(S.sub.cueOpen==null) S.sub.cueOpen=!!pinned;
  const open=S.sub.cueOpen;
  return `<div class="disc ${open?'open':''}" style="margin-top:12px">
    <button type="button" class="disc-toggle" onclick="toggleCue()">
      <span>ℹ︎ Hinweis</span><span class="disc-caret">${open?'▲':'▼'}</span></button>
    <div class="disc-body">${body}</div></div>`;
}
/* Nur die Klasse am DOM togglen — KEIN renderStep(): das würde den Screen neu bauen
   und die Scroll-Position auf 0 setzen (iOS: "springt nach oben"). */
function toggleCue(){
  S.sub.cueOpen=!S.sub.cueOpen;
  const d=document.querySelector(".disc");
  if(d){
    d.classList.toggle("open",S.sub.cueOpen);
    const c=d.querySelector(".disc-caret"); if(c) c.textContent=S.sub.cueOpen?"▲":"▼";
    return;
  }
  renderStep();
}

/* ---------- audio ----------
   iOS suspendiert den AudioContext aggressiv (Screen-Lock, Hintergrund,
   Stille). Deshalb: einmal per echtem Tap entsperren (inkl. Silent-Buffer),
   bei JEDER Interaktion + bei Rückkehr in den Vordergrund reaktivieren und
   vor jedem Ton einen resume()-Versuch starten. Töne werden als Sequenz
   relativ zu AC.currentTime geplant (zuverlässiger als setTimeout-Ketten). */
let AC=null, audioReady=false, _bus=null;

/* ---------- Stumm-Schalter-Umgehung (iOS) — OPT-IN ----------
   iOS-Eigenheit: reines Web-Audio landet in der "ambient" Audio-Session. Die
   MISCHT sich mit anderer Musik (Spotify läuft weiter, Beeps oben drauf) — wird
   aber vom Klingel-/Stummschalter am iPhone stummgeschaltet.
   Wer den Stummschalter überstimmen will, kann eine dauerhaft laufende, praktisch
   stumme <audio>-Loop zuschalten: die hebt die Seite in die "playback"-Kategorie,
   dann sind die Beeps auch bei umgelegtem Schalter hörbar. PREIS: playback ist
   exklusiv — Musik anderer Apps (Spotify) wird dabei pausiert/verdrängt. Beides
   zugleich (mischen UND Stummschalter überstimmen) gibt Safari auf iOS nicht her.
   Deshalb DEFAULT AUS: Musik läuft ungestört weiter, Töne folgen dem Schalter.
   Nur wer OHNE Musik trainiert, schaltet die Umgehung im Ablauf-Screen ein. */
const BYPASS_KEY="coachRunner.silentBypass";
// Opt-in: nur aktiv, wenn explizit eingeschaltet ("1"). Default aus → mischt mit Spotify.
// Safari im privaten Modus wirft bei localStorage — hier oben liefe der Fehler
// auf Top-Level und würde das ganze Skript abbrechen.
let SILENT_BYPASS = (()=>{ try{ return localStorage.getItem(BYPASS_KEY)==="1"; }catch(e){ return false; } })();
let _sil=null, _silURL=null;
// 2 s Mono-PCM (8 kHz) mit minimaler Restamplitude (~-90 dBFS). Echte Null-Stille
// wird von iOS teils als "spielt nichts" gewertet und schaltet die Session nicht um.
function _silenceURL(){
  const sr=8000, n=sr*2, len=44+n*2, buf=new ArrayBuffer(len), v=new DataView(buf);
  const put=(off,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(off+i,s.charCodeAt(i)); };
  put(0,"RIFF"); v.setUint32(4,len-8,true); put(8,"WAVEfmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  put(36,"data"); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++) v.setInt16(44+i*2,(i%2)?1:-1,true);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
function silenceOn(){
  if(!SILENT_BYPASS) return;
  try{
    if(!_sil){
      _sil=document.createElement("audio");
      _sil.loop=true; _sil.preload="auto"; _sil.setAttribute("playsinline","");
      _sil.src=_silURL||(_silURL=_silenceURL());
      _sil.style.display="none"; document.body.appendChild(_sil);
    }
    if(_sil.paused){ const p=_sil.play(); if(p&&p.catch) p.catch(()=>{}); }
  }catch(e){}
}
function silenceOff(){ try{ if(_sil) _sil.pause(); }catch(e){} }
// Globaler Lautstärke-Boost für ALLE Töne (damit sie über Musik hörbar sind).
// Alle Töne laufen durch _bus → Limiter → Ausgang; der Limiter fängt Übersteuern
// ab, sodass wir kräftig boosten können, ohne dass es kratzt/verzerrt.
const VOL=2.4;
function buildBus(){
  if(!AC || _bus) return;
  try{
    _bus=AC.createGain(); _bus.gain.value=1;
    const lim=AC.createDynamicsCompressor();  // als Limiter konfiguriert
    lim.threshold.value=-4; lim.knee.value=4; lim.ratio.value=20;
    lim.attack.value=0.002; lim.release.value=0.10;
    _bus.connect(lim); lim.connect(AC.destination);
  }catch(e){ _bus=null; }
}
// Der stumme 1-Sample-Buffer entsperrt die Pipeline — aber NUR, wenn der Context
// zu dem Zeitpunkt wirklich läuft. Früher wurde audioReady auch gesetzt, während
// resume() noch lief; dann fand die echte Entsperrung nie mehr statt.
function primeAudio(){
  if(!AC || AC.state!=="running" || audioReady) return;
  try{
    const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource();
    s.buffer=b; s.connect(_bus||AC.destination); s.start(0);
    audioReady=true;
  }catch(e){}
}
function unlockAudio(){
  try{
    // "closed" ist endgültig — resume() bringt nichts, Pipeline neu aufbauen.
    if(AC && AC.state==="closed"){ AC=null; _bus=null; audioReady=false; }
    if(!AC){
      const Ctx=window.AudioContext||window.webkitAudioContext;
      if(!Ctx) return;
      AC=new Ctx();
      // Fällt der Context von selbst zurück (iOS-Interrupt: Anruf, Siri, anderes
      // Audio), beim nächsten Wiederanlaufen erneut primen.
      AC.onstatechange=()=>{ if(AC&&AC.state==="running") primeAudio(); };
    }
    buildBus();
    silenceOn();                       // Audio-Session hochstufen (Stumm-Schalter)
    if(AC.state!=="running"){
      const p=AC.resume();
      if(p&&p.then) p.then(primeAudio,()=>{});
    }
    primeAudio();
  }catch(e){}
}
// jede Nutzer-Interaktion hält die Audio-Pipeline wach
["touchstart","pointerdown","mousedown","keydown"].forEach(ev=>{
  document.addEventListener(ev,unlockAudio,{passive:true});
});
function ensureAudio(){
  try{
    if(!AC || AC.state==="closed"){ unlockAudio(); return; }
    silenceOn();
    if(AC.state!=="running"){
      const p=AC.resume();
      if(p&&p.then) p.then(primeAudio,()=>{});
    }
  }catch(e){
    // Defekten Context erst schließen, sonst sammeln sich Instanzen an und iOS
    // verweigert irgendwann jeden weiteren `new AudioContext()` → Dauer-Stille.
    try{ if(AC) AC.close(); }catch(_){}
    try{ AC=null; _bus=null; audioReady=false; unlockAudio(); }catch(_){}
  }
}
// Ist der Ton gerade wirklich spielbereit? (für Statusanzeige/Selbsttest)
function audioLive(){ return !!(AC && AC.state==="running" && audioReady); }

/* Ton-Karte im Ablauf-Screen: Selbsttest VOR dem Workout (statt mitten im Intervall
   festzustellen, dass nichts kommt) + Schalter für die Stumm-Umgehung. */
function audioCard(){
  return `<div class="card" id="audioCard">
    <div class="eyebrow" style="margin-bottom:8px">Ton</div>
    <div class="chips" style="margin-bottom:10px">
      <button type="button" class="chip" onclick="testAudio()">🔊 Ton testen</button>
      <button type="button" class="chip ${SILENT_BYPASS?"on":""}" onclick="toggleSilentBypass()">Ohne Musik trainieren</button>
    </div>
    <p class="muted" style="font-size:12.5px;margin:0">${SILENT_BYPASS
      ? "Signaltöne kommen auch bei lautlos gestelltem iPhone — pausiert aber Spotify & Co. Trainierst du mit Musik: hier ausschalten."
      : "Standard: Töne laufen parallel zu Spotify & Co., Musik bleibt an. Sie folgen dem Klingel-/Stummschalter — für Ton also nicht auf lautlos stellen."}</p>
  </div>`;
}
/* Takt-Einstellungen VOR dem Workout — offen, nicht hinter einem Zahnrad.
   Lautstärke und Vorlauf entscheiden sich mit laufender Musik und Hantel in Reichweite,
   also bevor der erste Satz läuft. Im Satz sitzt dasselbe Panel noch einmal hinter dem ⚙,
   für den Fall, dass es unter Last doch nicht passt. Erscheint nur, wenn die Session
   überhaupt einen Takt enthält. */
function firstTempo(spec){
  const st=(spec&&spec.steps)||[];
  for(const s of st){
    if(s.type==="strength" && tempoPhases(s.tempo)) return s.tempo;
    if(s.type==="superset"){
      for(const ex of (s.exercises||[])) if(tempoPhases(ex.tempo)) return ex.tempo;
    }
  }
  return null;
}
function taktCard(){
  const t=firstTempo(S.spec);
  if(!t) return "";
  // Übungen zählen, nicht Schritte: ein Superset kann zwei getaktete Übungen enthalten.
  let n=0;
  (S.spec.steps||[]).forEach(st=>{
    if(st.type==="strength" && tempoPhases(st.tempo)) n++;
    else if(st.type==="superset") (st.exercises||[]).forEach(e=>{ if(tempoPhases(e.tempo)) n++; });
  });
  return `<div class="card" id="taktCard">
    <div class="eyebrow" style="margin-bottom:8px">Takt · ${n} ${n===1?"Übung":"Übungen"} mit Tempo-Vorgabe</div>
    ${metroSettings(t,false,true)}
    <p class="muted" style="font-size:12.5px;margin:10px 0 0">
      Gilt für alle Sätze. Im Satz jederzeit über ⚙ änderbar. Der Vorlauf beginnt beim
      Antippen von „▶ Takt" — er muss nur reichen, um in Position zu gehen.</p>
  </div>`;
}
function toggleSilentBypass(){
  SILENT_BYPASS=!SILENT_BYPASS;
  try{ localStorage.setItem(BYPASS_KEY,SILENT_BYPASS?"1":"0"); }catch(e){}
  if(SILENT_BYPASS) silenceOn(); else silenceOff();
  const c=$("audioCard"); if(c) c.outerHTML=audioCard();
  toast(SILENT_BYPASS?"Töne auch im Stumm-Modus — Musik pausiert":"Musik läuft parallel weiter");
}
function testAudio(){
  unlockAudio(); cueWork();
  // resume() ist asynchron — Status erst nach kurzem Moment bewerten.
  setTimeout(()=>toast(audioLive()
    ? "Ton läuft. Nichts gehört? Lautstärke lauter stellen"
    : "Ton noch blockiert — Bildschirm antippen, dann erneut testen"),300);
}
// Eine "Stimme" zur absoluten Audio-Zeit t0, im Charakter klassischer Box-/Interval-Timer:
// satter Sinus-Grundton + Rechteck-Kante (Durchsetzung) + leise Sub-Oktave (Wucht), alles
// durch einen Tiefpass, der die schrillen Obertöne kappt → kräftig statt hell/dünn. Hüllkurve
// mit kurzem "Halten" gibt dem Beep Körper. Gibt ALLE Oszillatoren zurück, damit Pause/Skip
// (clearScheduled) sie zuverlässig stoppen können.
function _osc(freq,t0,dur,vol,type){
  const g=AC.createGain();
  const v=Math.min(0.95,(vol||0.2)*VOL);   // Boost + Schutz-Clamp; Limiter im Bus fängt Spitzen
  const mid=Math.min(dur*0.55, Math.max(0.04, dur-0.04));
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(v,t0+0.010);          // schneller, klickfreier Anstieg
  g.gain.exponentialRampToValueAtTime(v*0.55,t0+mid);       // kurzes Halten → Körper/Wucht
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);       // sattes Ausklingen
  const lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2600; lp.Q.value=0.6;
  lp.connect(g); g.connect(_bus||AC.destination);
  const oscs=[];
  const add=(f,wave,gain)=>{
    const o=AC.createOscillator(); o.type=wave; o.frequency.setValueAtTime(f,t0);
    const og=AC.createGain(); og.gain.value=gain;
    o.connect(og); og.connect(lp); o.start(t0); o.stop(t0+dur+0.05); oscs.push(o);
  };
  add(freq,"sine",0.78);      // satter Grundton
  add(freq,"square",0.42);    // Rechteck-Kante → setzt sich durch
  add(freq/2,"sine",0.22);    // Sub-Oktave → Wucht/Tiefe
  return oscs;
}
// sofortiger Ton — für Start-Cues, während die App im Vordergrund ist
function tone(freq,startSec,dur,vol=0.22,type="sine"){
  if(!AC) return; try{ _osc(freq,AC.currentTime+startSec,dur,vol,type); }catch(e){}
}
// motivierende Cues (Beginn einer Phase) — kräftige, tiefere Lage (Box-Timer-Charakter)
// Arbeit: satter "GO" auf A5, kurzer Lift nach B5 — energisch, nicht schrill
function cueWork(){ ensureAudio(); tone(880,0,.30,.46); tone(988,.26,.26,.42); vibrate([50,40,110]); }
// Pause: A5 → D5 abwärts — kräftiger Einsatz, dann ruhig
function cueRest(){ ensureAudio(); tone(880,0,.26,.36); tone(587,.24,.34,.28); vibrate(70); }
// Fertig: aufsteigendes E–A–C (E5–A5–C6) — voll & belohnend
function cueDone(){ ensureAudio(); tone(659,0,.16,.36); tone(880,.16,.18,.40); tone(1047,.34,.44,.46); vibrate([80,55,80,55,180]); }
// Mobility-Ende: tiefe, ruhige Quinte (G4 + D5) — bewusst zart
function cueSoft(){ ensureAudio(); tone(392,0,.32,.12); tone(587,.16,.30,.10); vibrate(40); }
// Ziel-Wdh. erreicht, Takt stoppt ("Satz ist voll, ablegen") — zwei klare Töne nach oben
// (A5→E6). Bewusst NICHT cueDone: das ist das Signal für die ganze Übung.
function cueTarget(){ ensureAudio(); tone(880,0,.16,.40); tone(1319,.15,.34,.44); vibrate([70,50,140]); }
// Anläuten zu Beginn eines Übergangs ("gleich geht's los") — kräftiges Ding-Ding (D5→A5)
function cueAnnounce(){ ensureAudio(); tone(587,0,.18,.34); tone(880,.17,.30,.42); vibrate([50,40,60]); }
function vibrate(p){ if(navigator.vibrate) try{navigator.vibrate(p);}catch(e){} }

/* ---------- vorab geplanter End-Alarm ----------
   Der Ton, der das Ende eines Blocks signalisiert, wird NICHT erst im
   onDone (requestAnimationFrame) erzeugt, sondern beim Timer-Start fest
   auf die Audio-Uhr gelegt. Dadurch klingelt es zuverlässig am Ende —
   auch wenn iOS rAF im Hintergrund/bei langer Laufzeit drosselt oder der
   Tab nicht aktiv ist (Voraussetzung: Bildschirm bleibt per Wake-Lock an,
   damit der AudioContext nicht suspendiert wird). Die geplanten Töne sind
   kündbar: Pause / Skip / +30s planen sie neu. */
let _sched=[];   // {o, at} — at = geplante Startzeit auf der AUDIO-Uhr
function _kill(e){ try{e.o.stop(0);}catch(_){} try{e.o.disconnect();}catch(_){} }
function clearScheduled(){ _sched.forEach(_kill); _sched=[]; }
// Am natürlichen Timer-Ende: den gerade anlaufenden Alarm freigeben (nicht stoppen),
// damit er beim Phasenwechsel nicht abreißt — inklusive der Folgetöne des Motivs, die
// definitionsgemäß Sekundenbruchteile später liegen (ALARM_SPAN). Alles, was WEITER in
// der Zukunft liegt, kann nur der Rest einer Planung sein, deren Audio-Uhr stillstand:
// das wird verworfen, sonst klingelt die letzte Phase in die nächste hinein.
const ALARM_SPAN=1.2;   // s — längstes Motiv (done) misst ~0.8 s
function releaseSounding(){
  if(!AC){ _sched=[]; return; }
  const horizon=AC.currentTime+ALARM_SPAN;
  _sched.forEach(e=>{ if(e.at>horizon) _kill(e); });
  _sched=[];
}
function schedTone(freq,atSec,dur,vol,type){
  if(!AC) return;
  try{
    const at=AC.currentTime+Math.max(0,atSec);
    _osc(freq,at,dur,vol,type).forEach(o=>_sched.push({o,at}));
  }catch(e){}
}
// Hintergrund-sichere Gegenstücke zu den cue*-Motiven (identische Notenwahl).
// go/rest beginnen bei Null mit kräftigem A5 — höher als die "1" (G5) → klarer Null-Akzent.
const ALARM={
  go:  [[880,0,.30,.46],[988,.26,.26,.42]],                      // satter GO + Lift
  rest:[[880,0,.26,.36],[587,.24,.34,.28]],                      // kräftig, dann abwärts
  done:[[659,0,.16,.36],[880,.16,.18,.40],[1047,.34,.44,.46]],   // voll & belohnend
  soft:[[392,0,.32,.12],[587,.16,.30,.10]],                      // tiefe, ruhige Quinte
};
// kind: "go" | "rest" | "done" | "soft" — Ton ans Ende eines durSec-Timers legen
function scheduleAlarm(kind,durSec){
  clearScheduled(); ensureAudio();
  if(!AC || !(durSec>0)) return;
  // 3-2-1-Countdown kurz vor Schluss (ansteigend D5–E5–G5) — bei "soft" (Mobility) bewusst ohne, damit Holds ruhig bleiben.
  // Die "0" selbst ist der kräftige erste Motiv-Ton (A5), liegt eine Stufe über der "1" (G5).
  if(kind!=="soft") [3,2,1].forEach(n=>{ if(durSec>n+0.25) schedTone({3:587,2:659,1:784}[n], durSec-n, .12, .36); });
  (ALARM[kind]||ALARM.go).forEach(([f,off,d,v])=>schedTone(f, durSec+off, d, v));
}

/* ---------- wake lock ---------- */
let wakeLock=null;
async function keepAwake(){
  try{
    if(!("wakeLock" in navigator)) return;
    if(wakeLock && !wakeLock.released) return;            // bereits aktiv
    wakeLock=await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release",()=>{ wakeLock=null; });
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ unlockAudio(); if(S.screen==="run") keepAwake(); } });
// PWA-Edge-Cases: nach bfcache-Restore und Focus-Wechsel ebenfalls reaktivieren.
window.addEventListener("pageshow",()=>{ unlockAudio(); if(S.screen==="run") keepAwake(); });
window.addEventListener("focus",()=>{ if(S.screen==="run") keepAwake(); });

/* ---------- Tempo-Metronom (Schema v7) — rein optisch ----------
   WARUM überhaupt: Tempo-Vorgaben ohne Taktgeber kommen nicht an — 3 s Exzentrik werden
   unter Last zuverlässig zu ~2 s, weil Mitzählen und sauber Ausführen um dieselbe
   Aufmerksamkeit konkurrieren.

   OPTIK ist der Hauptkanal: Balken (= Position, voll = unten), Phasenwort, Restsekunden
   und eine Tönung am Bildschirmrand fürs periphere Sehen.

   TON — dritter Anlauf, und diesmal Chris' eigener Entwurf (09.09.2026). Verworfen wurden
   davor: Klick ("stört"), Tonstufen ("hört man nicht raus"), Gleitton ("zu krass") — alle
   drei hatten dasselbe Problem, sie liefen DURCHGEHEND. Der Entwurf hier klingt nur an den
   UMKEHRPUNKTEN, und die Tonhöhe sagt, WO man ist:

       unten = tiefer Ton · oben = hoher Ton — nur diese zwei.

   Pro Wiederholung sind das 2 bis 4 kurze Töne statt eines Dauertakts:
       RDL 3-0-1   t=0 HOCH ●●   t=3 TIEF ●●          (Umkehr ohne Halt = Doppelton)
       RDL 3-2-1   t=0 HOCH ●●   t=3 TIEF ●   t=5 TIEF ●   (Halt unten = zwei einzelne,
                                                            der Abstand IST die Pause)
   Der Doppelton heißt also "ankommen und sofort zurück", zwei getrennte Töne heißen
   "ankommen … halten … los". Darauf kann man sich einsynchronisieren, ohne hinzusehen.

   Der Ton am Ziel (cueTarget) bleibt davon unberührt — er sagt "Satz voll". */
const METRO_PREP_KEY="coachRunner.metroPrep";
const METRO_SOUND_KEY="coachRunner.metroSound";
const METRO_LOOK=0.35;   // s Vorlauf, mit dem ein Ton auf die Audio-Uhr gelegt wird
const METRO_DBL=0.10;    // s Abstand der beiden Töne eines Doppeltons
const METRO_LO=392, METRO_HI=784;   // G4 / G5 — eine Oktave, unverwechselbar
const METRO_TONE_VOL=0.20;
let METRO_SOUND=true;
const METRO_LEAD=5;      // s Default-Vorlauf: reicht, um in Position zu gehen
const METRO_LEAD_MAX=180;
const METRO_SHORT=3;     // zweite Seite einer perSide-Übung: die Hantel ist schon in der Hand
let METRO_PREP=null;     // s; null = Vorgabe aus der Spec bzw. Default. Nutzerwahl schlägt Spec.
try{
  const p=parseFloat(localStorage.getItem(METRO_PREP_KEY));
  if(isFinite(p)&&p>=0) METRO_PREP=Math.min(60,p);
  METRO_SOUND = localStorage.getItem(METRO_SOUND_KEY)!=="0";
}catch(e){}
/* Kurzer Ton. Dreieck statt Sinus: setzt sich neben Musik durch, ohne zu stechen.
   Bewusst knapp (70 ms) — er markiert einen Zeitpunkt, er begleitet nicht. */
function _blip(freq,at,vol){
  if(!AC) return null;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(freq,at);
    const v=Math.min(0.9,(vol||METRO_TONE_VOL)*VOL);
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(v,at+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,at+0.07);
    o.connect(g); g.connect(_bus||AC.destination);
    o.start(at); o.stop(at+0.11);
    return o;
  }catch(e){ return null; }
}
/* Ton-Ereignisse EINER Wiederholung aus der Phasenliste.
   Position am Phasenbeginn: ecc startet oben, con startet unten, pause liegt unten,
   hold liegt oben. Doppelton, wenn zwei Bewegungsphasen direkt aufeinandertreffen —
   dann kehrt man ohne Halt um. Die Phasen sind zyklisch: vor der ersten liegt die letzte. */
const METRO_POS ={ ecc:"hi", pause:"lo", con:"lo", hold:"hi" };
const METRO_MOVE={ ecc:true, pause:false, con:true, hold:false };
function metroEvents(phases){
  const out=[]; let at=0;
  phases.forEach((p,i)=>{
    const prev=phases[(i-1+phases.length)%phases.length];
    out.push({ at, hi: METRO_POS[p.key]==="hi", double: !!(METRO_MOVE[prev.key] && METRO_MOVE[p.key]) });
    at+=p.sec;
  });
  return out;
}

function metroPrepSec(t,short){
  let v;
  if(METRO_PREP!=null) v=METRO_PREP;                 // Nutzerwahl schlägt die Spec
  else {
    // Achtung: Number(null) === 0 und isFinite(null) === true — ohne das t?-Gate würde
    // ein fehlendes tempo einen Vorlauf von 0 s ergeben, also Start ohne Bereitmachen.
    const p = t ? Number(t.prepSec) : NaN;
    v = (isFinite(p) && p>=0) ? Math.min(METRO_LEAD_MAX,p) : METRO_LEAD;
  }
  return short ? Math.min(METRO_SHORT,v) : v;
}

/* tempo-Feld → geordnete Phasenliste EINER Wiederholung.
   Fehlende/0-Werte fallen raus; con fällt auf 1 s zurück (eine Wdh. braucht ein Heben).
   start:"con" dreht den Zyklus (Klimmzug, Press, Row: es geht konzentrisch los). */
function tempoPhases(t){
  if(!t || typeof t!=="object" || Array.isArray(t)) return null;
  const n=k=>{ const v=Number(t[k]); return (isFinite(v)&&v>0)?Math.min(60,v):0; };
  const P={
    ecc  :{key:"ecc",  sec:n("ecc"),      label:"RUNTER", cls:"ecc",  level:p=>p},
    pause:{key:"pause",sec:n("pause"),    label:"HALTEN", cls:"hold", level:()=>1},
    con  :{key:"con",  sec:n("con")||1,   label:"HOCH",   cls:"con",  level:p=>1-p},
    hold :{key:"hold", sec:n("hold"),     label:"HALTEN", cls:"hold", level:()=>0}
  };
  const order = (t.start==="con") ? [P.con,P.hold,P.ecc,P.pause] : [P.ecc,P.pause,P.con,P.hold];
  const out=order.filter(p=>p.sec>0);
  return out.length?out:null;
}
/* Kompaktschreibweise für die Ziel-Zeile: Sekunden in Zyklus-Reihenfolge, "3-2-1".
   Nullen am Ende fallen weg, dazwischen bleiben sie (sonst verschiebt sich die Lesart). */
function tempoText(t){
  if(!t || typeof t!=="object" || Array.isArray(t)) return "";
  const n=k=>{ const v=Number(t[k]); return (isFinite(v)&&v>0)?v:0; };
  const seq = (t.start==="con") ? [n("con")||1,n("hold"),n("ecc"),n("pause")]
                                : [n("ecc"),n("pause"),n("con")||1,n("hold")];
  while(seq.length && !seq[seq.length-1]) seq.pop();
  if(!seq.length) return "";
  return seq.join("-");
}

const Metro = {
  raf:null, running:false, phases:null, cycle:0,
  startAt:0, reps:0, target:0, prefill:false,
  autoTarget:false, // am Ziel umschalten (nur wenn ein Zyklus == eine Wiederholung ist)
  overtime:false,   // Ziel erreicht: Zähler steht, Balken läuft weiter
  events:null, ei:0, cyc:0, sched:[],   // Ton-Ereignisse und ihr Abspiel-Zeiger

  start(tempo,target,prefill,shortPrep){
    const ph=tempoPhases(tempo); if(!ph) return false;
    this.stop(true);
    this.phases=ph;
    this.cycle=ph.reduce((a,p)=>a+p.sec,0);
    this.target=target||0; this.prefill=!!prefill;
    // Ziel-Umschaltung nur, wenn ein Zyklus wirklich EINE Wiederholung ist. Bei alternating
    // ist ein Zyklus eine Seite — dort gibt es weder Ziel noch Umschaltung (target=0).
    this.autoTarget = !!this.target && !!prefill;
    this.reps=0; this.overtime=false;
    this.events=metroEvents(ph); this.ei=0; this.cyc=0;
    ensureAudio(); keepAwake();
    this.startAt=performance.now()+metroPrepSec(tempo,shortPrep)*1000;
    this.running=true;
    this.loop();
    return true;
  },
  loop(){
    const step=()=>{
      if(!this.running) return;
      const now=performance.now();
      this.pump(now);
      this.paint((now-this.startAt)/1000);
      if(this.running) this.raf=requestAnimationFrame(step);
    };
    this.raf=requestAnimationFrame(step);
  },
  /* Töne kurz im Voraus auf die Audio-Uhr legen und dabei frisch aus der Wanduhr
     umrechnen. Friert iOS die Audio-Uhr ein, kann höchstens dieses Vorlauf-Fenster
     danebenliegen; Töne, deren Zeitpunkt beim Aufwachen vorbei ist, werden verworfen
     statt nachgeholt — ein verspäteter Ton zeigt den falschen Umkehrpunkt an.
     Der Zeiger läuft auch bei stummem Takt mit, damit er nach dem Einschalten sitzt. */
  pump(now){
    if(!this.events || !this.events.length) return;
    const horizon=now+METRO_LOOK*1000;
    const live = METRO_SOUND && AC && AC.state==="running";
    let guard=0;
    while(guard++<32){
      const e=this.events[this.ei];
      const wall=this.startAt+(this.cyc*this.cycle+e.at)*1000;
      if(wall>horizon) break;
      if(live && wall>=now-150){
        const at=AC.currentTime+Math.max(0,(wall-now)/1000);
        const f=e.hi?METRO_HI:METRO_LO;
        const o1=_blip(f,at,METRO_TONE_VOL); if(o1) this.sched.push(o1);
        if(e.double){ const o2=_blip(f,at+METRO_DBL,METRO_TONE_VOL); if(o2) this.sched.push(o2); }
      }
      this.ei++; if(this.ei>=this.events.length){ this.ei=0; this.cyc++; }
    }
    if(this.sched.length>32) this.sched.splice(0,this.sched.length-32);
  },
  paint(el){
    const bar=$("mtBar"), ph=$("mtPhase"), sec=$("mtSec"), card=$("metroCard"), track=$("mtTrack");
    if(!bar||!ph||!sec||!card) return;
    if(el<0){                                   // Bereitmachen
      ph.textContent="BEREIT"; sec.textContent=Math.ceil(-el)+" s";
      bar.style.width="0%"; bar.className="metro-fill";
      card.className="card metro metro-prep"; if(track) track.className="metro-track pulse";
      this.tint("prep"); return;
    }
    const cyc=Math.floor(el/this.cycle);
    let within=el-cyc*this.cycle, p=this.phases[0];
    for(const q of this.phases){ if(within<q.sec){ p=q; break; } within-=q.sec; }
    const frac=Math.min(1,Math.max(0,within/p.sec));
    bar.style.width=(p.level(frac)*100).toFixed(1)+"%";
    bar.className="metro-fill "+p.cls;
    ph.textContent=p.label;
    sec.textContent=(p.sec-within).toFixed(1)+" s";
    card.className="card metro metro-p-"+p.cls;
    if(track) track.className="metro-track"+(p.cls==="hold"?" pulse":"");
    this.tint(p.cls);
    // In der Verlängerung steht der Zähler. Bewusst: ab hier misst er die Zeit bis zum
    // Antippen mit, nicht die Wiederholungen — eine plausibel aussehende falsche Zahl wäre
    // schlimmer als gar keine. Die Zusatz-Wdh. trägt der Sportler selbst nach.
    if(this.overtime) return;
    if(cyc!==this.reps){
      this.reps=cyc;
      if(this.reps>=1 && S.sub) S.sub.metroUsed=true;
      const r=$("mtReps"); if(r) r.textContent=this.repsLabel();
      if(this.autoTarget && this.reps>=this.target) this.reachTarget();
    }
  },
  /* Ziel erreicht. Der Takt STOPPT NICHT — wer die Bells oben hat, macht ohne Absetzen
     weiter und braucht den Balken noch. Der Zähler friert ein, der Wdh.-Stepper bekommt
     JETZT den exakten Wert, und ab hier gehört die Zahl dem Sportler. */
  reachTarget(){
    this.overtime=true;
    if(this.prefill){
      S.sub.reps=this.reps;
      const v=$("v-reps"); if(v) v.textContent=this.reps;
    }
    cueTarget();
    const r=$("mtReps"); if(r) r.textContent="Ziel "+this.target+" ✓ · Zusatz selbst eintragen";
    const h=$("mtHead"); if(h) h.textContent="Ziel erreicht · Balken läuft weiter";
  },
  repsLabel(){ return "Wdh "+this.reps+(this.target?(" / "+this.target):""); },
  // Nur bei echtem Phasenwechsel anfassen: die Vignette ist bildschirmfüllend, und ein
  // Schreiben pro Frame würde den Gradienten 60×/s neu zeichnen lassen.
  _tintCls:undefined,
  tint(cls){
    if(cls===this._tintCls) return;
    const el=$("metroTint"); if(!el){ this._tintCls=cls; return; }
    this._tintCls=cls;
    if(!cls){ el.classList.remove("on"); return; }
    const c = cls==="ecc" ? "var(--rest)" : cls==="con" ? "var(--work)"
            : cls==="prep" ? "var(--accent)" : "var(--muted)";
    el.style.setProperty("--metro-c",c);
    el.classList.add("on");
  },
  // silent:true → nur aufräumen (Screen-Wechsel). silent:false → Nutzer-Stopp.
  stop(silent){
    const had=this.running, reps=this.reps, over=this.overtime;
    this.running=false;
    cancelAnimationFrame(this.raf); this.raf=null;
    this.sched.forEach(o=>{ try{o.stop(0);}catch(e){} try{o.disconnect();}catch(e){} });
    this.sched=[];
    this.tint(null); this._tintCls=undefined;
    if(silent) this.overtime=false;                  // Screen-Wechsel: Satz ist vorbei
    if(!had || silent) return 0;
    // Nach dem Ziel steht der exakte Wert längst im Stepper — und der Sportler hat ihn
    // womöglich schon von Hand um seine Zusatz-Wdh. korrigiert. Nicht überschreiben.
    if(over) return -1;
    if(this.prefill && reps>0){
      S.sub.reps=reps;
      const v=$("v-reps"); if(v) v.textContent=reps;
    }
    return reps;
  },
  // Satz-Button gedrückt, während der Takt läuft: Zählstand übernehmen statt verwerfen.
  harvest(){ if(this.running) this.stop(false); }
};

/* Takt-Karte. Erscheint NUR, wenn die Spec ein tempo-Feld liefert — der Coach entscheidet,
   wann Tempo eine Vorgabe ist; einen Von-Hand-Modus gibt es bewusst nicht. */
function metroCard(tempo,target,prefill,shortPrep){
  const ph=tempoPhases(tempo); if(!ph) return "";
  // Ohne Vorbelegung (alternating) ist ein Zyklus eine Seite, keine Wiederholung — dann
  // wäre ein Ziel-Vergleich falsch. Also kein Ziel anzeigen und keine Umschaltung.
  if(!prefill) target=0;
  const spec=tempoText(tempo);
  // Erste Phase zuerst nennen und explizit als Start markieren: ob eine Wiederholung mit
  // Heben oder Senken beginnt, hängt an der Übung (Press/Klimmzug/Row starten konzentrisch)
  // und muss VOR dem Start erkennbar sein — nicht erst am laufenden Phasenwort.
  const legend="ab "+ph[0].label+" · "+ph.map(p=>p.label.toLowerCase()+" "+p.sec+" s").join(" · ");
  const head=`Takt ${spec} · ${metroPrepSec(tempo,shortPrep)} s Vorlauf`;
  return `<div class="card metro" id="metroCard"
      data-target="${target||0}" data-prefill="${prefill?1:0}" data-short="${shortPrep?1:0}"
      data-head="${esc(head)}"
      data-tempo="${esc(JSON.stringify(tempo))}">
    <div class="metro-head">
      <div class="eyebrow" id="mtHead">${esc(head)}</div>
      <span class="chips">
        <button type="button" class="chip metro-sound" id="mtSound" onclick="metroToggleSound()"
          title="Umkehr-Töne an/aus">${METRO_SOUND?"🔊":"🔇"}</button>
        <button type="button" class="chip metro-sound" id="mtGear" onclick="metroToggleSettings()"
          title="Vorlauf einstellen">⚙</button>
      </span>
    </div>
    <div class="metro-row">
      <div class="metro-phase" id="mtPhase">BEREIT</div>
      <div class="metro-sec tnum" id="mtSec">${esc(spec)}</div>
    </div>
    <div class="metro-track" id="mtTrack"><div class="metro-fill" id="mtBar"></div></div>
    <div class="metro-foot">
      <span class="metro-reps tnum" id="mtReps">${esc(legend)}</span>
      <button type="button" class="btn sec sm" id="mtBtn" onclick="metroToggle()">▶ Takt</button>
    </div>
    ${metroSettings(tempo,shortPrep)}
  </div>`;
}
/* Einstellungen = nur noch der Vorlauf. Klang und Lautstärke sind mit dem Ton entfallen;
   was bleibt, ist die eine Zahl, die sich am Gerät entscheidet. */
function metroSettings(tempo,shortPrep,bare){
  const cur=metroPrepSec(tempo,shortPrep);
  return `<div class="${bare?"metro-set bare":"metro-set"}" ${bare?"":`id="mtSet" hidden`}>
    <div class="mset-row">
      <span class="mset-lab">Vorlauf <b class="mtPrepV">${cur} s</b></span>
      <input type="range" min="0" max="30" step="1" value="${cur}"
             oninput="metroSetPrep(this.value)" aria-label="Vorlauf in Sekunden">
    </div>
    <p class="muted" style="font-size:12px;margin:0">Zweite Seite automatisch ${METRO_SHORT} s.</p>
  </div>`;
}
function metroToggleSettings(){ const el=$("mtSet"); if(el) el.hidden=!el.hidden; }
/* Nur an/aus — keine Klangauswahl und kein Pegelregler. Es gibt genau einen Klang,
   und wenn seine Lautstärke nicht passt, ist das eine Konstante, keine Einstellung. */
function metroToggleSound(){
  METRO_SOUND=!METRO_SOUND;
  try{ localStorage.setItem(METRO_SOUND_KEY,METRO_SOUND?"1":"0"); }catch(e){}
  document.querySelectorAll("#mtSound").forEach(b=>b.textContent=METRO_SOUND?"🔊":"🔇");
  if(METRO_SOUND) ensureAudio();
  else { Metro.sched.forEach(o=>{ try{o.stop(0);}catch(e){} }); Metro.sched=[]; }
}
function metroSetPrep(v){
  METRO_PREP=Math.min(60,Math.max(0,Number(v)));
  try{ localStorage.setItem(METRO_PREP_KEY,METRO_PREP); }catch(e){}
  document.querySelectorAll(".mtPrepV").forEach(el=>el.textContent=METRO_PREP+" s");
  const h=$("mtHead"), card=$("metroCard");
  if(h && card && !Metro.running){
    card.dataset.head=`Takt ${tempoText(metroTempoOf(card))} · ${METRO_PREP} s Vorlauf`;
    h.textContent=card.dataset.head;
  }
}
// Karte in den Ruhezustand zurückversetzen (nach manuellem Stopp).
function metroPaintIdle(phaseWord,btnLabel){
  const card=$("metroCard"); if(!card) return;
  const ph=$("mtPhase"), sec=$("mtSec"), bar=$("mtBar"), track=$("mtTrack"), btn=$("mtBtn");
  const h=$("mtHead"); if(h) h.textContent=card.dataset.head||"";
  if(ph) ph.textContent=phaseWord;
  if(sec) sec.textContent=esc(tempoText(metroTempoOf(card)));
  if(bar){ bar.style.width="0%"; bar.className="metro-fill"; }
  if(track) track.className="metro-track";
  if(btn) btn.textContent=btnLabel;
  card.className="card metro";
  metroGearVisible(true);
}
/* Zahnrad und Vorlauf-Panel verschwinden, sobald der Takt läuft: während des Satzes soll
   die Karte nur noch Balken, Phase und Zähler zeigen. */
function metroGearVisible(on){
  const g=$("mtGear"); if(g) g.hidden=!on;      // Vorlauf ist während des Satzes sinnlos
  const s=$("mtSet"); if(s && !on) s.hidden=true;
  // Der Stumm-Schalter bleibt sichtbar: den will man genau dann, wenn es losgeht.
}
function metroToggle(){
  const card=$("metroCard"), btn=$("mtBtn"); if(!card) return;
  if(Metro.running){
    const reps=Metro.stop(false);
    Metro.overtime=false;
    metroPaintIdle("BEREIT","▶ Takt");
    const r=$("mtReps"); if(r) r.textContent=Metro.repsLabel();
    if(reps===-1) toast("Ziel-Wert steht — Zusatz-Wdh. selbst eintragen");
    else if(reps>0 && card.dataset.prefill==="1") toast(reps+" Wdh gezählt — kurz prüfen");
    return;
  }
  const ok=Metro.start(metroTempoOf(card), Number(card.dataset.target)||0,
                       card.dataset.prefill==="1", card.dataset.short==="1");
  if(ok){
    if(btn) btn.textContent="⏹ Stopp";
    metroGearVisible(false);
    const r=$("mtReps"); if(r) r.textContent=Metro.repsLabel();
  }
}
function metroTempoOf(card){ try{ return JSON.parse(card.dataset.tempo); }catch(e){ return null; } }
/* Zweite Seite einer perSide-Übung: lief die erste am Takt, startet die zweite von selbst.
   Grund: dort steht man mit der Hantel in der Hand am Gerät und kommt schlecht ans Handy —
   zweimal im Test blieb genau dieser Slot ohne Takt-Nachweis. Nur dort, nicht nach Pausen:
   nach einer Pause ändert man ggf. noch Last oder Wiederholungsziel. */
function metroAutoStart(){
  const card=$("metroCard"); if(!card || Metro.running) return;
  if(card.dataset.short!=="1") return;
  const rs=S.result && S.result.steps && S.result.steps[S.stepIdx];
  const prev=rs && rs.log && rs.log[rs.log.length-1];
  if(!prev || !prev.metronome) return;      // erste Seite lief ohne Takt → zweite auch nicht
  metroToggle();
}

/* ---------- timer engine ----------
   ZWEI UHREN: die Anzeige läuft auf performance.now() (Wanduhr), die Töne auf
   AC.currentTime (Audio-Uhr). iOS friert die Audio-Uhr ein, sobald es die
   Audio-Session unterbricht (Bildschirm aus, App-Wechsel, Anruf, Interrupt) —
   die Wanduhr läuft weiter. Ein vorab geplanter Alarm feuert dann genau um die
   Stillstandsdauer ZU SPÄT, also mitten in der nächsten Phase. Deshalb prüft der
   Loop jeden Frame, ob beide Uhren noch synchron laufen, und legt den Alarm bei
   Drift auf die verbleibende Wandzeit neu. */
const DRIFT_TOL=0.20;   // s Auseinanderlaufen, ab dem neu geplant wird
const Timer = {
  raf:null, endsAt:0, dur:0, onTick:null, onDone:null, paused:false, remainAtPause:0, endKind:null,
  _wallMark:0, _audMark:0,
  start(durSec,onTick,onDone,endKind){
    this.stop(); this.dur=durSec; this.endsAt=performance.now()+durSec*1000;
    this.onTick=onTick; this.onDone=onDone; this.paused=false; this.endKind=endKind||null;
    if(this.endKind) this.arm(durSec);   // End-Ton vorab auf die Audio-Uhr legen
    keepAwake();                         // Bildschirm während des Timers wach halten
    this.loop();
  },
  // Alarm (neu) planen und die Referenzpunkte beider Uhren setzen
  arm(remainSec){
    scheduleAlarm(this.endKind,remainSec);
    this._wallMark=performance.now(); this._audMark=AC?AC.currentTime:0;
  },
  // Audio-Uhr gegen Wanduhr prüfen; bei Stillstand Alarm auf Restzeit neu legen
  checkDrift(remain){
    if(!this.endKind || !AC || AC.state!=="running") return;
    const wall=(performance.now()-this._wallMark)/1000, aud=AC.currentTime-this._audMark;
    if(wall-aud>DRIFT_TOL && remain>0.15) this.arm(remain);
  },
  loop(){
    const step=()=>{
      if(this.paused) return;
      const remain=(this.endsAt-performance.now())/1000;
      if(this.onTick) this.onTick(Math.max(0,remain),this.dur);
      this.checkDrift(remain);
      if(remain<=0){
        // Natürliches Ende: der vorab geplante End-Alarm klingt JETZT. Ihn aus _sched
        // entlassen (nicht stoppen!), bevor stop()/der nächste Timer.start ihn per
        // clearScheduled abwürgen würde — sonst reißt der Ton beim Rundenwechsel ab.
        // Töne, die trotz allem noch in der Zukunft liegen, werden verworfen statt
        // freigegeben (releaseSounding) — sie wären nur noch ein Ton zur falschen Zeit.
        releaseSounding();
        this.stop(); if(this.onDone) this.onDone(); return;
      }
      this.raf=requestAnimationFrame(step);
    };
    this.raf=requestAnimationFrame(step);
  },
  remaining(){ return (this.endsAt-performance.now())/1000; },
  running(){ return !!this.raf && !this.paused; },
  pause(){ if(this.paused||!this.dur)return; this.paused=true; this.remainAtPause=this.remaining(); cancelAnimationFrame(this.raf); clearScheduled(); },
  resume(){ if(!this.paused)return; this.paused=false; this.endsAt=performance.now()+this.remainAtPause*1000; if(this.endKind) this.arm(this.remainAtPause); this.loop(); },
  add(sec){ this.endsAt+=sec*1000; if(this.endKind) this.arm(this.remaining()); },
  stop(){ cancelAnimationFrame(this.raf); this.raf=null; this.dur=0; this.paused=false; this.endKind=null; clearScheduled(); },
};
// count-up (cardio)
const UpTimer = {
  raf:null, startAt:0, onTick:null, paused:false, acc:0,
  start(onTick){ this.stop(); this.startAt=performance.now(); this.onTick=onTick; this.acc=0; this.paused=false; this.loop(); },
  loop(){ const step=()=>{ if(this.paused)return;
      const e=this.acc+(performance.now()-this.startAt)/1000; if(this.onTick)this.onTick(e);
      this.raf=requestAnimationFrame(step); }; this.raf=requestAnimationFrame(step); },
  pause(){ if(this.paused)return; this.paused=true; this.acc+=(performance.now()-this.startAt)/1000; cancelAnimationFrame(this.raf); },
  resume(){ if(!this.paused)return; this.paused=false; this.startAt=performance.now(); this.loop(); },
  elapsed(){ return this.paused?this.acc:this.acc+(performance.now()-this.startAt)/1000; },
  stop(){ cancelAnimationFrame(this.raf); this.raf=null; this.paused=false; this.acc=0; clearScheduled(); },
};

/* ---------- progress ring svg ---------- */
function ring(frac,sub,val){
  const r=100, c=2*Math.PI*r, off=c*(1-frac);
  return `<div class="ring">
    <svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="${r}" fill="none" stroke="var(--line)" stroke-width="14"/>
    <circle class="fg" cx="115" cy="115" r="${r}" fill="none" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
    <div class="center"><div class="t-val tnum">${val}</div><div class="t-sub">${sub}</div></div></div>`;
}

/* ============================================================
   JSON import / validation
   ============================================================ */
function extractJSON(raw){
  if(!raw) return null;
  let t=raw.trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(fence) t=fence[1].trim();
  try{ return JSON.parse(t); }catch(e){}
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} }
  return null;
}
// tempo (v7) prüfen: falsche Form fällt sonst still hinten runter und der Takt fehlt
// genau in der Einheit, für die er vorgegeben war.
function tempoErrs(t,where,errs){
  if(t==null) return;
  if(typeof t!=="object" || Array.isArray(t)){ errs.push(`${where}: "tempo" muss ein Objekt sein ({ecc,pause,con,hold,start}).`); return; }
  ["ecc","pause","con","hold"].forEach(k=>{
    if(t[k]!=null && (!isFinite(Number(t[k])) || Number(t[k])<0)) errs.push(`${where}: tempo.${k} muss eine Sekundenzahl ≥ 0 sein.`);
  });
  if(t.start!=null && t.start!=="ecc" && t.start!=="con") errs.push(`${where}: tempo.start muss "ecc" oder "con" sein.`);
  if(t.prepSec!=null && (!isFinite(Number(t.prepSec)) || Number(t.prepSec)<0 || Number(t.prepSec)>METRO_LEAD_MAX))
    errs.push(`${where}: tempo.prepSec muss zwischen 0 und ${METRO_LEAD_MAX} Sekunden liegen.`);
  // tempoPhases lässt con auf 1 s zurückfallen (damit {ecc:5} als Negativ-Vorgabe genügt).
  // Ein tempo, in dem NICHTS gesetzt ist, würde davon zu einem 1-s-Takt ohne Aussage —
  // das ist fast sicher ein Tippfehler und wird hier abgefangen, nicht stillschweigend gerendert.
  if(!["ecc","pause","con","hold"].some(k=>Number(t[k])>0))
    errs.push(`${where}: "tempo" enthält keine Sekundenangabe (mindestens ecc oder con > 0).`);
}
function validateSpec(o){
  const errs=[];
  if(!o||typeof o!=="object") return ["Kein gültiges JSON gefunden."];
  if(o.kind!=="workout-spec") errs.push('Feld "kind" muss "workout-spec" sein.');
  if(!Array.isArray(o.steps)||!o.steps.length) errs.push('"steps" fehlt oder ist leer.');
  (o.steps||[]).forEach((s,i)=>{
    const id = s.id ? `Schritt ${i+1} (${s.id})` : `Schritt ${i+1}`;
    if(!s.id) errs.push(`Schritt ${i+1}: "id" fehlt.`);
    if(!s.type){ errs.push(`Schritt ${i+1}: "type" fehlt.`); return; }
    switch(s.type){
      case "strength":
      case "plyo":
        if(!s.name) errs.push(`${id}: "name" fehlt.`);
        if(!s.sets) errs.push(`${id}: "sets" fehlt.`);
        if(s.repTarget==null) errs.push(`${id}: "repTarget" fehlt.`);
        if(s.type==="strength") tempoErrs(s.tempo,id,errs);
        else if(s.tempo!=null) errs.push(`${id}: "tempo" gibt es nur bei strength/superset — Plyo lebt von Explosivität, nicht von Zeitvorgaben.`);
        break;
      case "superset":
        if(!s.rounds) errs.push(`${id}: "rounds" fehlt.`);
        if(!Array.isArray(s.exercises) || !s.exercises.length) errs.push(`${id}: "exercises" leer.`);
        (s.exercises||[]).forEach((ex,j)=>tempoErrs(ex.tempo,`${id} · Übung ${j+1}`,errs));
        break;
      case "interval":
        if(!s.scheme) errs.push(`${id}: "scheme" fehlt (emom/intervals/tabata).`);
        if(!s.rounds) errs.push(`${id}: "rounds" fehlt.`);
        if(!s.workSec) errs.push(`${id}: "workSec" fehlt.`);
        break;
      case "circuit":
        if(!s.rounds) errs.push(`${id}: "rounds" fehlt.`);
        if(!Array.isArray(s.stations) || !s.stations.length) errs.push(`${id}: "stations" leer.`);
        break;
      case "cardio":
        // Nach normalizeSpec ist segments[] gesetzt; ohne segments + ohne durationMin = unbrauchbar
        if(!Array.isArray(s.segments) && s.durationMin==null) errs.push(`${id}: "segments" oder "durationMin" fehlt.`);
        if(Array.isArray(s.segments)){
          s.segments.forEach((seg,j)=>{ if(!seg.durationSec) errs.push(`${id} · Segment ${j+1}: "durationSec" fehlt.`); });
        }
        if(!s.modality) errs.push(`${id}: "modality" fehlt (row/run/bike).`);
        break;
      case "carry":
        if(!s.name) errs.push(`${id}: "name" fehlt.`);
        if(!s.rounds) errs.push(`${id}: "rounds" fehlt.`);
        break;
      case "mobility":
        if(!Array.isArray(s.poses) || !s.poses.length) errs.push(`${id}: "poses" leer.`);
        break;
      case "warmup":
      case "cooldown":
        // items[] empfohlen aber nicht zwingend
        break;
      default:
        errs.push(`${id}: unbekannter type "${s.type}".`);
    }
  });
  return errs;
}

/* v1 → v2 normalisieren: alte flache cardio-Felder in segments[] heben.
   Wirkt nur, wenn schemaVersion fehlt oder <2. Idempotent. */
function normalizeSpec(o){
  if(!o || typeof o!=="object") return o;
  if(o.schemaVersion && o.schemaVersion>=2) return o;
  (o.steps||[]).forEach(s=>{
    if(s.type!=="cardio") return;
    if(Array.isArray(s.segments) && s.segments.length) return;     // schon v2-Form
    const dur = (s.durationMin||30)*60;
    const seg = { durationSec: dur };
    if(s.targetHr) seg.targetHr = s.targetHr;
    if(s.targetSpm!=null){
      if(Array.isArray(s.targetSpm)) seg.targetSpm = {min:s.targetSpm[0], max:s.targetSpm[1]};
      else if(typeof s.targetSpm==="number") seg.targetSpm = {min:s.targetSpm, max:s.targetSpm};
      else seg.targetSpm = s.targetSpm;
    }
    if(s.cue) seg.cue = s.cue;
    s.segments = [seg];
    if(!s.totalDurationMin) s.totalDurationMin = s.durationMin;
  });
  o.schemaVersion = 2;
  return o;
}

/* ============================================================
   IMPORT screen
   ============================================================ */
function renderImport(){
  S.screen="import";
  const saved=loadSaved();
  setScreen(`
    <div style="padding-top:8px">
      <div class="brand">the.coach</div>
      <h1 style="margin:6px 0 4px">Workout laden</h1>
      <p class="muted" style="margin-bottom:18px">Den <b>workout-spec</b> JSON-Block aus dem Coach-Chat hier einfügen.</p>
      ${saved?`<div class="card celebrate" style="margin-bottom:14px">
        <div class="eyebrow">Unterbrochene Session</div>
        <div style="font-weight:750;margin:4px 0 12px">${esc(saved.spec?.meta?.focus||"Workout")} · ${saved.spec?.steps?.length||0} Schritte</div>
        <div class="btn-row">
          <button class="btn good sm" onclick="resumeSaved()">Fortsetzen</button>
          <button class="btn sec sm" onclick="discardSaved()">Verwerfen</button>
        </div></div>`:""}
      <div class="card">
        <textarea class="txt" id="jsonIn" rows="9" placeholder='{ "kind": "workout-spec", ... }'></textarea>
        <div id="impErr" style="margin-top:10px"></div>
      </div>
      <p class="muted center" style="font-size:12.5px">Läuft lokal · keine Daten verlassen dein Gerät</p>
    </div>`);
  setBar(`<button class="btn" onclick="doImport()">Workout einlesen</button>`);
}
function doImport(){
  unlockAudio();
  const raw=$("jsonIn").value;
  const o=extractJSON(raw);
  const errs=validateSpec(o);
  if(errs.length){
    $("impErr").innerHTML=`<div class="note" style="color:var(--accent-ink);border-color:var(--accent)">
      <b>Konnte nicht eingelesen werden:</b><br>${errs.map(esc).join("<br>")}</div>`;
    return;
  }
  if(o.schemaVersion && o.schemaVersion>SCHEMA){
    $("impErr").innerHTML=`<div class="note">Hinweis: Spec ist Schema v${o.schemaVersion}, App kennt v${SCHEMA}. Ich versuche es trotzdem.</div>`;
  }
  normalizeSpec(o);
  themeFromSpec(o);
  S.spec=o;
  S.result=JSON.parse(JSON.stringify(o));
  S.result.kind="workout-result";
  S.stepIdx=0; S.sub={}; S.startedAt=null;
  renderReady();
}

/* ============================================================
   READY / overview
   ============================================================ */
function focusTag(s){
  const map={strength:"Kraft",superset:"Superset",interval:"Intervall",circuit:"Core",cardio:"Ausdauer",carry:"Carry",warmup:"Warmup",cooldown:"Cooldown",mobility:"Mobility",plyo:"Plyo"};
  return map[s.type]||s.type;
}
function stepTitle(s){
  if(s.type==="warmup")return "Aufwärmen";
  if(s.type==="cooldown")return "Cooldown";
  if(s.type==="circuit")return s.label||"Core-Finisher";
  if(s.type==="interval")return s.label||"Intervall";
  if(s.type==="superset")return s.label||"Superset";
